<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>함께 짜는 시간표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Jua&display=swap">
<style>
/* 학교 시간표 — 방과후·돌봄 시간표(짜봄)와 같은 디자인: 학교 색 띠 머리글 + 패널 + 종이처럼 출력 */
:root {
  --bg: #f6faf8;
  --surface: #ffffff;
  --surface-2: #e6f3ee;
  --ink: #1b2420;
  --muted: #5b6862;
  --line: #d3e6de;
  --brand: #0d8667;
  --on-brand: #ffffff;
  --chalk: #ffd24d;
  --ok: #1e7346;
  --warn: #8a5700;
  --danger: #b3261e;
  --danger-bg: #fde8e6;
  --shade: rgba(60, 70, 65, 0.08);
  --shadow: 0 1px 2px rgba(20, 40, 30, 0.06), 0 6px 18px rgba(20, 40, 30, 0.06);
  --paper: #ffffff;
  --paper-ink: #1d2421;
  --paper-muted: #66716c;
  --paper-line: #9ea9a3;
  --paper-soft: #f2f5f3;
  --f-display: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --r: 12px;
}
/* 화면 밝기: 자동(기기 설정) · 주간 · 야간 — 출력 종이(.page)는 늘 흰 종이 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111714; --surface: #19211d; --surface-2: #212b26; --ink: #e6ede8; --muted: #9caaa3; --line: #2d3a33;
    --chalk: #e8b740; --ok: #5fc48d; --warn: #e3ac4a; --danger: #f08a80; --danger-bg: #3a1d1a; --shade: rgba(255, 255, 255, 0.06);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 22px rgba(0, 0, 0, 0.25);
    --paper: #1c2420; --paper-ink: #e6ede8; --paper-muted: #9caaa3; --paper-line: #3b4a42; --paper-soft: #242e29;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #111714; --surface: #19211d; --surface-2: #212b26; --ink: #e6ede8; --muted: #9caaa3; --line: #2d3a33;
    --chalk: #e8b740; --ok: #5fc48d; --warn: #e3ac4a; --danger: #f08a80; --danger-bg: #3a1d1a; --shade: rgba(255, 255, 255, 0.06);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 22px rgba(0, 0, 0, 0.25);
    --paper: #1c2420; --paper-ink: #e6ede8; --paper-muted: #9caaa3; --paper-line: #3b4a42; --paper-soft: #242e29;
    color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere; }
body.no-scroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.92em; background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }
:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main { padding-block: 18px 120px; display: flex; flex-direction: column; gap: 16px; }
.loading { padding: 80px 16px; text-align: center; color: var(--muted); }

.eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.06em; opacity: 0.85; }
.h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.4rem; line-height: 1.3; }
.h3 { font-size: 1.04rem; font-weight: 700; }
.muted { color: var(--muted); margin: 0; }
.hint { margin: 0; color: var(--muted); font-size: 0.9rem; }
.note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 0.92rem; }
.note.warn { background: #fff4d6; color: #5a4100; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .note.warn { background: #3a3014; color: #f3d48a; } }
:root[data-theme="dark"] .note.warn { background: #3a3014; color: #f3d48a; }
.empty { color: var(--muted); padding: 24px 0; margin: 0; text-align: center; }
.num { font-variant-numeric: tabular-nums; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 0.88rem; border-radius: 8px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: inline-grid; place-items: center; flex: none; }
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.link-btn { background: none; border: 0; padding: 4px 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 0.92rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-between { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.row-end { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* 입력 */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-weight: 600; font-size: 0.92rem; }
.field > span small { font-weight: 400; color: var(--muted); }
input[type="text"], input[type="password"], input[type="number"], input[type="time"], input:not([type]), select, textarea {
  width: 100%; min-height: 42px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
.check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--brand); flex: none; }
.grid-form { display: grid; gap: 14px; }
.grid-form.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-form.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.span2 { grid-column: 1 / -1; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.code-input { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.18em; text-transform: uppercase; font-size: 1.15rem !important; }

/* 칩 */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 0.9rem; cursor: pointer; font-weight: 500; color: var(--ink); }
.chip:hover { border-color: var(--brand); }
.chip.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 700; }
.chip:disabled { opacity: 0.4; cursor: not-allowed; }
.chip small { opacity: 0.75; font-weight: 400; }
.chip-label { font-size: 0.82rem; color: var(--muted); font-weight: 700; min-width: 44px; align-self: center; }
.chip-rows { display: flex; flex-direction: column; gap: 8px; }
.chip-rows > div { display: flex; gap: 8px; align-items: flex-start; }
.chip-rows > div > .chips { flex: 1; min-width: 0; }
.chip-label.as-btn { background: none; border: 0; border-radius: 8px; padding: 6px 8px; margin-left: -8px; cursor: pointer; font-family: inherit; text-align: left; text-decoration: underline dotted; text-underline-offset: 4px; min-height: 36px; }
@media (hover: hover) { .chip-label.as-btn:hover { background: var(--soft, rgba(0,0,0,.05)); color: var(--ink, inherit); } }
.chip-label.as-btn.on { color: var(--accent, #0f8a6a); text-decoration-style: solid; }

/* 패널 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel.narrow { max-width: 520px; width: 100%; margin: 0 auto; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.danger-zone { border-style: dashed; }

/* 머리글: 학교 색 띠 */
.school-bar { background: var(--brand); color: var(--on-brand); padding-top: env(safe-area-inset-top, 0px); }
.school-bar-in { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-block: 18px 14px; flex-wrap: wrap; }
.school-name { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.45rem, 4.5vw, 2rem); line-height: 1.2; }
.school-bar .me { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; }
.school-bar .me .btn { color: var(--on-brand); background: transparent; border-color: color-mix(in srgb, var(--on-brand) 45%, transparent); }
.me-badge { background: color-mix(in srgb, #000 18%, transparent); padding: 4px 10px; border-radius: 999px; font-weight: 600; }
.demo-banner { background: var(--chalk); color: #2b2100; font-size: 0.86rem; padding-block: 7px; }
.tabs-bar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 15; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 12px 16px; cursor: pointer; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; font-size: 0.98rem; }
.tab.on { color: var(--ink); border-bottom-color: var(--brand); }
.tab .lock { font-size: 0.8em; opacity: 0.7; }

/* 첫 화면 */
.landing { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding-block: 40px; gap: 16px; max-width: 620px; }
.landing-card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: clamp(22px, 5vw, 40px); display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.landing-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 10px; background: var(--brand); }
.landing-card .eyebrow { color: var(--brand); font-weight: 700; }
.landing-title { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.15; }
.join { display: flex; gap: 8px; }
.join input { flex: 1 1 auto; }
.demo-cta { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px dashed var(--line); color: var(--muted); }
.landing-foot { text-align: center; margin: 0; color: var(--muted); font-size: 0.88rem; }
.recent { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 0.88rem; color: var(--muted); }

/* ───── 시간표 표 (화면·출력 공통) ───── */
.g { width: 100%; border-collapse: collapse; table-layout: fixed; background: var(--paper); color: var(--paper-ink); font-size: var(--g-fs, 13px); }
.g th, .g td { border: 1px solid var(--paper-line); padding: 0; text-align: center; vertical-align: middle; }
.g thead th { background: var(--paper-soft); font-weight: 700; height: 2.3em; }
.g .g-corner { width: var(--g-pw, 58px); font-size: 0.8em; color: var(--paper-muted); }
.g .g-p { background: var(--paper-soft); line-height: 1.15; }
.g .g-p b { display: block; font-size: 1.05em; }
.g .g-p small { display: block; font-size: 0.72em; color: var(--paper-muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.g td { height: var(--g-rh, 64px); position: relative; }
.g .g-lunch th, .g .g-lunch td { height: auto; background: var(--paper-soft); color: var(--paper-muted); font-size: 0.78em; padding: 3px 0; }
.g .cell { position: absolute; inset: 2px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 2px 3px; overflow: hidden; background: var(--c-bg, transparent); color: var(--c-ink, inherit); border-left: 4px solid var(--c-line, transparent); }
.g .cell b { font-size: 1.12em; line-height: 1.2; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.g .cell small { font-size: 0.76em; line-height: 1.25; opacity: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.g .cell.conflict { background: repeating-linear-gradient(135deg, #fde3e0 0 6px, #fff 6px 12px); border-left-color: #d43d33; color: #8a1b14; }
.g .cell.conflict b { font-size: 0.95em; }

.page .g .cell.conflict { background: #fde3e0; }

/* 한눈에 보기 표 */
.mx-wrap { overflow-x: auto; }
.mx { border-collapse: collapse; table-layout: fixed; width: 100%; min-width: var(--mx-min, 900px); background: var(--paper); color: var(--paper-ink); font-size: var(--mx-fs, 12px); }
.mx th, .mx td { border: 1px solid var(--paper-line); text-align: center; padding: 0; height: var(--mx-rh, 30px); overflow: hidden; white-space: nowrap; }
.mx thead th { background: var(--paper-soft); font-weight: 700; height: auto; padding: 3px 0; }
.mx thead tr:last-child th { font-size: 0.85em; font-weight: 600; color: var(--paper-muted); }
.mx .mx-day { border-left: 2px solid var(--paper-ink); }
.mx td.d1 { border-left: 2px solid var(--paper-ink); }
.mx tbody th { background: var(--paper-soft); font-weight: 700; text-align: left; padding: 0 6px; width: var(--mx-lw, 92px); text-overflow: ellipsis; }
.mx tbody th small { color: var(--paper-muted); font-weight: 400; }
.mx td.f { background: var(--c-bg); color: var(--c-ink); font-weight: 600; line-height: 1.1; }
.mx td.f small { display: block; font-size: 0.78em; font-weight: 400; }
.mx td.x { background: #fde3e0; color: #8a1b14; font-weight: 700; }
.mx tbody tr.gsep th, .mx tbody tr.gsep td { border-top: 2px solid var(--paper-ink); }

/* 조회 화면 카드 */
.sheet-card { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.sheet-card .sheet-title { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; line-height: 1.2; }
.sheet-card .sheet-sub { margin: 0; color: var(--paper-muted); font-size: 0.9rem; }
.g-scroll { overflow-x: auto; }
.g-scroll .g { min-width: 620px; }
.hours { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.86rem; }
.hours span { display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px 3px 4px; border-radius: 999px; background: var(--paper-soft); color: var(--paper-ink); }
.hours i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; background: var(--c-bg); border: 2px solid var(--c-line); }
.hours b { font-variant-numeric: tabular-nums; }
.conflict-box { border: 1px solid #e5a29c; background: var(--danger-bg); color: var(--danger); border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; }
.conflict-box ul { margin: 6px 0 0; padding-left: 18px; }

/* ───── 입력 화면 ───── */
.who { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.who-name { font-weight: 700; font-size: 1.05rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 9px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--brand); color: var(--on-brand); }
.palette { display: flex; flex-wrap: wrap; gap: 6px; }
.brush { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px; border-radius: 10px; border: 2px solid var(--c-line, var(--line)); background: var(--c-bg, var(--surface)); color: var(--c-ink, var(--ink)); font-weight: 700; cursor: pointer; font-size: 0.92rem; }
.brush.on { box-shadow: 0 0 0 3px var(--ink); }
.brush.eraser { --c-line: var(--muted); --c-bg: var(--surface); --c-ink: var(--ink); border-style: dashed; }
.brush small { font-weight: 400; opacity: 0.8; }
.brush:disabled { opacity: 0.35; cursor: not-allowed; }
.ed-grid .g td { cursor: pointer; }
.ed-grid .g td:hover .cell.empty { background: var(--surface-2); }
.ed-grid .g .cell.empty::after { content: "+"; color: var(--paper-line); font-size: 1.2em; }
.ed-grid .g .cell.locked { background: repeating-linear-gradient(135deg, var(--shade) 0 6px, transparent 6px 12px), var(--c-bg, #eceeee); border-left-style: dotted; opacity: 0.8; cursor: not-allowed; }
.ed-grid .g .cell.locked::before { content: "🔒"; position: absolute; top: 2px; right: 4px; font-size: 10px; opacity: 0.7; }
.ed-grid .g .cell.busy { background: repeating-linear-gradient(135deg, var(--shade) 0 6px, transparent 6px 12px); color: var(--paper-muted); border-left: 4px dotted var(--paper-line); cursor: not-allowed; }
.ed-grid .g .cell.mine { box-shadow: inset 0 0 0 1px var(--c-line); }
.ed-grid .g td.flash .cell { animation: flash 0.5s; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--chalk); } to { box-shadow: none; } }
.save-state { font-size: 0.86rem; color: var(--muted); }
.save-state.saving { color: var(--warn); }
.save-state.err { color: var(--danger); font-weight: 700; }
.ed-layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 60px; }
.side .panel { padding: 14px; gap: 10px; }
.mini-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.88rem; }
.mini-list li { display: flex; justify-content: space-between; gap: 8px; }

/* ───── 설정 ───── */
.set-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th, .tbl td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl th { font-size: 0.82rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tbl td input, .tbl td select { min-height: 36px; padding: 4px 8px; }
.tbl .w-s { width: 90px; }
.tbl .w-xs { width: 64px; }
.tbl-wrap { overflow-x: auto; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; letter-spacing: 0.12em; background: var(--surface-2); padding: 3px 8px; border-radius: 6px; }
.grade-counts { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.grade-counts label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 0.9rem; }
.color-pick { display: flex; gap: 4px; flex-wrap: wrap; }
.color-pick button { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--c-line); background: var(--c-bg); cursor: pointer; padding: 0; }
.color-pick button.on { box-shadow: 0 0 0 2px var(--ink); }
.dirty-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 2px solid var(--brand); box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dirty-bar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }

/* ───── 출력 ───── */
.print-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.print-opts { position: sticky; top: 60px; }
.preview { display: flex; flex-direction: column; gap: 14px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 14px; min-height: 300px; }
.pv-page { box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18); background: #fff; overflow: hidden; flex: none; }
.pv-page > .page { transform-origin: 0 0; }
.pv-count { font-size: 0.86rem; color: var(--muted); align-self: stretch; }

/* 종이 한 장 (px = 96dpi 기준 A4) */
.page { background: #fff; color: #1d2421; font-family: var(--f-body); display: flex; flex-direction: column; padding: 30px 32px 26px; gap: 10px; overflow: hidden; --paper: #fff; --paper-ink: #1d2421; --paper-muted: #66716c; --paper-line: #9ea9a3; --paper-soft: #f2f5f3; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 2px solid #1d2421; padding-bottom: 8px; flex: none; }
.page-title { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.15; }
.page-kicker { font-size: 12px; color: #66716c; margin: 0 0 2px; }
.page-school { font-size: 14px; font-weight: 700; text-align: right; }
.page-school small { display: block; font-weight: 400; color: #66716c; font-size: 12px; }
.page-body { flex: 1 1 auto; min-height: 0; display: grid; gap: 14px 16px; }
.page-foot { flex: none; display: flex; justify-content: space-between; font-size: 10.5px; color: #66716c; }
.unit { display: flex; flex-direction: column; gap: 4px; min-height: 0; min-width: 0; }
.unit-title { font-weight: 700; font-size: var(--u-fs, 15px); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex: none; }
.unit-title small { font-weight: 400; color: #66716c; font-size: 0.8em; }
.unit .g { flex: 1 1 auto; height: 100%; }
.unit .g-box { flex: 1 1 auto; min-height: 0; display: flex; }
.unit .g td { height: auto; }
.unit.l1 .cell small { display: none; }
.unit.l2 .cell small ~ small { display: none; }
.unit .cell { line-height: 1.25; }
.unit .g .g-lunch th, .unit .g .g-lunch td { height: 1.7em; }
.unit .hours { font-size: calc(var(--g-fs, 13px) * 0.85); gap: 4px; flex: none; }
.unit .hours span { padding: 1px 8px 1px 3px; }
.page .mx { min-width: 0; }
.page .mx-box { flex: 1 1 auto; min-height: 0; }
.slips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; flex: 1 1 auto; align-content: start; }
.slip { border: 1px dashed #9ea9a3; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; height: 128px; }
.slip b { font-size: 17px; }
.slip small b { font-size: inherit; }
.slip .code { font-size: 22px; align-self: flex-start; background: #f2f5f3; }
.slip small { color: #66716c; font-size: 11px; }

/* 모달·알림 */
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(10, 20, 15, 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; }
.modal { background: var(--surface); color: var(--ink); width: 100%; max-width: 520px; border-radius: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
.modal-wide { max-width: 900px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 1.1rem; }
.modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.preview-img { width: 100%; border: 1px solid var(--line); border-radius: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 60; max-width: min(92vw, 560px); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); font-size: 0.92rem; }
.toast-error { background: var(--danger); color: #fff; }
.errs { background: var(--danger-bg); color: var(--danger); border-radius: 10px; padding: 10px 14px; font-size: 0.9rem; margin: 0; }

@media (max-width: 900px) {
  .ed-layout, .print-layout { grid-template-columns: minmax(0, 1fr); }
  .side, .print-opts { position: static; }
}
@media (max-width: 720px) {
  .grid-form.two, .grid-form.three { grid-template-columns: minmax(0, 1fr); }
  .grade-counts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .panel { padding: 16px; }
  .tab { padding: 11px 12px; }
}

/* 인쇄: 출력용 종이만 */
#print-root { display: none; }
@media print {
  body.printing > *:not(#print-root) { display: none !important; }
  body.printing #print-root { display: block; }
  body.printing #print-root .page { break-after: page; page-break-after: always; }
  body.printing #print-root .page:last-child { break-after: auto; page-break-after: auto; }
  body { background: #fff; }
}

/* 학년별 시정 · 묶음 · 협력 */
.g .g-note { caption-side: bottom; text-align: left; font-size: 0.75em; color: var(--paper-muted); padding-top: 4px; }
.g .cell.co { border: 2px solid var(--c-line); border-left-width: 4px; }
.g .cell.co::after { content: "협력"; position: absolute; bottom: 2px; right: 4px; font-size: 9px; font-weight: 700; opacity: 0.7; }
.ed-grid .g .cell.joinable { cursor: copy; opacity: 1; outline: 2px dashed var(--brand); outline-offset: -3px; }
.mx td.na { background: #e3e7e5; }
.sched { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
.sched .tbl input { background: var(--surface); }
.grade-sched { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.grade-sched label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 0.9rem; }
.grade-sched select { min-height: 36px; padding: 4px 8px; }
.ok { color: var(--ok); font-weight: 700; }
.warn { color: var(--warn); font-weight: 700; }
.join-toggle { padding: 8px 12px; border: 1px dashed var(--line); border-radius: 10px; }
.pick-times td, .pick-times th { padding: 3px; text-align: center; }
.pick-times .chip { min-width: 44px; justify-content: center; min-height: 30px; }
.block-ed { gap: 10px; }
.ap-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.ap-list fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
.ap-list legend { font-weight: 700; padding: 0 4px; }
.ap-prev { display: flex; flex-direction: column; gap: 4px; }
.ap-prev .g { --g-rh: 44px; font-size: 12px; }

/* 끌어 놓기 */
[data-drag="brush"], [data-drag="wbrush"] { touch-action: none; cursor: grab; }
.drag-h { cursor: grab; font-size: 1.2rem; color: var(--muted); padding: 4px 6px; touch-action: none; user-select: none; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
.drag-ghost { position: fixed; z-index: 100; pointer-events: none; padding: 6px 12px; border-radius: 10px; background: var(--c-bg, var(--surface)); color: var(--c-ink, var(--ink)); border: 2px solid var(--c-line, var(--brand)); font-weight: 700; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; font-size: 0.9rem; }
.drag-ghost small { display: none; }
.ed-grid td.drop-hover { outline: 3px solid var(--chalk); outline-offset: -3px; }
.ed-grid td[data-mine] { cursor: grab; }
tr.drop-above td { box-shadow: inset 0 3px 0 var(--brand); }
tr.drop-below td { box-shadow: inset 0 -3px 0 var(--brand); }
.theme-btn { min-width: 70px; }

/* 인증코드 안내문 (QR) */
.slip { flex-direction: row !important; align-items: center; justify-content: space-between; gap: 10px; height: 196px !important; }
.slip-t { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.slip-qr { width: 120px; height: 120px; image-rendering: pixelated; flex: none; }
@media (max-width: 720px) { .grade-sched { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.page .g .cell.co::after { display: none; }

/* 버전 */
.app-foot { border-top: 1px solid var(--line); color: var(--muted); font-size: 0.82rem; padding-block: 14px 90px; }
.app-foot .link-btn { font-size: inherit; color: inherit; }
.landing + .app-foot { padding-bottom: 24px; }
.update-bar { background: var(--chalk); color: #2b2100; position: sticky; top: 0; z-index: 40; font-size: 0.9rem; }
.update-bar .wrap { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding-block: 8px; flex-wrap: wrap; }
.changes { margin: 4px 0 0; padding-left: 20px; color: var(--muted); font-size: 0.92rem; }

/* 학년별 조회 · 직접 입력 과목 */
.grade-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 14px; }
.grade-view .sheet-card { padding: 14px; gap: 8px; }
.grade-view .sheet-title { font-size: 1.2rem; }
.grade-view .g { --g-rh: 46px; font-size: 12px; }
.grade-view .g-scroll .g { min-width: 440px; }
.brush.add { border-style: dashed; background: var(--surface); color: var(--muted); --c-line: var(--line); }
.brush.custom { border-style: dotted; }
.color-pick.big button { width: 32px; height: 32px; border-radius: 8px; }

/* 자동 생성 */
.auto-btn { margin-left: auto; }
.fill-info { display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: 0.9rem; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); }
.fill-tbl td, .fill-tbl th { padding: 5px 6px; }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 4px; background: var(--c-bg); border: 2px solid var(--c-line); vertical-align: -2px; }
.chip-check { position: relative; cursor: pointer; }
.chip-check input { position: absolute; opacity: 0; }
.chip-check span { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 0.88rem; }
.chip-check input:checked + span { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 700; }

.fill-tbl .check { align-items: center; }
.fill-tbl .check input { margin-top: 0; }

/* 첫 화면 학교 검색 */
.search-results { display: flex; flex-direction: column; gap: 6px; }
.search-results:empty { display: none; }
.sr-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; color: var(--ink); }
.sr-item:hover, .sr-item:focus-visible { border-color: var(--brand); }
.sr-item small { color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; }
.sr-none { padding: 4px 2px; }

/* 과목 설정 */
.subj-list { display: flex; flex-direction: column; gap: 6px; }
.subj-row { display: grid; grid-template-columns: 28px minmax(140px, 1.4fr) 84px calc(var(--gn, 6) * 33px) minmax(120px, 1fr) 76px; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); border-left: 5px solid var(--c-line, var(--line)); }
.subj-row.subj-head { border: 0; background: none; padding-block: 0; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.subj-row input, .subj-row select { min-height: 36px; padding: 4px 10px; }
.subj-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sw { display: inline-block; width: 18px; height: 18px; border-radius: 6px; background: var(--c-bg); border: 2px solid var(--c-line); flex: none; }
.g-toggles { display: inline-flex; gap: 3px; }
.gt { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 700; cursor: pointer; padding: 0; }
.gt.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.subj-tools { display: inline-flex; gap: 4px; align-items: center; }
.color-dd { position: relative; }
.color-dd summary { list-style: none; cursor: pointer; width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; }
.color-dd summary::-webkit-details-marker { display: none; }
.color-dd[open] .color-pick { position: absolute; right: 0; top: 40px; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; width: 180px; box-shadow: var(--shadow); }
.subj-row.drop-above { box-shadow: 0 -3px 0 var(--brand); }
.subj-row.drop-below { box-shadow: 0 3px 0 var(--brand); }
@media (max-width: 860px) {
  .subj-row { grid-template-columns: 28px 1fr 84px auto; }
  .subj-row .g-toggles { grid-column: 2 / 4; }
  .subj-row select { grid-column: 2 / 4; }
  .subj-row.subj-head { display: none; }
}
/* 교과전담 표시 */
.g .cell b .tag, .tag { font-style: normal; font-weight: 600; font-size: 0.62em; margin-left: 4px; padding: 0 5px; border-radius: 999px; background: color-mix(in srgb, var(--c-line, #888) 18%, transparent); vertical-align: 0.15em; letter-spacing: -0.02em; }
.page .g .cell b .tag { background: rgba(0, 0, 0, 0.07); }
.unit.l1 .cell b .tag { display: none; }
/* 미리보기 끌어 고치기 */
.pv td[data-mine] { cursor: grab; touch-action: none; }
.pv .cell.pv-other { opacity: 0.55; }
.pv td.drop-hover { outline: 3px solid var(--chalk); outline-offset: -3px; }
.pv-hint { margin-top: 2px; }

/* 숫자 칸 */
.numf { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); width: max-content; }
.numf:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
.numf input { width: 3.2em !important; min-height: 34px !important; border: 0 !important; border-radius: 0 !important; text-align: center; padding: 2px 4px !important; box-shadow: none !important; font-variant-numeric: tabular-nums; font-weight: 700; background: transparent; }
.nf-b { width: 32px; border: 0; background: var(--surface-2); color: var(--ink); font-size: 1.05rem; cursor: pointer; padding: 0; }
.nf-b:hover { background: color-mix(in srgb, var(--brand) 15%, var(--surface-2)); }
.grade-counts .numf { width: 100%; }
.grade-counts .numf input { flex: 1 1 auto; width: auto !important; }
.tbl .w-m { width: 120px; }
/* 점심시간 */
.lunch-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--surface); border: 1px dashed var(--line); font-size: 0.92rem; }
.lunch-row label { display: inline-flex; gap: 6px; align-items: center; }
.lunch-row input { width: 130px; min-height: 36px; padding: 4px 8px; }
.nf-b { flex: none; }
.numf input { min-width: 0; }
.grade-counts .numf { display: flex; }

.my-room select { min-height: 38px; }

/* 요일별 교시 수 */
.dayp-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--surface); border: 1px dashed var(--line); font-size: 0.92rem; }
.dayp-row label { display: inline-flex; gap: 4px; align-items: center; font-weight: 700; }
.dayp-row select { min-height: 34px; padding: 2px 6px; width: auto; }
.dayp-row label.odd select { border: 2px solid var(--brand); color: var(--brand); font-weight: 800; }
.dayp-row label.odd { color: var(--brand); }
.g td.beyond { background: repeating-linear-gradient(135deg, var(--paper-soft) 0 5px, transparent 5px 10px); }
.page .g td.beyond { background: #eef1ef; }
.ed-grid .g .cell.empty.beyond::after { content: "—"; }
.ed-grid .g .cell.beyond small { color: var(--paper-muted); }

/* 시정마다 시각이 다른 교시 (사람 시간표) */
.g .g-p small.pt { display: block; white-space: nowrap; letter-spacing: -0.02em; }
.g .g-p small.pt i { font-style: normal; font-weight: 700; margin-right: 3px; padding: 0 4px; border-radius: 4px; background: var(--shade); }
.g .cell small.sg { font-weight: 700; opacity: 1; padding: 0 5px; border-radius: 999px; background: color-mix(in srgb, var(--c-line, #888) 20%, transparent); }
.page .g .cell small.sg { background: rgba(0, 0, 0, 0.07); }
.g .cell.split { padding: 0; gap: 2px; background: none; border-left: 0; justify-content: stretch; align-items: stretch; }
.g .cell.split > .half { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 5px; overflow: hidden; background: var(--c-bg, transparent); color: var(--c-ink, inherit); border-left: 4px solid var(--c-line, transparent); padding: 0 3px; }
.g .cell.split > .half b { font-size: 0.92em; }
.g .cell.split > .half small { font-size: 0.68em; }
.g.g-wide { --g-pw: 84px; }
.g .cell small.sg i { font-style: normal; }
.ed-grid .g .cell small.sg span { display: none; }
.ed-grid .g .cell.split small.sg span:first-child { display: inline; }
/* 같은 교시 두 줄 (학년마다 시각이 다를 때) */
.g .g-p small.pt i { display: block; width: fit-content; margin: 1px auto; padding: 0 5px; border-radius: 999px; background: var(--chalk); color: #3a2c00; font-weight: 700; font-size: 0.95em; }
.page .g .g-p small.pt i { background: #ffe9a8; }
.g tr.g-split > th.g-p { background: color-mix(in srgb, var(--chalk) 14%, var(--paper-soft)); }
.page .g tr.g-split > th.g-p { background: #fff8e1; }
.ed-grid .g .cell.busy.other-row { opacity: 0.55; }
.ed-grid .g .cell.busy.lunch { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--chalk) 25%, transparent) 0 6px, transparent 6px 12px); color: var(--warn); }
/* 지금 단계 (학교 이름 옆) */
.school-name { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.stage { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; font-family: var(--f-body); font-size: 0.5em; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; vertical-align: middle; }
.stage b { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 1.15em; color: #fff; }
.stage.s1 { background: color-mix(in srgb, var(--chalk) 22%, transparent); color: var(--ink); border: 1.5px solid var(--chalk); }
.stage.s1 b { background: #b07900; }
.stage.s2 { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--ink); border: 1.5px solid var(--brand); }
.stage.s2 b { background: var(--brand); }
/* 처음 설정 안내 */
.panel.guide { border: 2px solid var(--brand); background: color-mix(in srgb, var(--brand) 5%, var(--surface)); }
.guide-steps { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.guide-steps button { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 12px 4px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
.guide-steps b { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--shade); color: var(--ink); font-size: 0.85em; }
.guide-steps li.on button { border-color: var(--brand); color: var(--ink); }
.guide-steps li.on b { background: var(--brand); color: var(--on-brand); }
.guide-steps li.done b { background: color-mix(in srgb, var(--brand) 30%, transparent); }
.guide-steps li.done b::after { content: ""; }
.panel.guide-nav { position: sticky; bottom: 8px; z-index: 5; box-shadow: var(--shadow); }
/* 요일별 교시 격자 */
.dayp { padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px dashed var(--line); }
.dayp-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 8px; }
.dayp-grid { border-collapse: separate; border-spacing: 4px; }
.dayp-grid th { font-size: 0.85em; font-weight: 700; color: var(--muted); padding: 0 6px; text-align: center; }
.dayp-grid tbody th { text-align: right; white-space: nowrap; }
.dayp-grid .dp { width: 46px; height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; font-weight: 700; cursor: pointer; transition: background 0.12s, border-color 0.12s; }
.dayp-grid .dp:hover { border-color: var(--brand); }
.dayp-grid .dp.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.dayp-grid .dp:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.school-bar .stage { border: 0; font-size: 0.46em; padding: 5px 14px 5px 5px; box-shadow: 0 1px 0 rgba(0,0,0,.12); }
.school-bar .stage.s1 { background: var(--chalk); color: #2b2100; }
.school-bar .stage.s1 b { background: #2b2100; color: var(--chalk); }
.school-bar .stage.s2 { background: #ffffff; color: #0a5c47; }
.school-bar .stage.s2 b { background: #0a5c47; color: #fff; }
/* 지우기 단추 */
.btn.danger-ghost { background: transparent; border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); color: var(--danger); }
.btn.danger-ghost:hover:not(:disabled) { background: var(--danger-bg); border-color: var(--danger); }
.btn.danger-ghost small { font-weight: 400; opacity: 0.8; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.clear-grid { display: grid; gap: 8px; }
.clear-grid .clr { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.clear-grid .clr select { min-width: 0; }
@media (max-width: 560px) { .clear-grid .clr { grid-template-columns: 1fr; } }
/* 직위 */
.chip.on-soft { cursor: default; background: var(--surface); }

      const key = x.grades.join(""), g = (G[key] = G[key] || { grades: x.grades, days: {} });
      const day = (g.days[x.d] = { p: {}, lunch: null, la: 0 });
      let n = 0;
      for (let r = hr + 1; r <= ws.rowCount; r++) {
        const cell = ws.getCell(r, x.c), mc = cell.master;
        if (mc.address !== cell.address && Number(/\d+$/.exec(mc.address)[0]) < r) continue; // 위에서 이어진 칸
        const t = txt(mc.value); if (!t) continue;
        const rs = tm(ws.getCell(r, 1).value), last = merges[mc.address] || r, re = tm(ws.getCell(last, 2).value);
        const tt = /(\d{1,2}):(\d{2})\s*~\s*(\d{1,2}):(\d{2})/.exec(t);
        const ts = tt ? `${tt[1].padStart(2, "0")}:${tt[2]}` : "", te = tt ? `${tt[3].padStart(2, "0")}:${tt[4]}` : "";
        const span = ts && ts === rs ? { s: ts, e: te } : { s: rs, e: re };
        const pm = /^(\d{1,2})\s*교시/.exec(t);
        if (pm) { n = Number(pm[1]); day.p[n] = span; }
        else if (/점심/.test(t) && !day.lunch) { day.lunch = span; day.la = n; }
      }
    });
    const most = (arr) => { const c = {}; arr.forEach((v) => (c[v] = (c[v] || 0) + 1)); return Object.keys(c).sort((a, b) => c[b] - c[a])[0]; };
    const out = Object.values(G).map((g) => {
      const ds = Object.keys(g.days).map(Number);
      const periods = Math.max(...ds.map((d) => Math.max(0, ...Object.keys(g.days[d].p).map(Number))));
      if (!periods) return null;
      const times = Array.from({ length: periods }, (_, k) => { const vs = ds.map((d) => g.days[d].p[k + 1]).filter(Boolean); const v = most(vs.map((x) => x.s + "-" + x.e)); return v ? { s: v.split("-")[0], e: v.split("-")[1] } : { s: "", e: "" }; });
      const dayP = {}; ds.forEach((d) => (dayP[d] = Math.max(0, ...Object.keys(g.days[d].p).map(Number)) || periods));
      const lus = ds.map((d) => g.days[d]).filter((x) => x.lunch);
      const lunchAfter = lus.length ? Number(most(lus.map((x) => x.la))) : 0;

  };
  // 시정표 자동 만들기 설정 (학교 하나에 하나)
  T.schedGenOf = (sc) => {
    const old = ((sc.schedules || []).find((x) => x.gen) || {}).gen || {};
    return { start: "09:00", lesson: 40, brk: 10, lunch: 40, ...old, ...(sc.schedGen || {}) };
  };
  // 과목을 묶어 보는 학년군 (기본설정 → 과목, 추가·삭제·순서 바꾸기)
  T.defaultSubjGroups = (level) => level === "elem" || level === "etc"

  T.subjectRoom = (sc, id) => { const x = T.subject(sc, id); return x && x.room && (T.room(sc, x.room)) ? x.room : ""; };
  // 칸 옆에 작게 붙이는 담당 표시 (교과전담·강사)
  T.roleTag = (sc, pid) => { const p = T.person(sc, pid); if (!p || p.role === "homeroom") return ""; const t = T.posOf(sc, p); return t.short || t.name; };
  T.defaultTimes = (level) =>
    level === "high"
      ? [["08:50", "09:40"], ["09:50", "10:40"], ["10:50", "11:40"], ["11:50", "12:40"], ["13:30", "14:20"], ["14:30", "15:20"], ["15:30", "16:20"], ["16:30", "17:20"], ["17:30", "18:20"]]
      : level === "elem" || level === "etc"
      ? [["09:00", "09:40"], ["09:50", "10:30"], ["10:40", "11:20"], ["11:30", "12:10"], ["12:50", "13:30"], ["13:40", "14:20"], ["14:30", "15:10"], ["15:20", "16:00"], ["16:10", "16:50"]]
      : [["08:50", "09:35"], ["09:45", "10:30"], ["10:40", "11:25"], ["11:35", "12:20"], ["13:10", "13:55"], ["14:05", "14:50"], ["15:00", "15:45"], ["15:55", "16:40"], ["16:50", "17:35"]];
  T.defaultRooms = (level) =>
    (level === "elem" || level === "etc"

  T.thisSchoolYear = () => {

  /* 학년군 기본 시정 (초등) — 2026 대전신계초 통합 시정표(2026. 3. 1.) 기준

  const TM = (a) => a.map(([s0, e0]) => ({ s: s0, e: e0 }));

    { id: "g12", name: "1·2학년", grades: [1, 2], periods: 5, lunchAfter: 3, lunch: { s: "11:30", e: "12:10" },
      times: TM([["09:00", "09:40"], ["09:50", "10:30"], ["10:40", "11:20"], ["12:10", "12:50"], ["12:50", "13:30"]]), dayP: { 1: 4, 2: 5, 3: 4, 4: 5, 5: 5, 6: 4 } },
    { id: "g34", name: "3·4학년", grades: [3, 4], periods: 6, lunchAfter: 3, lunch: { s: "11:30", e: "12:10" },
      times: TM([["09:00", "09:40"], ["09:50", "10:30"], ["10:40", "11:20"], ["12:10", "12:50"], ["12:50", "13:30"], ["13:40", "14:20"]]), dayP: { 1: 5, 2: 6, 3: 5, 4: 5, 5: 5, 6: 5 } },
    { id: "g56", name: "5·6학년", grades: [5, 6], periods: 6, lunchAfter: 4, lunch: { s: "12:10", e: "12:50" },
      times: TM([["09:00", "09:40"], ["09:50", "10:30"], ["10:40", "11:20"], ["11:30", "12:10"], ["12:50", "13:30"], ["13:40", "14:20"]]), dayP: { 1: 6, 2: 6, 3: 5, 4: 6, 5: 6, 6: 6 } },
  ];
  T.gradePreset = (level, times) => {
    if (level !== "elem") return { schedules: [{ id: "base", name: "기본 시정", periods: T.isSec(level) ? 7 : 6, lunchAfter: 4, times: T.clone(times || T.defaultTimes(level).map(([s0, e0]) => ({ s: s0, e: e0 }))) }], gradeSched: {} };
    const gs = {};
    const schedules = T.GRADE_PRESET.map((x) => {

  };
  T.newSchool = (name, level = "elem") => ({
    name: name || "",
    year: T.thisSchoolYear(),
    term: "1학기",
    level,
    classCounts: T.maxGrade(level) === 6 ? [3, 3, 3, 3, 3, 3] : [4, 4, 4],
    days: [1, 2, 3, 4, 5],
    periods: T.isSec(level) ? 7 : 6,
    schedGen: level === "high" ? { start: "08:50", lesson: 50, brk: 10, lunch: 50 } : T.isSec(level) ? { start: "08:50", lesson: 45, brk: 10, lunch: 50 } : { start: "09:00", lesson: 40, brk: 10, lunch: 40 },
    ...T.gradePreset(level, T.newSchedule("base", "기본 시정", level).times),
    assign: [],
    blocks: [],
    setupDone: false, // 처음 설정 안내를 마치면 true
    subjects: T.defaultSubjects(level),
    rooms: T.defaultRooms(level),
    people: [],
    homeroomOpen: false, // 1단계(교과전담·강사 먼저)로 시작
    createdAt: new Date().toISOString(),
  });

  /* ───── 학교 자료 읽기 ───── */
  T.gradeList = (sc) => (sc.classCounts || []).map((n, i) => ({ g: i + 1, n: Number(n) || 0 })).filter((x) => x.n > 0);
  T.classList = (sc) => {
    const out = [];
    T.gradeList(sc).forEach(({ g, n }) => { for (let c = 1; c <= n; c++) out.push({ id: `${g}-${c}`, g, c }); });
    return out;
  };
  T.classesOfGrade = (sc, g) => T.classList(sc).filter((x) => x.g === g);
  /* 학년·학급 이름 (직접 정할 수 있음: sc.gradeNames {학년: 이름}, sc.classNames {"3-1": "사랑반"})
     내부 학급 코드는 그대로 "학년-번호"; 화면에 보일 때만 이름을 씀. 지금 학교는 T.setNames(sc) 로 알려 줌 */
  T._names = { g: {}, c: {} };
  T.setNames = (sc) => { T._names = { g: (sc && sc.gradeNames) || {}, c: (sc && sc.classNames) || {} }; };
  T.gradeName = (g) => String(T._names.g[g] || "").trim() || `${g}학년`;
  T.clsLabel = (id) => String(T._names.c[id] || "").trim() || String(id);
  T.className = (id) => { const [g, c] = String(id).split("-"); const nm = String(T._names.c[id] || "").trim(); return nm ? `${T.gradeName(g)} ${nm}` : `${T.gradeName(g)} ${c}반`; };
  T.hasClass = (sc, id) => T.classList(sc).some((x) => x.id === id);
  T.dayList = (sc) => (sc.days || [1, 2, 3, 4, 5]).slice().sort((a, b) => a - b);

  /* ───── 시정표 (학년마다 다를 수 있음) ───── */
  // 예전 자료(시정표 하나: times·lunchAfter·periods)를 새 모양으로 맞춤
  T.normalize = (sc) => {
    if (!sc || typeof sc !== "object") return sc;
    if (!Array.isArray(sc.schedules) || !sc.schedules.length) {
      sc.schedules = [{ id: "base", name: "기본 시정", periods: Number(sc.periods) || 6, lunchAfter: Number(sc.lunchAfter) || 0, times: (sc.times || []).map((t) => ({ s: t.s || "", e: t.e || "" })) }];
    }
    delete sc.times; delete sc.lunchAfter;

    sc.schedules.forEach((x) => {

      if (x.dayP) Object.keys(x.dayP).forEach((d) => { const v = Number(x.dayP[d]) || 0; x.dayP[d] = Math.max(1, Math.min(x.periods, v || x.periods)); });
    });
    sc.periods = Math.max(...sc.schedules.map((x) => x.periods));
    return sc;
  };
  T.schedOfGrade = (sc, g) => (sc.schedules || []).find((x) => x.id === (sc.gradeSched || {})[g]) || (sc.schedules || [])[0] || { periods: Number(sc.periods) || 6, times: [], lunchAfter: 0 };
  T.gradeOf = (cls) => Number(String(cls).split("-")[0]) || 0;
  T.schedOfClass = (sc, cls) => T.schedOfGrade(sc, T.gradeOf(cls));
  T.usedScheds = (sc) => [...new Set(T.gradeList(sc).map(({ g }) => T.schedOfGrade(sc, g)))];
  T.multiSched = (sc) => T.usedScheds(sc).length > 1;
  // 한 사람이 들어가는 학급들의 시정 (없으면 학교 전체)
  T.personScheds = (sc, idx, pid) => {
    const all = T.usedScheds(sc);
    const its = (idx && idx.byPerson && idx.byPerson[pid]) || {};
    const set = new Set();
    Object.values(its).forEach((v) => (Array.isArray(v) ? v : [v]).forEach((it) => it && it.cls && set.add(T.schedOfClass(sc, it.cls))));

    return mine.length ? mine : all;
  };
  // 이 교시가 시정마다 시각이 다르거나, 어떤 시정은 점심 바로 뒤라서 헷갈리는지
  T.periodVaries = (scheds, p) => {
    const xs = (scheds || []).filter((x) => p <= x.periods);
    if (xs.length < 2) return false;
    const tk = new Set(xs.map((x) => { const v = (x.times || [])[p - 1] || {}; return (v.s || "") + "-" + (v.e || ""); }));
    const lb = new Set(xs.map((x) => Number(x.lunchAfter) === p - 1));
    return tk.size > 1 || lb.size > 1;
  };
  // 학년 묶음 이름: [1,2,3,4] → "1~4학년", [5,6] → "5·6학년"
  T.gradesLabel = (gs) => {
    const a = [...new Set(gs)].sort((x, y) => x - y);
    if (!a.length) return "";
    const runs = []; a.forEach((g) => { const r = runs[runs.length - 1]; if (r && g === r[1] + 1) r[1] = g; else runs.push([g, g]); });
    return runs.map(([x, y]) => (x === y ? `${x}` : y === x + 1 ? `${x}·${y}` : `${x}~${y}`)).join("·") + "학년";
  };
  T.schedGrades = (sc, sch) => T.gradeList(sc).map(({ g }) => g).filter((g) => T.schedOfGrade(sc, g) === sch);
  // 사람 시간표 교시 칸에 적을 시각 줄: [{ label, s, e }] (시정마다 다르면 여러 줄)
  T.periodHead = (sc, scheds, p) => {
    const xs = (scheds || []).filter((x) => p <= x.periods);
    const groups = new Map();
    xs.forEach((x) => { const v = (x.times || [])[p - 1]; if (!v || !v.s) return; const k = v.s + "~" + v.e; const g = groups.get(k) || { s: v.s, e: v.e, gs: [] }; g.gs.push(...T.schedGrades(sc, x)); groups.set(k, g); });

  };
  T.periodList = (sc) => Array.from({ length: Number(sc.periods) || 6 }, (_, i) => i + 1);
  T.periodsOf = (sc, cls) => T.schedOfClass(sc, cls).periods;

  T.dayPeriodsOf = (sch, d) => { const v = sch && sch.dayP ? Number(sch.dayP[d]) : 0; return v > 0 ? Math.min(v, sch.periods) : (sch ? sch.periods : 6); };

    const cnt = {}; days.forEach((d) => { const v = T.dayPeriodsOf(sch, d); cnt[v] = (cnt[v] || 0) + 1; });

  };
  T.dayPSummary = (sch, days) => {
    const vs = days.map((d) => T.dayPeriodsOf(sch, d));
    if (new Set(vs).size <= 1) return `모든 요일 ${vs[0] || sch.periods}교시`;
    const main = T.dayPMain(sch, days);
    const odd = days.map((d, k) => [d, vs[k]]).filter(([, v]) => v !== main);
    return odd.map(([d, v]) => `${T.DAYS[d]} ${v}교시`).join(" · ") + ` · 나머지 ${main}교시`;
  };
  T.beyond = (sc, cls, d, p) => p > T.dayPeriods(sc, cls, d);
  T.timeAt = (sc, cls, p) => (T.schedOfClass(sc, cls).times || [])[p - 1] || null;
  const toMin = (hm) => { const m = /^(\d{1,2}):(\d{2})$/.exec(hm || ""); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
  T.toMin = toMin;
  // 칸 하나의 실제 시각 (분). 시각이 없으면 교시 번호로만 비교
  T.span = (sc, cls, p) => {
    const t = T.timeAt(sc, cls, p);
    const a = t && toMin(t.s), b = t && toMin(t.e);
    return a != null && b != null && b > a ? { p, s: a, e: b } : { p };
  };
  T.overlap = (x, y) => (x.s != null && y.s != null ? x.s < y.e && y.s < x.e : x.p === y.p);
  // 표 하나를 그릴 때 쓸 시정 (학급·학급 교실은 그 학년 시정, 사람·특별실은 학교 전체)
  // 점심시간 시각: 정해 두지 않았으면 점심 앞 교시 끝 ~ 다음 교시 시작
  T.lunchTime = (sch) => {
    if (!sch || !sch.lunchAfter) return null;
    const l = sch.lunch || {};
    const a = l.s || (sch.times[sch.lunchAfter - 1] || {}).e || "", b = l.e || (sch.times[sch.lunchAfter] || {}).s || "";
    return a && b ? { s: a, e: b } : null;
  };
  T.gridSched = (sc, kind, id) => {
    if (kind === "person") { const x = T.gridSchedRaw(sc, kind, id); return { ...x, lunchAfter: 0 }; } // 교사 시간표에는 점심 줄을 넣지 않음
    return T.gridSchedRaw(sc, kind, id);
  };
  T.gridSchedRaw = (sc, kind, id) => {
    if (kind === "class") return T.schedOfClass(sc, id);
    if (kind === "room" && String(id).startsWith("hr:")) return T.schedOfClass(sc, id.slice(3));
    const used = T.usedScheds(sc);
    if (used.length <= 1) return used[0] || T.schedOfGrade(sc, 1);
    const la = new Set(used.map((x) => x.lunchAfter));
    return { periods: Number(sc.periods) || 6, times: [], lunchAfter: la.size === 1 ? used[0].lunchAfter : 0, mixed: true };
  };

  /* 사람·특별실 표 줄: 시정마다 같은 교시의 시각이 다르면 그 교시를 시각별로 나눠 시간 순서대로
     → [{ p, s, e, t(시작 분; null이면 그 교시 전체), label }] / 나눌 필요 없으면 null */
  T.timeRows = (sc, scheds, nP) => {
    const ps = Array.from({ length: nP }, (_, i) => i + 1);
    const heads = ps.map((p) => T.periodHead(sc, scheds, p));
    if (!heads.some((h) => h.length > 1)) return null;
    const rows = [];
    ps.forEach((p, i) => {
      const h = heads[i];
      if (h.length > 1) h.forEach((x) => rows.push({ p, s: x.s, e: x.e, t: T.toMin(x.s), label: x.label }));
      else rows.push({ p, s: h[0] ? h[0].s : "", e: h[0] ? h[0].e : "", t: null, label: "" });
    });
    const key = (r) => (r.s ? T.toMin(r.s) : r.p * 10000);
    return rows.map((r, i) => ({ ...r, i })).sort((a, b) => key(a) - key(b) || a.p - b.p || a.i - b.i);
  };
  T.rowItems = (sc, items, row) => (!row || row.t == null ? items : items.filter((it) => T.span(sc, it.cls, it.p).s === row.t));

  // 직접 입력한 과목: id = "~색~이름" (학교 과목 목록에 없어도 됨)
  T.customId = (name, color) => `~${T.COLORS[color] ? color : "gray"}~${String(name || "").trim().slice(0, 12)}`;
  T.isCustom = (id) => typeof id === "string" && id[0] === "~";
  T.subject = (sc, id) => {
    if (T.isCustom(id)) { const m = /^~([a-z]+)~(.+)$/.exec(id); if (m) return { id, name: m[2], short: m[2], color: T.COLORS[m[1]] ? m[1] : "gray", custom: true }; }
    return (sc.subjects || []).find((s) => s.id === id) || null;
  };
  T.subjectShort = (sc, id) => { const s = T.subject(sc, id); return s ? s.short || s.name : "?"; };
  T.subjectName = (sc, id) => { const s = T.subject(sc, id); return s ? s.name : "(지운 과목)"; };
  T.subjectColor = (sc, id) => T.subject(sc, id)?.color || "gray";

  T.person = (sc, pid) => (sc.people || []).find((p) => p.id === pid) || null;
  T.personName = (sc, pid) => {
    if (pid === T.ADMIN) return "관리자";
    const p = T.person(sc, pid);
    if (!p) return "(지운 사람)";
    return p.name || (p.role === "homeroom" && p.cls ? `${p.cls} 담임` : T.ROLES[p.role] || "이름 없음");
  };
  T.personDesc = (sc, pid) => {
    const p = T.person(sc, pid);
    if (!p) return "";
    if (p.role === "homeroom") return p.cls ? `${T.className(p.cls)} 담임` : "담임";
    const subj = p.subject ? T.subjectName(sc, p.subject) + " " : "";
    return `${subj}${T.posOf(sc, p).name}`.trim();
  };
  T.homeroomOf = (sc, cls) => (sc.people || []).find((p) => p.role === "homeroom" && p.cls === cls) || null;
  T.peopleSorted = (sc) => {
    const ord = (p) => T.ROLE_ORDER.indexOf(p.role);
    return (sc.people || []).slice().sort((a, b) => {
      if (ord(a) !== ord(b)) return ord(a) - ord(b);
      if (a.role === "homeroom") return clsKey(a.cls) - clsKey(b.cls);
      return (a.name || "").localeCompare(b.name || "", "ko");
    });
  };
  const clsKey = (id) => { if (!id) return 9999; const [g, c] = id.split("-").map(Number); return g * 100 + c; };
  T.clsKey = clsKey;

  // 장소: '' 또는 'hr:3-2' = 그 학급 교실, 'r1' 등 = 특별실
  T.room = (sc, rid) => (sc.rooms || []).find((r) => r.id === rid) || null;
  T.roomOfEntry = (cls, r) => (r ? r : `hr:${cls}`);
  T.roomName = (sc, rid) => {
    if (!rid) return "학급 교실";
    if (rid.startsWith("hr:")) return `${T.clsLabel(rid.slice(3))} 교실`;
    return T.room(sc, rid)?.name || "(지운 장소)";
  };
  T.roomList = (sc) => [
    ...(sc.rooms || []).map((r) => ({ id: r.id, name: r.name, special: true, multi: !!r.multi })),
    ...T.classList(sc).map((c) => ({ id: `hr:${c.id}`, name: `${T.clsLabel(c.id)} 교실`, special: false, cls: c.id })),
  ];

  /* ───── 시간표 색인 ─────
     slots: { pid: { e: { "3-2|1|3": { s: 과목id, r: 장소id } } } }
     → 학급별 / 사람별 / 장소별로 [요일|교시] 칸에 무엇이 있는지 */
  T.key = (cls, d, p) => `${cls}|${d}|${p}`;
  T.parseKey = (k) => { const [cls, d, p] = k.split("|"); return { cls, d: Number(d), p: Number(p) }; };

  /* 색인 만들기
     · 입력 칸: { s:과목, r:장소, j:1(함께 들어가기·협력) }
     · 묶음 수업(school.blocks): 여러 반 × 여러 교사가 같은 시간에 — 관리자가 정함
     한 칸의 '수업 단위(unit)': 묶음은 하나, 협력(j)은 본 수업에 붙음 → 단위가 둘 이상이면 겹침 */
  T.idxAdd = (sc, idx, it) => {
    const put = (map, id, dp) => ((map[id] = map[id] || {})[dp] = (map[id][dp] || [])).push(it);
    it.room = T.roomOfEntry(it.cls, it.r);
    it.sp = T.span(sc, it.cls, it.p);
    it.u = it.b ? `b:${it.b}` : it.j ? `j:${it.pid}:${it.k}` : `e:${it.pid}:${it.k}`;
    const dp = `${it.d}|${it.p}`;
    put(idx.byClass, it.cls, dp);
    put(idx.byPerson, it.pid, dp);
    put(idx.byRoom, it.room, dp);
    put(idx.personDay, it.pid, it.d);
    put(idx.roomDay, it.room, it.d);
  };
  T.buildIndex = (sc, slots, { conflicts = true } = {}) => {
    const classes = new Set(T.classList(sc).map((c) => c.id));
    const days = new Set(T.dayList(sc));
    const idx = { byClass: {}, byPerson: {}, byRoom: {}, personDay: {}, roomDay: {}, hidden: 0 };
    const valid = (cls, d, p) => classes.has(cls) && days.has(d) && p >= 1 && p <= T.periodsOf(sc, cls);
    Object.entries(slots || {}).forEach(([pid, doc]) => {
      Object.entries((doc && doc.e) || {}).forEach(([k, v]) => {
        const { cls, d, p } = T.parseKey(k);
        if (!v || !valid(cls, d, p)) { idx.hidden++; return; }
        T.idxAdd(sc, idx, { pid, cls, d, p, s: v.s || "", r: v.r || "", j: !!v.j, k });
      });
    });
    (sc.blocks || []).forEach((bk) => {
      (bk.times || []).forEach((dp) => {
        const [d, p] = String(dp).split("|").map(Number);
        (bk.classes || []).forEach((cls) => {
          if (!valid(cls, d, p)) return;
          (bk.members || []).forEach((m) => { if (m.pid) T.idxAdd(sc, idx, { pid: m.pid, cls, d, p, s: bk.s || "", r: m.r || "", b: bk.id, k: null }); });
        });
      });
    });
    idx.conflicts = conflicts ? T.findConflicts(sc, idx) : [];
    return idx;
  };
  // 칸 안 항목을 수업 단위로 묶기: [{ main, joins:[], block, items }]
  T.units = (items) => {
    const blocks = {}, mains = [], joins = [];
    items.forEach((it) => {
      if (it.b) (blocks[it.b] = blocks[it.b] || []).push(it);
      else if (it.j) joins.push(it);
      else mains.push(it);
    });
    const out = mains.map((m) => ({ main: m, joins: [], items: [m] }));
    Object.entries(blocks).forEach(([b, its]) => out.push({ main: its[0], block: b, joins: [], items: its }));
    joins.forEach((j) => {
      const host = out.find((u) => !u.block && u.main.cls === j.cls) || out.find((u) => u.main.cls === j.cls);
      if (host) { host.joins.push(j); host.items.push(j); } else out.push({ main: j, joins: [], items: [j], orphan: true });
    });
    return out;
  };
  T.findConflicts = (sc, idx) => {
    const out = [];
    // 학급: 같은 칸에 수업 단위가 둘 이상
    Object.entries(idx.byClass).forEach(([id, cells]) => Object.entries(cells).forEach(([dp, items]) => {
      if (T.units(items).length > 1) { const [d, p] = dp.split("|").map(Number); out.push({ kind: "class", id, d, p, items }); }
    }));
    // 사람·특별실: 실제 시각이 겹치는 서로 다른 단위 (학년마다 시정이 달라도 정확히)
    const scan = (map, kind) => Object.entries(map).forEach(([id, dayMap]) => Object.entries(dayMap).forEach(([d, items]) => {
      if (kind === "room") {
        if (id.startsWith("hr:")) return; // 학급 교실은 학급 검사로 충분
        if (T.room(sc, id)?.multi) return;
      }
      const seen = new Set();
      for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
        const a = items[i], b = items[j];
        if (a.u === b.u || (kind === "person" && a.b && a.b === b.b)) continue;
        if (kind === "room" && ((a.j && a.cls === b.cls) || (b.j && a.cls === b.cls))) continue; // 협력은 같은 교실
        if (!T.overlap(a.sp, b.sp)) continue;
        const key = [a.u, b.u].sort().join("~");
        if (seen.has(key)) continue;
        seen.add(key);
        out.push({ kind, id, d: Number(d), p: a.p, items: [a, b] });
      }
    }));
    scan(idx.personDay, "person");
    scan(idx.roomDay, "room");
    return out;
  };
  T.cellItems = (idx, kind, id, d, p) => {
    const map = kind === "class" ? idx.byClass : kind === "person" ? idx.byPerson : idx.byRoom;
    return (map[id] && map[id][`${d}|${p}`]) || [];
  };
  // 이 사람이 (학급 cls, d요일 p교시)에 들어가면 겹치는 다른 수업 (except: 무시할 항목)
  T.personBusy = (sc, idx, pid, cls, d, p, except = () => false) => {
    const sp = T.span(sc, cls, p);
    return ((idx.personDay[pid] || {})[d] || []).find((it) => !except(it) && T.overlap(sp, it.sp)) || null;
  };
  /* 점심시간 확보: 학년마다 점심이 다르면 (예: 11:30~12:10, 12:10~12:50) 교과전담·강사는
     그 사이(11:30~12:50)에 점심 한 번(가장 짧은 점심 길이) 이상 비어 있어야 함 */
  T.lunchWindow = (sc) => {
    const ls = T.usedScheds(sc).map((x) => T.lunchTime(x)).filter(Boolean)
      .map((t) => ({ s: T.toMin(t.s), e: T.toMin(t.e) })).filter((t) => t.s != null && t.e != null && t.e > t.s);
    if (new Set(ls.map((t) => t.s + "-" + t.e)).size < 2) return null;
    return { s: Math.min(...ls.map((t) => t.s)), e: Math.max(...ls.map((t) => t.e)), need: Math.min(...ls.map((t) => t.e - t.s)) };
  };
  T.needsLunch = (sc, pid) => { const p = T.person(sc, pid); return !!p && p.role !== "homeroom"; };
  const hm = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  T.hm = hm;
  // add: 새로 넣을 칸의 시각 {s,e}, except: 빼고 볼 항목 → 점심이 확보되면 true
  T.lunchFree = (sc, idx, pid, d, add, except = () => false) => {
    const w = T.lunchWindow(sc);
    if (!w || !T.needsLunch(sc, pid)) return true;
    const busy = ((idx.personDay[pid] || {})[d] || []).filter((it) => !except(it)).map((it) => it.sp);
    if (add) busy.push(add);
    const iv = busy.filter((x) => x && x.s != null && x.e > w.s && x.s < w.e).map((x) => [Math.max(w.s, x.s), Math.min(w.e, x.e)]).sort((a, b) => a[0] - b[0]);
    let cur = w.s, gap = 0;
    iv.forEach(([a, b]) => { gap = Math.max(gap, a - cur); cur = Math.max(cur, b); });
    gap = Math.max(gap, w.e - cur);
    return gap >= w.need;
  };
  T.lunchMsg = (sc) => { const w = T.lunchWindow(sc); return w ? `점심시간을 위해 ${hm(w.s)}~${hm(w.e)} 사이에 한 시간은 비워 두어야 합니다.` : ""; };
  // 한 사람 시간표에서 요일마다 점심이 확보 안 된 날
  T.lunchMissing = (sc, idx, pid) => (T.lunchWindow(sc) && T.needsLunch(sc, pid) ? T.dayList(sc).filter((d) => !T.lunchFree(sc, idx, pid, d)) : []);
  // 선생님 불가 시간 (출장·연수·겸임 등): person.na = ["요일|교시"]
  // 장소 하나에 배정된 수업 (주 시간·많은 순)
  T.roomLoad = (sc, idx, rid) => {
    const m = (idx.byRoom && idx.byRoom[rid]) || {};
    const units = new Set(), by = {};
    Object.values(m).forEach((its) => its.forEach((it) => { if (it.j) return; const u = it.b ? `b:${it.b}:${it.d}|${it.p}` : it.k; if (units.has(u)) return; units.add(u); by[it.cls] = (by[it.cls] || 0) + 1; }));
    const top = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([c, n]) => `${c} ${n}`).join(" · ");
    return { total: units.size, top };
  };
  T.isNA = (sc, pid, d, p) => { const x = T.person(sc, pid); return !!(x && Array.isArray(x.na) && x.na.includes(`${d}|${p}`)); };
  T.roomBusy = (sc, idx, rid, cls, d, p, except = () => false) => {
    if (!rid || rid.startsWith("hr:")) return null;
    const r = T.room(sc, rid);
    if (!r || r.multi) return null;
    const sp = T.span(sc, cls, p);
    return ((idx.roomDay[rid] || {})[d] || []).find((it) => !except(it) && T.overlap(sp, it.sp)) || null;
  };
  // 과목별 시수: 수업 단위로 셈 (묶음 수업은 여러 반이어도 1시간, 협력은 본인 시수에만)
  T.hoursBy = (idx, kind, id) => {
    const map = kind === "class" ? idx.byClass : kind === "person" ? idx.byPerson : idx.byRoom;
    const out = {};
    let total = 0;
    Object.values(map[id] || {}).forEach((items) => {
      const us = kind === "person" ? [...new Map(items.map((it) => [it.b ? "b" + it.b : it.k, it])).values()].map((m) => ({ main: m })) : T.units(items);
      us.forEach((u) => { out[u.main.s] = (out[u.main.s] || 0) + 1; total++; });
    });
    return { by: out, total };
  };
  T.blockName = (sc, bid) => (sc.blocks || []).find((b) => b.id === bid)?.name || "묶음 수업";
  T.conflictText = (sc, c) => {
    const where = c.kind === "class" ? c.id : c.kind === "person" ? T.personName(sc, c.id) + " 선생님" : T.roomName(sc, c.id);
    const what = c.items.map((it) => `${it.cls} ${it.b ? T.blockName(sc, it.b) : T.subjectShort(sc, it.s)}(${T.personName(sc, it.pid)})`).join(", ");
    return `${where} · ${T.DAYS[c.d]} ${c.p}교시 — ${what}`;
  };

  /* ───── 교과전담 배정 (학년 × 과목 → 담당 교사·주당 시수) ───── */
  T.assignOf = (sc, g) => (sc.assign || []).filter((a) => a.g === g);
  // 배정 하나가 학급별로 몇 시간 들어갔는지
  // 이 배정이 맡는 반 (a.classes 가 없으면 그 학년 모든 반)
  T.assignClasses = (sc, a) => T.classesOfGrade(sc, a.g).map((c) => c.id).filter((c) => !Array.isArray(a.classes) || a.classes.includes(c));
  T.assignDone = (sc, slots, a) => {
    const out = {};
    T.assignClasses(sc, a).forEach((c) => (out[c] = 0));
    Object.entries((slots[a.pid] && slots[a.pid].e) || {}).forEach(([k, v]) => {
      if (!v || v.j || v.s !== a.s) return;
      const cls = k.split("|")[0];
      if (cls in out) out[cls]++;
    });
    return out;
  };
  // 이 학년에서 전담이 맡는 과목 (담임 화면 안내용)
  T.subjectRoleInGrade = (sc, g, s) => (sc.assign || []).filter((a) => a.g === g && a.s === s);

  /* ───── 교담 시간표 자동 배치 ─────
     assigns: 배치할 배정 목록, opt: { pmin, pmax, reset, sameDay(같은 반 같은 날 두 번 허용), tries }
     빈 칸(그 반·그 교사·그 특별실이 모두 비어 있는 시각)에만 넣고, 요일마다 고르게 퍼지도록 점수를 매겨 여러 번 시도해 가장 좋은 결과를 고름 */
  T.autoPlace = (sc, slots, assigns, opt = {}) => {
    const days = T.dayList(sc);
    const pmin = Math.max(1, Number(opt.pmin) || 1), pmax = Math.min(9, Number(opt.pmax) || 9);
    const base = T.clone(slots || {});
    const pids = new Set(assigns.map((a) => a.pid));
    if (opt.reset) assigns.forEach((a) => {
      const e = (base[a.pid] && base[a.pid].e) || {};
      Object.keys(e).forEach((k) => { const c = k.split("|")[0]; if (T.gradeOf(c) === a.g && (!Array.isArray(a.classes) || a.classes.includes(c)) && e[k].s === a.s && !e[k].j) delete e[k]; });
    });
    // 반을 나눠 맡기로 바꾼 뒤: 이제 그 선생님이 맡지 않는 반의 같은 과목 칸도 지움
    if (opt.reset) assigns.forEach((a) => {
      const e = (base[a.pid] && base[a.pid].e) || {};
      const mineCls = new Set(assigns.filter((x) => x.pid === a.pid && x.s === a.s && x.g === a.g).flatMap((x) => T.assignClasses(sc, x)));
      Object.keys(e).forEach((k) => { const c = k.split("|")[0]; if (T.gradeOf(c) === a.g && e[k].s === a.s && !e[k].j && !mineCls.has(c)) delete e[k]; });
    });
    Object.entries(opt.pinned || {}).forEach(([pid, m]) => { const e = ((base[pid] = base[pid] || { e: {} }).e = base[pid].e || {}); Object.entries(m || {}).forEach(([k, v]) => (e[k] = T.clone(v))); });
    const tasks = [];
    assigns.forEach((a) => {
      const done = T.assignDone(sc, base, a);
      Object.entries(done).forEach(([cls, n]) => {
        if (Array.isArray(a.classes) && !a.classes.includes(cls)) return;
        const need = (Number(a.h) || 0) - n;
        if (need > 0) tasks.push({ a, cls, need });
      });
    });
    const wanted = tasks.reduce((n, t) => n + t.need, 0);
    let seed = opt.seed || 12345;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
    let best = null;
    const tries = opt.tries || 60;
    for (let t = 0; t < tries; t++) {
      const work = T.clone(base);
      const idx = T.buildIndex(sc, work, { conflicts: false });
      const load = {}; // 교사·요일별 시수
      Object.entries(idx.personDay).forEach(([pid, dm]) => Object.entries(dm).forEach(([d, its]) => (load[pid + "|" + d] = new Set(its.map((i) => i.u)).size)));
      // 한 반씩 돌아가며 한 시간씩 (어느 반만 몰리지 않게), 시도마다 순서를 조금 섞음
      const units = [];
      const order = tasks.map((x) => ({ ...x, left: x.need, r: rnd() })).sort((x, y) => y.left - x.left || x.r - y.r);
      let more = true;
      while (more) { more = false; order.forEach((x) => { if (x.left > 0) { units.push(x); x.left--; more = true; } }); }
      let score = 0, placed = 0;
      const missing = [];
      for (const u of units) {
        const { a, cls } = u;
        const person = T.person(sc, a.pid);
        const room = a.r !== undefined ? a.r || "" : T.defaultRoomFor(sc, a.pid, a.s);
        const maxP = Math.min(pmax, T.periodsOf(sc, cls));
        const dayMax = (d) => Math.min(maxP, T.dayPeriods(sc, cls, d));
        const sameSubjDays = (d) => Object.entries((work[a.pid] && work[a.pid].e) || {}).filter(([k, v]) => k.startsWith(cls + "|" + d + "|") && v.s === a.s).length;
        const usedDays = days.filter((d) => sameSubjDays(d) > 0);
        let cand = null;
        for (const d of days) for (let p = pmin; p <= dayMax(d); p++) {
          if (T.cellItems(idx, "class", cls, d, p).length) continue;
          if (T.personBusy(sc, idx, a.pid, cls, d, p)) continue;
          if (room && T.roomBusy(sc, idx, room, cls, d, p)) continue;
          if (!T.lunchFree(sc, idx, a.pid, d, T.span(sc, cls, p))) continue; // 점심시간 확보
          if (T.isNA(sc, a.pid, d, p)) continue; // 불가 시간
          const same = sameSubjDays(d);
          if (same && !opt.sameDay) continue;
          let sc0 = (load[a.pid + "|" + d] || 0) * 3 + same * 40 + rnd() * 1.5 * (opt.jitter || 1);
          usedDays.forEach((ud) => { if (Math.abs(ud - d) === 1) sc0 += 2.5; }); // 이어진 요일보다 띄엄띄엄
          if (!cand || sc0 < cand.sc) cand = { d, p, sc: sc0 };
        }
        if (!cand) { missing.push({ pid: a.pid, s: a.s, cls }); score += 1000; continue; }
        (work[a.pid] = work[a.pid] || { e: {} }).e = work[a.pid].e || {};
        const k = T.key(cls, cand.d, cand.p);
        work[a.pid].e[k] = { s: a.s, r: room };
        T.idxAdd(sc, idx, { pid: a.pid, cls, d: cand.d, p: cand.p, s: a.s, r: room, j: false, k });
        load[a.pid + "|" + cand.d] = (load[a.pid + "|" + cand.d] || 0) + 1;
        score += cand.sc;
        placed++;
      }
      if (!best || score < best.score) best = { score, placed, missing, work };
      if (!best.missing.length && t > 12) break;
    }
    const changed = {};
    pids.forEach((pid) => (changed[pid] = (best && best.work[pid]) || { e: {} }));
    return { slots: changed, placed: best ? best.placed : 0, wanted, missing: best ? best.missing : [] };
  };

  /* ───── 개인(담임) 시간표 자동 생성 ─────
     wants: { 과목id: 주당 시수 }, pairs: 2시간 연속으로 묶을 과목 id 목록
     opt: { reset(내가 이 반에 넣은 칸을 지우고 새로), pmax(이 교시까지만) }
     다른 선생님·묶음 수업 칸은 건드리지 않고, 남은 빈 칸에 요일마다 고르게·이른 교시부터 넣음 */
  T.autoFillClass = (sc, slots, pid, cls, wants, opt = {}) => {
    const days = T.dayList(sc);
    const maxP = Math.min(T.periodsOf(sc, cls), Number(opt.pmax) || 9);
    const lunch = T.schedOfClass(sc, cls).lunchAfter || 0;
    const pairs = new Set(opt.pairs || []);
    const base = T.clone(slots || {});
    const mineE = (base[pid] = base[pid] || { e: {} }).e = base[pid].e || {};
    if (opt.reset) Object.keys(mineE).forEach((k) => { if (k.startsWith(cls + "|") && !mineE[k].j) delete mineE[k]; });
    // 미리보기에서 고정(길게 누르기)한 칸은 그대로 두고 그 둘레로 다시 만듦
    Object.entries((opt.pinned && opt.pinned[pid]) || {}).forEach(([k, v]) => { if (k.startsWith(cls + "|")) mineE[k] = T.clone(v); });
    const have = {};
    Object.entries(mineE).forEach(([k, v]) => { if (k.startsWith(cls + "|") && !v.j) have[v.s] = (have[v.s] || 0) + 1; });
    const need = {};
    Object.entries(wants).forEach(([sid, h]) => { const n = (Number(h) || 0) - (have[sid] || 0); if (n > 0) need[sid] = n; });
    const wanted = Object.values(need).reduce((a, b) => a + b, 0);
    let seed = opt.seed || 98765;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
    let best = null;
    for (let t = 0; t < (opt.tries || 50); t++) {
      const work = T.clone(base);
      const idx = T.buildIndex(sc, work, { conflicts: false });
      const e = work[pid].e;
      const free = (d, p) => p >= 1 && p <= maxP && !T.cellItems(idx, "class", cls, d, p).length && !T.personBusy(sc, idx, pid, cls, d, p);
      const roomOk = (sid, d, p) => !T.roomBusy(sc, idx, T.subjectRoom(sc, sid), cls, d, p);
      const dayCount = (sid, d) => Object.entries(e).filter(([k, v]) => k.startsWith(`${cls}|${d}|`) && v.s === sid).length;
      const at = (d, p) => e[T.key(cls, d, p)];
      // 연속 묶음 → 시수가 많은 과목 → 나머지 순 (시도마다 조금씩 섞음)
      const units = [];
      Object.entries(need).forEach(([sid, n]) => {
        let left = n;
        if (pairs.has(sid)) while (left >= 2) { units.push({ sid, len: 2, w: 100 + n + rnd() }); left -= 2; }
        while (left > 0) { units.push({ sid, len: 1, w: n + rnd() * 2 }); left--; }
      });
      units.sort((a, b) => b.w - a.w);
      let score = 0, placed = 0;
      const missing = [];
      for (const u of units) {
        const total = Number(wants[u.sid]) || 0;
        const perDay = Math.max(1, Math.ceil(total / days.length));
        let cand = null;
        for (const d of days) for (let p = 1; p <= Math.min(maxP, T.dayPeriods(sc, cls, d)); p++) {
          if (!free(d, p) || !roomOk(u.sid, d, p)) continue;
          if (u.len === 2 && (p + 1 > T.dayPeriods(sc, cls, d) || !free(d, p + 1) || !roomOk(u.sid, d, p + 1) || (lunch && p === lunch))) continue;
          const same = dayCount(u.sid, d);
          if (same + u.len > Math.max(perDay, u.len)) continue;
          let sc0 = p * 2.2 + same * 25 + rnd() * 3 * (opt.jitter || 1);
          if (u.len === 1 && ((at(d, p - 1) && at(d, p - 1).s === u.sid) || (at(d, p + 1) && at(d, p + 1).s === u.sid))) sc0 += 12; // 같은 과목 붙여 넣기는 피함
          days.forEach((dd) => { if (dd !== d && Math.abs(dd - d) === 1 && dayCount(u.sid, dd)) sc0 += 1.5; });
          if (!cand || sc0 < cand.sc) cand = { d, p, sc: sc0 };
        }
        if (!cand) { for (let i = 0; i < u.len; i++) missing.push(u.sid); score += 1000 * u.len; continue; }
        for (let i = 0; i < u.len; i++) {
          const k = T.key(cls, cand.d, cand.p + i);
          const rr = T.subjectRoom(sc, u.sid);
          e[k] = { s: u.sid, r: rr };
          T.idxAdd(sc, idx, { pid, cls, d: cand.d, p: cand.p + i, s: u.sid, r: rr, j: false, k });
        }
        score += cand.sc;
        placed += u.len;
      }
      if (!best || score < best.score) best = { score, placed, missing, e: work[pid].e };
      if (!best.missing.length && t > 15) break;
    }
    return { e: best ? best.e : mineE, placed: best ? best.placed : 0, wanted, missing: best ? best.missing : [] };
  };

  /* ───── 선생님 기본 교실 ─────
     교과전담·강사: 선생님 기본 교실 → 과목 기본 장소 → 학급 교실 순으로 장소를 정함 */
  T.defaultRoomFor = (sc, pid, sid) => {
    const p = T.person(sc, pid);
    if (p && p.role !== "homeroom" && p.room && T.room(sc, p.room)) return p.room;
    return T.subjectRoom(sc, sid);
  };
  // 이 선생님이 넣은 수업(협력 칸 제외)의 장소를 room으로 바꿈. 그 시간에 다른 반이 쓰는 특별실이면 건너뜀
  T.applyRoom = (sc, slots, pid, room) => {
    const work = T.clone(slots || {});
    const e = (work[pid] && work[pid].e) || {};
    let changed = 0;
    const skipped = [];
    Object.keys(e).sort().forEach((k) => {
      const v = e[k];
      if (!v || v.j || (v.r || "") === (room || "")) return;
      const idx = T.buildIndex(sc, work, { conflicts: false });
      const { cls, d, p } = T.parseKey(k);
      const busy = room && T.roomBusy(sc, idx, room, cls, d, p, (it) => it.pid === pid && it.k === k);
      if (busy) { skipped.push({ k, by: busy }); return; }
      v.r = room || "";
      changed++;
    });
    return { e, changed, skipped };
  };

  /* ───── 체험 학교 자료 ───── */
  T.EXAMPLE_ID = "example";
  T.EXAMPLE_CODES = { admin: "ADMIN1", teacher: "1111", super: "SUPER1" };
  T.exampleSchool = () => {
    const sc = T.newSchool("햇살초등학교", "elem");
    sc.setupDone = true;
    sc.homeroomOpen = true; // 체험 학교는 2단계
    const surn = "김이박최정강조윤장임한오서신권황안송류홍";
    const given = ["민준", "서연", "도윤", "하은", "지호", "수아", "예준", "지유", "시우", "하린", "주원", "서윤", "건우", "채원", "현우", "지아", "우진", "윤서"];
    let n = 0;
    T.classList(sc).forEach((c) => {
      sc.people.push({ id: `p${c.id.replace("-", "")}`, name: surn[n % surn.length] + given[n % given.length], role: "homeroom", cls: c.id, subject: "", room: "" });
      n++;
    });
    sc.people.push(
      { id: "pe1", name: "박영어", role: "subject", cls: "", subject: "eng", room: "r2" },
      { id: "pe2", name: "정과학", role: "subject", cls: "", subject: "sci", room: "r1" },
      { id: "pe3", name: "최체육", role: "subject", cls: "", subject: "pe", room: "r4" },
      { id: "pe4", name: "한음악", role: "subject", cls: "", subject: "mus", room: "r3" },
      { id: "pi1", name: "오스포츠", role: "instructor", cls: "", subject: "pe", room: "r5" },
    );
    // 학년별 시정: 1·2학년은 점심이 빠르고 5교시까지
    // 1·2학년은 점심이 빠름 (학년군 기본 시정은 newSchool에서 만들어짐)
    // 교과전담 배정 (학년 × 과목 → 담당 · 주당 시수)
    sc.assign = [
      { id: "a1", g: 3, s: "eng", pid: "pe1", h: 2 }, { id: "a2", g: 4, s: "eng", pid: "pe1", h: 2 }, { id: "a3", g: 5, s: "eng", pid: "pe1", h: 3 },
      { id: "a4", g: 5, s: "sci", pid: "pe2", h: 3 }, { id: "a5", g: 6, s: "sci", pid: "pe2", h: 3 },
      { id: "a6", g: 5, s: "pe", pid: "pe3", h: 2 }, { id: "a7", g: 6, s: "pe", pid: "pe3", h: 2 },
      { id: "a8", g: 3, s: "mus", pid: "pe4", h: 1 }, { id: "a9", g: 4, s: "mus", pid: "pe4", h: 1 }, { id: "a10", g: 5, s: "mus", pid: "pe4", h: 1 }, { id: "a11", g: 6, s: "mus", pid: "pe4", h: 1 },
      { id: "a12", g: 3, s: "pe", pid: "pi1", h: 1 }, { id: "a13", g: 4, s: "pe", pid: "pi1", h: 1 },
    ];
    // 묶음 수업 예: 6학년 동아리 (세 반 학생이 섞여 네 교사·네 곳으로)
    sc.blocks = [{ id: "b1", name: "6학년 동아리", s: "cre", classes: ["6-1", "6-2", "6-3"], times: ["4|5", "4|6"],
      members: [{ pid: "p61", r: "" }, { pid: "p62", r: "r6" }, { pid: "p63", r: "r3" }, { pid: "pi1", r: "r5" }] }];
    const days = T.dayList(sc), periods = [1, 2, 3, 4, 5, 6];
    const auto = T.autoPlace(sc, {}, sc.assign, { pmin: 1, pmax: 6, seed: 7, tries: 30 });
    const slots = auto.slots;
    // 협력수업 예: 4-1 체육(담임)에 강사가 함께 들어감
    (slots.p41 = slots.p41 || { e: {} }).e[T.key("4-1", 2, 2)] = { s: "pe", r: "r5" };
    const idx0 = T.buildIndex(sc, slots);
    if (!T.cellItems(idx0, "class", "4-1", 2, 2).some((i) => i.pid !== "p41") && !T.personBusy(sc, idx0, "pi1", "4-1", 2, 2))
      (slots.pi1 = slots.pi1 || { e: {} }).e[T.key("4-1", 2, 2)] = { s: "pe", r: "r5", j: 1 };
    else delete slots.p41.e[T.key("4-1", 2, 2)];
    const busyCls = {};
    Object.values(slots).forEach((d) => Object.keys(d.e).forEach((k) => { const { cls, d: dd, p } = T.parseKey(k); busyCls[cls + `${dd}|${p}`] = 1; }));
    // 3학년 1반은 담임이 나머지를 채운 예시
    const fill = ["kor", "math", "soc", "sci", "kor", "math", "art", "mor", "kor", "pe", "cre", "math", "kor", "soc", "sci", "art", "cre", "kor", "math", "mor", "kor", "soc", "sci", "pe", "math", "kor", "cre", "soc"];
    let fi = 0;
    days.forEach((d) => periods.forEach((pp) => {
      if (T.beyond(sc, "3-1", d, pp)) return;
      if (busyCls["3-1" + `${d}|${pp}`]) return;
      (slots["p31"] = slots["p31"] || { e: {} }).e[T.key("3-1", d, pp)] = { s: fill[fi++ % fill.length], r: "" };
    }));
    return { school: sc, slots };
  };
})();

</script>
<script>
/* 저장소: 체험 모드(이 브라우저) / Cloudflare 서버
 *   서버 쪽 자료 구조와 권한 확인은 cloudflare/src/worker.js 에 있습니다.
 *   두 저장소는 같은 함수(getSchool·watch·login·saveSlots …)를 갖고 있어 화면 코드는 똑같습니다.
 */
(function () {
  const T = (window.TT = window.TT || {});
  const ADMIN = T.ADMIN;

  class Denied extends Error { constructor(m = "권한이 없습니다. 인증코드로 다시 들어와 주세요.") { super(m); this.code = "denied"; } }
  T.Denied = Denied;

  /* ───────── 체험 모드 ───────── */
  class DemoStore {
    constructor() {

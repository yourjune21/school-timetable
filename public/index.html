    await T.loadScript(LIBS.jszip);
    const zip = new window.JSZip();
    blobs.forEach((b, i) => zip.file(`${filename}_${String(i + 1).padStart(2, "0")}.jpg`, b));
    return T.saveFile(await zip.generateAsync({ type: "blob" }), filename + "_JPG.zip");
  };

  T.printPages = (pagesHtml, orient) => {
    let root = document.getElementById("print-root");
    if (!root) { root = document.createElement("div"); root.id = "print-root"; document.body.appendChild(root); }
    root.innerHTML = pagesHtml.join("");
    [...root.children].forEach((el, i) => T.numberPage(el, i, pagesHtml.length));
    let st = document.getElementById("print-page-style");
    if (!st) { st = document.createElement("style"); st.id = "print-page-style"; document.head.appendChild(st); }
    st.textContent = `@page { size: A4 ${orient}; margin: 0; } @media print { #print-root .page { width: ${T.PAPER[orient].mm[0]}mm !important; height: ${T.PAPER[orient].mm[1] - 0.5}mm !important; } }`;
    document.body.classList.add("printing");
    const done = () => { document.body.classList.remove("printing"); root.innerHTML = ""; window.removeEventListener("afterprint", done); };
    window.addEventListener("afterprint", done);
    setTimeout(() => { try { window.print(); } catch (e) { T.toast("이 화면에서는 인쇄가 막혀 있습니다. PDF로 저장한 뒤 인쇄하세요.", "error"); } setTimeout(done, 1500); }, 60);
  };

  T.qrDataUrl = async (text) => {
    await T.loadScript(LIBS.qr);
    const q = window.qrcode(0, "M");
    q.addData(text);
    q.make();
    return q.createDataURL(4, 2);
  };

  /* ───── 엑셀(.xlsx) ─────
     학급별·교사별·교실별: 한 개에 시트 하나 / 학년별: 학년마다 시트 하나(반을 위아래로) / 전체: 한눈에 표 */
  const argb = (hex) => "FF" + String(hex || "#ffffff").replace("#", "").toUpperCase();
  const sheetName = (wb, name) => {
    let n = String(name).replace(/[\\/?*[\]:]/g, " ").slice(0, 28) || "시트";
    let k = n, i = 2;
    while (wb.getWorksheet(k)) k = `${n.slice(0, 25)} ${i++}`;
    return k;
  };
  const thin = { style: "thin", color: { argb: "FF9EA9A3" } };
  const box = { top: thin, left: thin, bottom: thin, right: thin };
  const textOf = (sc, kind, id, items, scheds) => {
    const c = T.cellContent(sc, kind, id, items, scheds ? { scheds } : {});
    if (!c.html) return { text: "", color: null };
    const div = document.createElement("div");
    div.innerHTML = c.html;
    div.querySelectorAll(".tag").forEach((t) => (t.textContent = " (" + t.textContent + ")"));
    const parts = c.cls === "split"
      ? [...div.children].map((h) => [...h.children].map((x) => x.textContent).filter(Boolean).join(" / "))
      : [...div.children].map((x) => x.textContent).filter(Boolean);
    const it = items[0];
    return { text: parts.join("\n"), color: c.cls === "conflict" ? "#fde3e0" : T.COLORS[T.subjectColor(sc, it.s)].bg };
  };
  function writeGrid(ws, sc, idx, kind, id, row0, withHours) {
    const sch = T.gridSched(sc, kind, id);
    const scheds = kind === "person" ? T.personScheds(sc, idx, id) : kind === "room" && !String(id).startsWith("hr:") ? T.usedScheds(sc) : null;
    const days = T.dayList(sc);
    ws.mergeCells(row0, 1, row0, days.length + 1);
    const t = ws.getCell(row0, 1);
    t.value = `${T.titleOf(sc, kind, id)} 시간표   ${T.subtitleOf(sc, kind, id)}`;
    t.font = { bold: true, size: 14 };
    let r = row0 + 1;
    ["교시", ...days.map((d) => T.DAYS[d])].forEach((v, i) => {
      const c = ws.getCell(r, i + 1);
      c.value = v; c.font = { bold: true }; c.alignment = { horizontal: "center", vertical: "middle" };
      c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF2F5F3" } }; c.border = box;
    });
    ws.getRow(r).height = 20;
    for (let p = 1; p <= (sch.periods || 6); p++) {
      r++;
      const tm = (sch.times || [])[p - 1];
      const h = ws.getCell(r, 1);
      const hl = scheds ? T.periodHead(sc, scheds, p).map((x) => (x.label ? x.label + " " : "") + `${x.s}~${x.e}`) : tm && tm.s ? [`${tm.s}~${tm.e}`] : [];
      h.value = [`${p}교시`, ...hl].join("\n");
      h.alignment = { horizontal: "center", vertical: "middle", wrapText: true }; h.font = { bold: true, size: 10 };
      h.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF2F5F3" } }; h.border = box;
      days.forEach((d, i) => {
        const c = ws.getCell(r, i + 2);
        const { text, color } = textOf(sc, kind, id, T.cellItems(idx, kind, id, d, p), scheds);
        c.value = text;
        c.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
        c.border = box;
        if (color) c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: argb(color) } };
        else if (kind === "class" && T.beyond(sc, id, d, p)) c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE5E8E6" } };
      });
      ws.getRow(r).height = 42;
      if (sch.lunchAfter && p === sch.lunchAfter && p < sch.periods) {
        r++;
        ws.mergeCells(r, 2, r, days.length + 1);
        ws.getCell(r, 1).value = "점심";
        const lt = T.lunchTime(sch);
        ws.getCell(r, 2).value = lt ? `점심시간 ${lt.s}~${lt.e}` : "점심시간";
        [1, 2].forEach((col) => { const c = ws.getCell(r, col); c.alignment = { horizontal: "center" }; c.font = { size: 9, color: { argb: "FF66716C" } }; c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF2F5F3" } }; c.border = box; });
      }
    }
    if (withHours) {
      const hrs = T.hoursBy(idx, kind, id);
      if (hrs.total) {
        r++;
        ws.mergeCells(r, 1, r, days.length + 1);
        const order = (sc.subjects || []).map((x) => x.id);
        ws.getCell(r, 1).value = `주 ${hrs.total}시간 — ` + Object.keys(hrs.by).sort((a, b) => order.indexOf(a) - order.indexOf(b)).map((x) => `${T.subjectShort(sc, x)} ${hrs.by[x]}`).join(" · ");
        ws.getCell(r, 1).font = { size: 10, color: { argb: "FF66716C" } };
      }
    }
    return r + 2;
  }
  function writeMatrix(ws, sc, idx, kind, rows) {
    const days = T.dayList(sc), periods = T.periodList(sc);
    ws.getCell(1, 1).value = kind === "class" ? "학급" : kind === "person" ? "선생님" : "장소";
    let col = 2;
    days.forEach((d) => {
      ws.mergeCells(1, col, 1, col + periods.length - 1);
      ws.getCell(1, col).value = T.DAYS[d];
      periods.forEach((p, i) => { ws.getCell(2, col + i).value = p; });
      col += periods.length;
    });
    ws.mergeCells(1, 1, 2, 1);
    for (let c = 1; c < col; c++) [1, 2].forEach((r) => { const x = ws.getCell(r, c); x.font = { bold: true }; x.alignment = { horizontal: "center", vertical: "middle" }; x.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF2F5F3" } }; x.border = box; });
    rows.forEach((rw, ri) => {
      const r = ri + 3;
      const h = ws.getCell(r, 1);
      h.value = rw.sub ? `${rw.label} (${rw.sub})` : rw.label; h.font = { bold: true }; h.border = box;
      let c = 2;
      days.forEach((d) => periods.forEach((p) => {
        const x = ws.getCell(r, c++);
        x.border = box; x.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
        if (kind === "class" && T.beyond(sc, rw.id, d, p) && !T.cellItems(idx, kind, rw.id, d, p).length) { x.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE5E8E6" } }; return; }
        const items = T.cellItems(idx, kind, rw.id, d, p);
        if (!items.length) return;
        const it = items[0];
        const name = it.b ? T.blockName(sc, it.b) : T.subjectShort(sc, it.s);
        x.value = kind === "class" ? name : kind === "person" ? (it.b ? name : `${it.cls}\n${name}`) : `${it.cls}\n${name}`;
        x.fill = { type: "pattern", pattern: "solid", fgColor: { argb: argb(T.COLORS[T.subjectColor(sc, it.s)].bg) } };
        x.font = { size: 9 };
      }));
      ws.getRow(r).height = kind === "class" ? 22 : 30;
    });
    ws.getColumn(1).width = 16;
    for (let c = 2; c < col; c++) ws.getColumn(c).width = 6.5;
  }
  T.exportXLSX = async (sc, idx, job, filename) => {
    await T.loadScript(LIBS.exceljs);
    const wb = new window.ExcelJS.Workbook();
    wb.creator = "함께 짜는 시간표";
    const setup = (ws, fit = true) => {
      ws.pageSetup = { paperSize: 9, orientation: job.orient || "landscape", fitToPage: fit, fitToWidth: 1, fitToHeight: fit ? 1 : 0, margins: { left: 0.3, right: 0.3, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 } };
    };
    const gridSheet = (ws) => { ws.getColumn(1).width = 12; T.dayList(sc).forEach((_, i) => (ws.getColumn(i + 2).width = 18)); };
    if (["class", "person", "room"].includes(job.type)) {
      (job.ids || []).forEach((id) => {
        const ws = wb.addWorksheet(sheetName(wb, T.titleOf(sc, job.type, id)));
        gridSheet(ws); setup(ws);
        writeGrid(ws, sc, idx, job.type, id, 1, job.hours !== false);
      });
    } else if (job.type === "grade") {
      (job.grades || []).forEach((g) => {
        const ws = wb.addWorksheet(sheetName(wb, `${g}학년`));
        if (job.gradeStyle === "matrix") { setup(ws); writeMatrix(ws, sc, idx, "class", T.matrixRows(sc, "class", { grade: g })); return; }
        gridSheet(ws); setup(ws, false);
        let r = 1;
        T.classesOfGrade(sc, g).forEach((c) => { r = writeGrid(ws, sc, idx, "class", c.id, r, job.hours !== false); ws.getRow(r - 1).addPageBreak && ws.getRow(r - 1).addPageBreak(); });
      });
    } else if (job.type === "all") {
      const basis = job.basis || "class";
      const ws = wb.addWorksheet(sheetName(wb, { class: "전체(학급)", person: "전체(교사)", room: "전체(교실)" }[basis]));
      setup(ws);
      writeMatrix(ws, sc, idx, basis, T.matrixRows(sc, basis, {}));
    }
    if (!wb.worksheets.length) throw new Error("내보낼 시간표가 없습니다.");
    const buf = await wb.xlsx.writeBuffer();
    return T.saveFile(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), filename + ".xlsx");
  };
})();

</script>
<script>
/* 화면 공통 부품: 알림, 대화상자, 확인창 */
(function () {
  const T = (window.TT = window.TT || {});
  T.$ = (s, r = document) => r.querySelector(s);
  T.$$ = (s, r = document) => [...r.querySelectorAll(s)];

  let toastTimer;
  T.toast = (msg, kind = "info") => {
    let t = T.$("#toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "toast";
      t.setAttribute("role", "status");
      t.setAttribute("aria-live", "polite");
      document.body.appendChild(t);
    }
    t.className = "toast toast-" + kind;
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.hidden = true), kind === "error" ? 5000 : 2600);
  };

  T.modal = ({ title, body, wide = false, onClose }) => {
    const wrap = document.createElement("div");
    wrap.className = "modal-back";
    wrap.innerHTML = `
      <div class="modal ${wide ? "modal-wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-head"><h2 id="modal-title">${T.esc(title)}</h2>
          <button type="button" class="icon-btn" data-close aria-label="닫기">✕</button></div>
        <div class="modal-body">${body}</div>
      </div>`;
    document.body.appendChild(wrap);
    document.body.classList.add("no-scroll");
    let closed = false;
    const close = () => {
      if (closed) return;
      closed = true;
      wrap.remove();
      if (!T.$(".modal-back")) document.body.classList.remove("no-scroll");
      document.removeEventListener("keydown", onKey);
      onClose && onClose();
    };
    const onKey = (e) => { if (e.key === "Escape" && wrap === T.$$(".modal-back").pop()) close(); };
    document.addEventListener("keydown", onKey);
    let downOnBack = false;
    wrap.addEventListener("pointerdown", (e) => { downOnBack = e.target === wrap; });
    wrap.addEventListener("click", (e) => {
      if (e.target.closest("[data-close]")) return close();
      if (e.target === wrap && downOnBack && !wrap.querySelector("input:not([type=hidden]), select, textarea")) close();
    });
    const first = wrap.querySelector("input, select, textarea");
    setTimeout(() => first && first.focus(), 30);
    return { el: wrap, close };
  };

  T.confirm = (message, { ok = "확인", danger = false } = {}) =>
    new Promise((resolve) => {
      let answered = false;
      const m = T.modal({
        title: "확인",
        body: `<p style="margin:0">${T.esc(message).replace(/\n/g, "<br>")}</p>
          <div class="row-end"><button type="button" class="btn ghost" data-close>취소</button>
          <button type="button" class="btn ${danger ? "danger" : "primary"}" data-ok>${T.esc(ok)}</button></div>`,
        onClose: () => { if (!answered) resolve(false); },
      });
      m.el.querySelector("[data-ok]").addEventListener("click", () => { answered = true; resolve(true); m.close(); });
    });

  T.busy = async (btn, fn, label = "처리 중…") => {
    const html = btn ? btn.innerHTML : "";
    if (btn) { btn.disabled = true; btn.textContent = label; }
    try { return await fn(); }
    finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = html; } }
  };
})();

</script>
<script>
/* 화면: 첫 화면 · 조회 · 입력 · 출력 · 기본설정 */
(function () {
  const T = window.TT;
  const E = T.esc;
  const cfg = window.TT_CONFIG || {};
  let store = null;
  const app = document.getElementById("app");
  const ADMIN = T.ADMIN;

  const A = {
    ready: false, initError: null,
    sid: null, school: undefined, slots: {}, idx: null, loadError: null,
    me: { pid: null, admin: false },
    tab: "view",
    view: { kind: "class", id: null, mx: "class", mxGrade: 0 },
    ed: { actAs: null, mode: null, cls: null, brush: null, room: "", subj: "", wroom: "", wbrush: null, forActor: null },
    pr: { type: "class", ids: {}, grades: null, orient: "landscape", perPage: 1, basis: "class", gradeStyle: "grid", hours: true },
    set: { draft: null, dirty: false, sec: "basic", codes: null, codesFor: null },
    pending: {}, timers: {}, saveState: "", unsub: null,
  };
  T.A = A; // 시험·점검용

  /* ───────── 공통 ───────── */
  const meKey = (sid) => `tt-me-${sid}`;
  const saveMe = () => { try { localStorage.setItem(meKey(A.sid), JSON.stringify(A.me)); } catch (e) {} };
  const loadMe = (sid) => { try { return JSON.parse(localStorage.getItem(meKey(sid)) || "null") || { pid: null, admin: false }; } catch (e) { return { pid: null, admin: false }; } };
  const recent = () => { try { return JSON.parse(localStorage.getItem("tt-recent") || "[]"); } catch (e) { return []; } };
  const addRecent = (sid, name) => {
    if (sid === T.EXAMPLE_ID) return;
    const list = recent().filter((x) => x.sid !== sid);
    list.unshift({ sid, name });
    try { localStorage.setItem("tt-recent", JSON.stringify(list.slice(0, 5))); } catch (e) {}
  };
  const go = (path) => { if (location.hash !== "#" + path) location.hash = path; else route(); };
  const sc = () => A.school;
  // 링크로 들어온 '간단 화면': 내 시간표만 입력, 조회는 학년별만
  const isSimple = () => !!(A.me.simple && A.me.pid && !A.me.admin);
  const actor = () => A.ed.actAs || A.me.pid;
  const canEditAs = (pid) => !!pid && (A.me.admin || A.me.pid === pid);

  const after = [];
  /* ───────── 버전 ───────── */
  const footer = () => {
    const sv = store && store.mode === "cloud" ? (store.info && store.info.version) || "?" : null;
    return `<footer class="app-foot"><div class="wrap">${E(cfg.SITE_NAME || "함께 짜는 시간표")} <b>v${E(T.VERSION)}</b> <span class="hint">(${E(T.RELEASED)})</span>
      · <button class="link-btn" data-act="changes">변경 내역</button>
      · ${sv ? `서버 v${E(sv)}${sv !== T.VERSION ? ' <b class="warn">(버전 다름)</b>' : ""}` : "체험 모드"}</div></footer>`;
  };
  const updateBar = () => (A.newVersion ? `<div class="update-bar"><div class="wrap">새 버전(v${E(A.newVersion)})이 올라왔습니다. 입력 중인 내용은 이미 저장되어 있습니다.
      <button class="btn sm primary" data-act="reload">새로 고침</button></div></div>` : "");
  function showChanges() {
    T.modal({
      title: `변경 내역 · 지금 v${T.VERSION}`,
      body: `<div class="stack">${T.CHANGES.map(([v, d, items]) => `<div><b>v${E(v)}</b> <span class="hint">${E(d)}</span><ul class="changes">${items.map((x) => `<li>${E(x)}</li>`).join("")}</ul></div>`).join("")}</div>`,
    });
  }
  // 서버에 새 버전이 배포됐는지: 창으로 돌아올 때와 10분마다
  let lastVerCheck = 0;
  async function checkVersion(force) {
    if (!store || store.mode !== "cloud" || !store.serverVersion) return;
    if (!force && Date.now() - lastVerCheck < 60000) return;
    lastVerCheck = Date.now();
    const v = await store.serverVersion();
    if (v && v !== T.VERSION && A.newVersion !== v) { A.newVersion = v; render(); }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkVersion(); });
  setInterval(() => checkVersion(true), 10 * 60 * 1000);

  function render() {
    const a = document.activeElement;
    const fk = a && a.dataset && a.dataset.f;
    let sel = null;
    try { sel = fk ? [a.selectionStart, a.selectionEnd] : null; } catch (e) {}
    app.innerHTML = updateBar() + (A.sid ? shell() : landing()) + footer();
    if (fk) {
      const n = app.querySelector(`[data-f="${CSS.escape(fk)}"]`);
      if (n) { n.focus(); try { sel && n.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
    }
    while (after.length) after.shift()();
  }

  /* ───────── 길찾기 ───────── */
  async function route() {
    const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    let sid = parts[0] === "s" ? T.cleanSid(decodeURIComponent(parts[1] || "")) : "";
    if (!sid && cfg.DEFAULT_SCHOOL && !parts.length) sid = T.cleanSid(cfg.DEFAULT_SCHOOL);
    // 개인 입력 링크: #/s/학교/k/사람/코드 → 자동으로 들어간 뒤 주소에서 코드를 지움
    if (parts[0] === "s" && parts[2] === "k" && parts[3] && parts[4]) {
      A.pendingKey = { sid, pid: decodeURIComponent(parts[3]), code: decodeURIComponent(parts[4]) };
      try { history.replaceState(null, "", `${location.pathname}${location.search}#/s/${encodeURIComponent(sid)}/edit`); } catch (e) { location.hash = `/s/${sid}/edit`; }
      parts[2] = "edit";
      if (sid === A.sid) usePendingKey();
    }
    const tab = (parts[0] === "s" ? parts[2] : "") || "view";
    A.tab = ["view", "edit", "print", "settings"].includes(tab) ? tab : "view";
    if (!sid) { closeSchool(); render(); return; }
    if (sid !== A.sid) openSchool(sid);
    render();
  }
  window.addEventListener("hashchange", route);

  async function usePendingKey() {
    const k = A.pendingKey;
    if (!k || k.sid !== A.sid) return;
    A.pendingKey = null;
    try {
      const ok = await store.login(A.sid, k.pid, k.code);
      if (!ok) { T.toast("링크의 인증코드가 바뀌었습니다. 관리자에게 새 링크를 받으세요.", "error"); return; }
      if (k.pid === ADMIN) A.me.admin = true; else { A.me.pid = k.pid; A.me.simple = true; A.ed.actAs = null; A.ed.forActor = null; }
      A.view.kind = "grade";
      saveMe();
      const s = sc();
      T.toast(s && k.pid !== ADMIN ? `${T.personName(s, k.pid)} 선생님, 바로 입력할 수 있습니다.` : "들어왔습니다.");
      render();
    } catch (e) { T.toast(e.message || "들어가지 못했습니다.", "error"); }
  }
  function closeSchool() {
    if (A.unsub) A.unsub();
    A.unsub = null; A.sid = null; A.school = undefined; A.slots = {}; A.idx = null;
  }
  function openSchool(sid) {
    closeSchool();
    Object.assign(A, { sid, school: undefined, slots: {}, idx: null, loadError: null, me: loadMe(sid) });
    A.ed = { actAs: null, mode: null, cls: null, brush: null, room: "", subj: "", wroom: "", wbrush: null, forActor: null };
    A.view = { kind: "class", id: null, mx: "class", mxGrade: 0 };
    A.pr.ids = {}; A.pr.grades = null;
    A.set = { draft: null, dirty: false, sec: "basic", codes: null, codesFor: null };
    const go2 = async () => {
      if (sid === T.EXAMPLE_ID && store.ensureExample) await store.ensureExample();
      A.unsub = store.watch(sid, onData);
      // 이 기기에 남은 인증이 아직 유효한지
      const me = A.me;
      const [okP, okA] = await Promise.all([me.pid ? store.check(sid, me.pid) : false, me.admin ? store.check(sid, ADMIN) : false]);
      if (A.sid !== sid) return;
      if (me.pid && !okP) A.me.pid = null;
      if (me.admin && !okA) A.me.admin = false;
      saveMe();
      render();
      usePendingKey();
    };
    go2().catch((e) => { A.loadError = e; render(); });
  }
  function onData({ school, slots, error }) {
    if (error) { A.loadError = error; render(); return; }
    A.loadError = null;
    A.school = school ? T.normalize(school) : school;
    const merged = { ...(slots || {}) };
    Object.keys(A.pending).forEach((pid) => { if (A.slots[pid]) merged[pid] = A.slots[pid]; });
    A.slots = merged;
    if (school) {
      A.idx = T.buildIndex(school, A.slots);
      addRecent(A.sid, school.name);
      document.title = `${school.name} 시간표`;
      if (!A.set.dirty) A.set.draft = null;
    }
    render();
  }

  /* ───────── 첫 화면 ───────── */
  function landing() {
    const demo = store.mode === "demo";
    const rec = recent();
    return `<div class="wrap landing">
      <div class="landing-card">
        <p class="eyebrow">학교 시간표 · 교실·강사 기준</p>
        <h1 class="landing-title">${E(cfg.SITE_NAME || "함께 짜는 시간표")}</h1>
        <p class="muted">교과전담·강사 시간을 먼저 넣으면, 담임 선생님은 남은 칸에 시간표를 채웁니다.
          학급별·교사별·교실별로 보고, A4 가로·세로 PDF·JPG로 출력하세요.</p>
        <form class="stack" data-form="join">
          <label class="field"><span>학교 찾기 <small>학교 이름 일부나 학교 코드</small></span>
            <div class="join"><input name="sid" type="search" autocomplete="off" autocapitalize="off" placeholder="예: 한빛 또는 hanbit-es" data-f="join-sid" data-on="school-q" enterkeyhint="search">
            <button class="btn primary" type="submit">들어가기</button></div></label>
          <div class="search-results" role="listbox" aria-label="학교 검색 결과"></div>
          ${rec.length ? `<div class="recent">최근: ${rec.map((r) => `<button type="button" class="chip" data-act="open" data-sid="${E(r.sid)}">${E(r.name || r.sid)} <small>${E(r.sid)}</small></button>`).join("")}</div>` : ""}
        </form>
        ${cfg.ALLOW_NEW_SCHOOL !== false && !(store.info && store.info.allowNew === false) ? `<div class="btn-row"><button type="button" class="btn" data-act="new-school">＋ 새 학교 만들기</button>
          <span class="hint">관리자가 학교를 만들고 학급 수·교시·선생님을 설정합니다.</span></div>` : ""}
        ${demo ? `<div class="demo-cta">
          <b style="color:var(--ink)">먼저 체험해 보세요</b>
          <span>예시 학교(18학급, 교과전담 4명·강사 1명)가 준비되어 있습니다. 관리자 코드 <span class="code">${T.EXAMPLE_CODES.admin}</span> · 선생님 코드 모두 <span class="code">${T.EXAMPLE_CODES.teacher}</span></span>
          <div><button type="button" class="btn primary" data-act="open" data-sid="${T.EXAMPLE_ID}">체험 학교 열기</button></div>
        </div>` : ""}
      </div>
      <p class="landing-foot">${themeBtn()}</p>
      <p class="landing-foot">${demo ? "체험 모드 — 자료가 이 브라우저에만 저장됩니다. 학교에서 함께 쓰려면 Cloudflare에 배포하세요." : "학교 코드와 개인 인증코드로 자기 시간표만 고칠 수 있습니다. 다른 선생님이 고친 내용은 바로 보입니다."}</p>
    </div>`;
  }

  function openNewSchool() {
    const m = T.modal({
      title: "새 학교 만들기",
      body: `<form class="stack" id="ns-form">
        <label class="field"><span>학교 이름</span><input name="name" required placeholder="예: 대전한빛초등학교"></label>
        <label class="field"><span>학교 코드 <small>영문 소문자·숫자·- (3~30자) · 선생님들이 들어올 때 씁니다</small></span>
          <input name="sid" required autocapitalize="off" placeholder="예: hanbit-es"></label>
        <label class="field"><span>학교급</span><select name="level"><option value="elem">초등학교 (1~6학년)</option><option value="sec">중·고등학교 (1~3학년)</option></select></label>
        <div class="grid-form two">
          <label class="field"><span>관리자 코드 <small>영문·숫자 6자 이상</small></span><input name="code" type="password" required autocomplete="new-password" class="code-input"></label>
          <label class="field"><span>관리자 코드 확인</span><input name="code2" type="password" required autocomplete="new-password" class="code-input"></label>
        </div>
        <p class="hint">관리자 코드는 기본설정을 고칠 때 씁니다. 영문·숫자만 쓰이고 대소문자는 구분하지 않습니다. 잊으면 되찾을 수 없으니 따로 적어 두세요.</p>
        <p class="errs" hidden></p>
        <div class="row-end"><button type="button" class="btn ghost" data-close>취소</button><button class="btn primary">만들기</button></div>
      </form>`,
    });
    const f = m.el.querySelector("#ns-form");
    const errs = f.querySelector(".errs");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = f.name.value.trim(), sid = T.cleanSid(f.sid.value), code = T.cleanCode(f.code.value);
      const bad = [];
      if (!name) bad.push("학교 이름을 넣어 주세요.");
      if (!T.validSid(sid)) bad.push("학교 코드는 영문 소문자·숫자·- 로 3~30자입니다.");
      if (sid === T.EXAMPLE_ID) bad.push("'example'은 체험 학교 코드라 쓸 수 없습니다.");
      if (code.length < 6) bad.push("관리자 코드는 영문·숫자 6자 이상입니다.");
      if (code !== T.cleanCode(f.code2.value)) bad.push("관리자 코드 확인이 다릅니다.");
      errs.hidden = !bad.length; errs.innerHTML = bad.map(E).join("<br>");
      if (bad.length) return;
      await T.busy(f.querySelector(".btn.primary"), async () => {
        try {
          await store.createSchool(sid, T.newSchool(name, f.level.value), code);
          try { localStorage.setItem(meKey(sid), JSON.stringify({ pid: null, admin: true })); } catch (e2) {}
          m.close();
          T.toast("학교를 만들었습니다. 학급 수와 선생님부터 설정하세요.");
          go(`/s/${sid}/settings`);
        } catch (err) {
          errs.hidden = false;
          errs.textContent = err.code === "exists" ? "이미 있는 학교 코드입니다. 다른 코드를 정하세요." : err.message || String(err);
        }
      });
    });
  }

  /* ───────── 학교 화면 틀 ───────── */
  function shell() {
    const s = sc();
    if (A.loadError) return `<div class="wrap main"><div class="panel narrow"><h2 class="h2">불러오지 못했습니다</h2><p class="muted">${E(A.loadError.message || A.loadError)}</p><div><a class="btn" href="#/">처음으로</a></div></div></div>`;
    if (s === undefined) return `<div class="loading">시간표를 불러오는 중…</div>`;
    if (s === null) return `<div class="wrap main"><div class="panel narrow"><h2 class="h2">학교를 찾지 못했습니다</h2>
      <p class="muted">학교 코드 <code>${E(A.sid)}</code> 로 만든 학교가 없습니다. 코드를 다시 확인하세요.</p><div><a class="btn primary" href="#/">처음으로</a></div></div></div>`;
    const me = A.me;
    const meText = [me.pid ? `${T.personName(s, me.pid)} 선생님` : "", me.admin ? "관리자" : ""].filter(Boolean).join(" · ");
    const simple = isSimple();
    if (simple && !["edit", "view"].includes(A.tab)) A.tab = "edit";
    const tabs = simple ? [["edit", "내 시간표 입력"], ["view", "학년별 조회"]] : [["view", "조회"], ["edit", "입력"], ["print", "출력"], ["settings", "기본설정"]];
    const body = { view: viewTab, edit: editTab, print: printTab, settings: settingsTab }[A.tab]();
    return `${store.mode === "demo" ? `<div class="demo-banner"><div class="wrap">체험 모드 — 이 브라우저에만 저장됩니다.${A.sid === T.EXAMPLE_ID ? ` 관리자 코드 <b>${T.EXAMPLE_CODES.admin}</b> · 선생님 코드 <b>${T.EXAMPLE_CODES.teacher}</b> · <button class="link-btn" data-act="reset-example">예시 처음 상태로</button>` : ""}</div></div>` : ""}
      <header class="school-bar"><div class="wrap school-bar-in">
        <div><p class="eyebrow">${E(T.termLabel(s))} 시간표 · 학교 코드 ${E(A.sid)}</p><h1 class="school-name">${E(s.name)}</h1></div>
        <div class="me">${meText ? `<span class="me-badge">${E(meText)}</span>${isSimple() ? `<button class="btn sm" data-act="full-menu" title="출력·교사별·교실별 조회 등 모든 메뉴">전체 메뉴</button>` : ""}<button class="btn sm" data-act="logout">나가기</button>` : `<button class="btn sm" data-act="login">인증코드로 들어가기</button>`}
          ${themeBtn()}<a class="btn sm" href="#/">학교 바꾸기</a></div>
      </div></header>
      <nav class="tabs-bar"><div class="wrap tabs">${tabs.map(([k, l]) => `<button class="tab ${A.tab === k ? "on" : ""}" data-act="tab" data-tab="${k}">${l}${k === "settings" && !me.admin ? ' <span class="lock">🔒</span>' : ""}</button>`).join("")}</div></nav>
      <main class="wrap main">${body}</main>`;
  }

  /* ───────── 인증 ───────── */
  function openLogin({ admin = false, pid = null } = {}) {
    const s = sc();
    const groups = T.ROLE_ORDER.map((r) => {
      const ps = T.peopleSorted(s).filter((p) => p.role === r);
      return ps.length ? `<optgroup label="${T.ROLES[r]}">${ps.map((p) => `<option value="${E(p.id)}" ${pid === p.id ? "selected" : ""}>${E(T.personName(s, p.id))}${p.role === "homeroom" && p.cls && p.name ? ` (${E(p.cls)})` : p.role !== "homeroom" ? ` (${E(T.personDesc(s, p.id))})` : ""}</option>`).join("")}</optgroup>` : "";
    }).join("");
    const m = T.modal({
      title: "인증코드로 들어가기",
      body: `<form class="stack" id="lg-form">
        <label class="field"><span>누구인가요?</span><select name="pid">
          <option value="">— 이름을 고르세요 —</option>
          <option value="${ADMIN}" ${admin ? "selected" : ""}>관리자 (기본설정)</option>${groups}</select></label>
        <label class="field"><span>인증코드</span><input name="code" type="password" autocomplete="off" class="code-input" placeholder="관리자에게 받은 코드"></label>
        ${A.sid === T.EXAMPLE_ID ? `<p class="note">체험 학교: 관리자 <b>${T.EXAMPLE_CODES.admin}</b>, 선생님은 누구든 <b>${T.EXAMPLE_CODES.teacher}</b></p>` : `<p class="hint">인증코드는 학교 관리자가 선생님마다 따로 나눠 줍니다. 자기 이름의 시간표만 고칠 수 있습니다.</p>`}
        <p class="errs" hidden></p>
        <div class="row-end"><button type="button" class="btn ghost" data-close>취소</button><button class="btn primary">들어가기</button></div>
      </form>`,
    });
    const f = m.el.querySelector("#lg-form");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const who = f.pid.value, code = T.cleanCode(f.code.value);
      const err = f.querySelector(".errs");

  async function logout() {

  /* ───────── 고르기 부품 ───────── */
  const classChips = (s, selected, act, extra = () => "", attrs = "") =>
    `<div class="chip-rows">${T.gradeList(s).map(({ g }) => `<div><span class="chip-label">${g}학년</span><div class="chips">${T.classesOfGrade(s, g)

  const personChips = (s, selected, act) =>
    `<div class="chip-rows">${T.ROLE_ORDER.map((r) => {
      const ps = T.peopleSorted(s).filter((p) => p.role === r);
      return ps.length ? `<div><span class="chip-label">${T.ROLES[r]}</span><div class="chips">${ps.map((p) => `<button type="button" class="chip ${(Array.isArray(selected) ? selected.includes(p.id) : selected === p.id) ? "on" : ""}" data-act="${act}" data-id="${E(p.id)}">${E(T.personName(s, p.id))}${p.role !== "homeroom" && p.subject ? ` <small>${E(T.subjectShort(s, p.subject))}</small>` : p.role === "homeroom" && p.name && p.cls ? ` <small>${E(p.cls)}</small>` : ""}</button>`).join("")}</div></div>` : "";
    }).join("") || `<p class="hint">기본설정에서 선생님을 먼저 추가하세요.</p>`}</div>`;

  /* ───────── 조회 ───────── */
  function defaultViewId(kind) {

  }
  function viewTab() {

          <div class="g-scroll">${T.gridHTML(s, A.idx, "class", c.id)}</div>${T.hoursHTML(s, A.idx, "class", c.id)}</div>`).join("") || `<p class="empty">학급이 없습니다.</p>`}</div>`;

        <button class="btn sm" data-act="to-print" data-type="all" data-basis="${v.mx}">이 표 출력하기</button></div>
        <div class="mx-wrap" style="--mx-min:${110 + cols * 34}px;--mx-lw:110px">${T.matrixHTML(s, A.idx, v.mx, rows)}</div></div>` : `<p class="empty">표시할 항목이 없습니다.</p>`;
    } else {

      content = v.id ? `<div class="sheet-card">
          <div class="row-between"><div><div class="sheet-title">${E(T.titleOf(s, v.kind, v.id))} 시간표</div><p class="sheet-sub">${E(T.subtitleOf(s, v.kind, v.id))}</p></div>
          <div class="btn-row">${canEditAs(editPidFor(v.kind, v.id)) ? `<button class="btn sm" data-act="to-edit">입력하러 가기</button>` : ""}
            <button class="btn sm" data-act="to-print" data-type="${v.kind}" data-id="${E(v.id)}">출력하기</button></div></div>
          <div class="g-scroll">${T.gridHTML(s, A.idx, v.kind, v.id)}</div>
          ${T.hoursHTML(s, A.idx, v.kind, v.id) || `<p class="hint">아직 입력된 시간이 없습니다.</p>`}
        </div>` : `<p class="empty">표시할 항목이 없습니다. 기본설정을 먼저 해 주세요.</p>`;

      ${cf.length && !simple ? `<div class="conflict-box"><b>겹치는 시간 ${cf.length}건</b> — 같은 시간에 한 학급·한 선생님·한 교실이 두 번 쓰였습니다.<ul>${cf.slice(0, 8).map((c) => `<li>${E(T.conflictText(s, c))}</li>`).join("")}${cf.length > 8 ? `<li>…그 밖에 ${cf.length - 8}건</li>` : ""}</ul></div>` : ""}
      ${A.idx && A.idx.hidden ? `<p class="hint">학급 수·교시·요일을 바꾸어 표에 나오지 않는 입력이 ${A.idx.hidden}칸 있습니다.</p>` : ""}
      ${content}`;
  }
  const editPidFor = (kind, id) => {
    if (kind === "person") return id;
    if (kind === "class") return A.me.pid || (A.me.admin ? "x" : null);
    return null;
  };

  /* ───────── 입력 ───────── */
  function myEntries(pid) { return T.clone((A.slots[pid] && A.slots[pid].e) || {}); }
  function setEntries(pid, e, flash) {
    A.slots[pid] = { ...(A.slots[pid] || {}), e };
    A.idx = T.buildIndex(sc(), A.slots);
    A.pending[pid] = true;
    A.saveState = "saving";
    clearTimeout(A.timers[pid]);
    A.timers[pid] = setTimeout(() => flush(pid), 450);
    render();
    if (flash) { const td = app.querySelector(`td[data-d="${flash[0]}"][data-p="${flash[1]}"]`); td && td.classList.add("flash"); }
  }
  async function flush(pid) {
    const sid = A.sid;

      await store.saveSlots(sid, pid, A.slots[pid].e);
      if (A.sid !== sid) return;

      A.saveState = Object.keys(A.pending).length ? "saving" : "saved";
    } catch (err) {
      delete A.pending[pid];
      A.saveState = "err";

      if (err instanceof T.Denied) {
        if (A.me.pid === pid) A.me.pid = null;
        saveMe();
        openLogin({ pid });

    }
    const el = app.querySelector(".save-state");
    if (el) { el.className = "save-state " + A.saveState; el.textContent = saveText(); }
  }
  window.addEventListener("beforeunload", (e) => { if (Object.keys(A.pending).length) { e.preventDefault(); e.returnValue = ""; } });
  const saveText = () => ({ saving: "저장 중…", saved: "✓ 자동 저장됨", err: "⚠ 저장 실패 — 다시 들어와 주세요" }[A.saveState] || "누르는 즉시 자동 저장됩니다");

  function syncEdDefaults() {
    const s = sc(), pid = actor();
    if (A.ed.forActor === pid) return;
    A.ed.forActor = pid;
    const p = T.person(s, pid);
    A.ed.mode = p && p.role === "homeroom" ? "class" : "week";
    A.ed.cls = (p && p.role === "homeroom" && p.cls && T.hasClass(s, p.cls) && p.cls) || T.classList(s)[0]?.id || null;
    A.ed.brush = null;
    A.ed.room = "";

  function editTab() {
    const s = sc();
    if (!A.me.pid && !A.me.admin) {
      return `<section class="panel narrow"><h2 class="h2">시간표 입력</h2>
        <p class="muted">입력하려면 본인 이름을 고르고 관리자에게 받은 인증코드를 넣으세요. 자기 이름으로 넣은 시간만 고칠 수 있고, 다른 선생님이 넣은 칸은 잠겨 있습니다.</p>
        <ol class="muted" style="padding-left:20px;margin:0">
          <li><b>교과전담·강사</b>: 내 주간 시간표에서 학급을 골라 칸을 누릅니다.</li>
          <li><b>담임</b>: 우리 반 시간표에서 전담 시간(잠긴 칸)을 뺀 나머지 칸에 과목을 넣습니다.</li></ol>

      <select data-on="act-as"><option value="">${A.me.pid ? `나 (${E(T.personName(s, A.me.pid))})` : "— 선생님 고르기 —"}</option>${T.peopleSorted(s).filter((p) => p.id !== A.me.pid)
        .map((p) => `<option value="${E(p.id)}" ${A.ed.actAs === p.id ? "selected" : ""}>${E(T.personName(s, p.id))} · ${E(T.personDesc(s, p.id))}</option>`).join("")}</select></label>` : "";
    if (!pid || !T.person(s, pid)) {
      return `<section class="panel"><h2 class="h2">시간표 입력</h2>${adminPick || ""}
        <p class="muted">${(s.people || []).length ? "위에서 선생님을 고르면 그 선생님 이름으로 입력합니다." : "기본설정 → 선생님·인증코드에서 선생님을 먼저 추가하세요."}</p></section>`;
    }

    const locked = !s.homeroomOpen && p.role === "homeroom" && !A.me.admin;

    </section>`;

  const roomOptions = (s, cur, homeLabel = "학급 교실 (기본)") =>
    `<option value="">${homeLabel}</option>${(s.rooms || []).map((r) => `<option value="${E(r.id)}" ${cur === r.id ? "selected" : ""}>${E(r.name)}${r.multi ? " (여러 학급 가능)" : ""}</option>`).join("")}`;

  // 이 선생님이 직접 입력한 과목 (넣어 둔 칸 + 이번에 만든 것)
  function myCustoms(pid) {

    return [...set];

  function openCustom(done) {

        <label class="field"><span>과목 이름 <small>12자까지</small></span><input name="n" maxlength="12" required placeholder="예: 생존수영"></label>

  function editClass(s, pid, p) {

  function weekCell(s, pid, d, pp) {

  /* 칸 넣기: 성공하면 true (실패하면 알림만) */

  function cellClick(d, p, opt = {}) {

      if (b.erase) { if (!e[k]) return false; delete e[k]; setEntries(pid, e, [d, p]); return true; }

    if (wb.erase) { if (!mine.length) return false; mine.forEach((i) => delete e[i.k]); setEntries(pid, e, [d, p]); return true; }

    const spB = T.span(s, B, p);

        const pb = T.personBusy(s, A.idx, pid, B, d, p, others);
        if (pb) { T.toast(`이 시간에 이미 ${pb.cls} 수업이 있습니다.`, "error"); return false; }
        clash.forEach((i) => delete e[i.k]);
        e[k] = { s: o.s, r: o.r || "", j: 1 };
        setEntries(pid, e, [d, p]);
        T.toast(`${B} ${T.subjectName(s, o.s)}(${T.personName(s, o.pid)})에 함께 들어갑니다.`);
        return true;
      }
      T.toast(`${B} ${T.DAYS[d]} ${p}교시는 ${o.b ? T.blockName(s, o.b) : T.personName(s, o.pid) + " 선생님의 " + T.subjectName(s, o.s)} 시간입니다.`, "error");
      return false;
    }
    if (!A.ed.subj) { T.toast("과목을 먼저 고르세요.", "error"); return false; }
    if (!T.forGrade(T.subject(s, A.ed.subj), T.gradeOf(B))) { T.toast(`${T.subjectName(s, A.ed.subj)}은(는) ${T.gradeOf(B)}학년 과목이 아닙니다. 관리자가 기본설정 → 과목에서 학년을 켤 수 있습니다.`, "error"); return false; }
    const pb = T.personBusy(s, A.idx, pid, B, d, p, others);
    if (pb) { T.toast(`${B} ${p}교시는 ${pb.cls} ${pb.p}교시와 시각이 겹칩니다.`, "error"); return false; }
    if (A.ed.wroom) {
      const rb = T.roomBusy(s, A.idx, A.ed.wroom, B, d, p, (it) => it.pid === pid);
      if (rb) { T.toast(`${T.roomName(s, A.ed.wroom)}은(는) 이 시간에 ${rb.cls}이(가) 씁니다.`, "error"); return false; }
    }
    if (!opt.force && T.beyond(s, B, d, p)) return askBeyond(s, B, d, p, () => cellClick(d, p, { ...opt, force: true }));
    clash.forEach((i) => delete e[i.k]);
    e[k] = { s: A.ed.subj, r: A.ed.wroom || "" };
    setEntries(pid, e, [d, p]);
    if (keep.length) { const t = T.timeAt(s, B, p), t2 = T.timeAt(s, keep[0].cls, p); T.toast(`${T.DAYS[d]} ${p}교시: ${keep[0].cls}(${t2 ? t2.s : ""})와 ${B}(${t ? t.s : ""})는 시정이 달라 둘 다 넣었습니다.`); }
    return true;
  }
  // 넣은 칸 끌어서 옮기기 — 내가 넣은 다른 칸에 놓으면 두 칸을 서로 바꿈
  function myMainAt(pid, d, p) {
    if (A.ed.mode === "class") { const k = T.key(A.ed.cls, d, p); const v = (A.slots[pid] && A.slots[pid].e || {})[k]; return v ? { k, v } : null; }
    const m = T.cellItems(A.idx, "person", pid, d, p).find((i) => !i.b);
    return m ? { k: m.k, v: (A.slots[pid].e || {})[m.k] } : null;
  }
  function tryReplace(pid, e2, newKeys, okMsg) {
    const s = sc();
    for (const k of newKeys) {
      const { cls, p } = T.parseKey(k);
      if (p > T.periodsOf(s, cls)) { T.toast(`${cls}은(는) ${p}교시가 없습니다.`, "error"); render(); return false; }
    }
    const test = { ...A.slots, [pid]: { ...(A.slots[pid] || {}), e: e2 } };
    const idx = T.buildIndex(s, test);
    const bad = idx.conflicts.find((c) => c.items.some((it) => it.pid === pid && newKeys.includes(it.k)));
    if (bad) { T.toast("그렇게 옮기면 겹칩니다: " + T.conflictText(s, bad), "error"); render(); return false; }
    setEntries(pid, e2);
    if (okMsg) T.toast(okMsg);
    return true;
  }
  function moveCell(from, to, force) {
    const s = sc(), pid = actor();
    if (!canEditAs(pid) || (from.d === to.d && from.p === to.p)) return;
    if (!s.homeroomOpen && T.person(s, pid)?.role === "homeroom" && !A.me.admin) { T.toast("지금은 교과전담·강사 입력 기간입니다.", "error"); return; }
    const a = myMainAt(pid, from.d, from.p);
    if (!a || !a.v) return;
    if (a.v.j) { T.toast("함께 들어간 칸은 옮길 수 없습니다. 지우고 다시 넣으세요.", "error"); render(); return; }
    const b = myMainAt(pid, to.d, to.p);
    const e = myEntries(pid);
    const ca = T.parseKey(a.k).cls;
    if (!force && T.beyond(s, ca, to.d, to.p)) { askBeyond(s, ca, to.d, to.p, () => moveCell(from, to, true)); return; }
    if (!force && b && b.v && T.beyond(s, T.parseKey(b.k).cls, from.d, from.p)) { askBeyond(s, T.parseKey(b.k).cls, from.d, from.p, () => moveCell(from, to, true)); return; }
    if (b && b.v) {
      // 서로 바꾸기
      if (b.v.j) { T.toast("함께 들어간 칸과는 바꿀 수 없습니다.", "error"); render(); return; }
      const cb = T.parseKey(b.k).cls;
      const ka = T.key(ca, to.d, to.p), kb = T.key(cb, from.d, from.p);
      delete e[a.k]; delete e[b.k];
      e[ka] = a.v; e[kb] = b.v;
      tryReplace(pid, e, [ka, kb], `${T.DAYS[from.d]} ${from.p}교시 ↔ ${T.DAYS[to.d]} ${to.p}교시를 바꿨습니다.`);
      return;
    }
    // 빈 칸으로 옮기기
    const items = A.ed.mode === "class" ? T.cellItems(A.idx, "class", ca, to.d, to.p) : T.cellItems(A.idx, "class", ca, to.d, to.p).concat(T.cellItems(A.idx, "person", pid, to.d, to.p));
    if (items.some((it) => it.pid !== pid || it.b)) { T.toast(`${ca} ${T.DAYS[to.d]} ${to.p}교시는 이미 찬 시간입니다.`, "error"); render(); return; }
    const k1 = T.key(ca, to.d, to.p);
    delete e[a.k]; e[k1] = a.v;
    tryReplace(pid, e, [k1]);
  }

  /* ───────── 출력 ───────── */
  const prIds = (type) => {
    const s = sc();
    if (!A.pr.ids[type]) {
      if (type === "class") A.pr.ids.class = T.classList(s).map((c) => c.id);
      else if (type === "person") A.pr.ids.person = T.peopleSorted(s).filter((p) => p.role !== "homeroom").map((p) => p.id);
      else if (type === "room") A.pr.ids.room = (s.rooms || []).map((r) => r.id);
    }
    const valid = type === "class" ? new Set(T.classList(s).map((c) => c.id)) : type === "person" ? new Set((s.people || []).map((p) => p.id)) : new Set(T.roomList(s).map((r) => r.id));
    A.pr.ids[type] = A.pr.ids[type].filter((x) => valid.has(x));
    return A.pr.ids[type];
  };
  const sortIds = (type, ids) => {
    const s = sc();
    const order = type === "class" ? T.classList(s).map((c) => c.id) : type === "person" ? T.peopleSorted(s).map((p) => p.id) : T.roomList(s).map((r) => r.id);
    return ids.slice().sort((a, b) => order.indexOf(a) - order.indexOf(b));
  };
  function currentJob() {
    const s = sc(), pr = A.pr;
    if (!pr.grades) pr.grades = T.gradeList(s).map((x) => x.g);
    pr.grades = pr.grades.filter((g) => T.gradeList(s).some((x) => x.g === g));
    const job = { type: pr.type, orient: pr.orient, perPage: pr.perPage, basis: pr.basis, gradeStyle: pr.gradeStyle, hours: pr.hours, grades: pr.grades.slice().sort() };
    if (["class", "person", "room"].includes(pr.type)) job.ids = sortIds(pr.type, prIds(pr.type));
    return job;
  }
  const jobName = (job) => {
    const s = sc();
    const t = { class: "학급별", person: "교사강사별", room: "교실별", grade: "학년별", all: "전체" }[job.type];
    let x = "";
    if (job.ids && job.ids.length === 1) x = "_" + T.titleOf(s, job.type, job.ids[0]).replace(/\s+/g, "");
    if (job.type === "grade" && job.grades.length === 1) x = `_${job.grades[0]}학년`;
    if (job.type === "all") x = "_" + { class: "학급기준", person: "교사기준", room: "교실기준" }[job.basis];
    return `${s.name}_${t}시간표${x}_${job.orient === "landscape" ? "가로" : "세로"}`.replace(/[\\/:*?"<>|]/g, "");
  };

  function printTab() {
    const s = sc(), pr = A.pr;

    let target = "";

    if (pr.type === "person") target = `<div class="row-between"><b>선생님</b><span class="btn-row"><button class="link-btn" data-act="pr-all">모두</button><button class="link-btn" data-act="pr-subject">전담·강사만</button><button class="link-btn" data-act="pr-none">해제</button></span></div>${personChips(s, prIds("person"), "pr-id")}`;
    if (pr.type === "room") target = `<div class="row-between"><b>교실</b><span class="btn-row"><button class="link-btn" data-act="pr-all">모두</button><button class="link-btn" data-act="pr-none">해제</button></span></div>${roomChips(s, prIds("room"), "pr-id")}`;
    if (pr.type === "grade") target = `<b>학년</b><div class="chips">${T.gradeList(s).map(({ g }) => `<button class="chip ${pr.grades.includes(g) ? "on" : ""}" data-act="pr-grade" data-g="${g}">${g}학년</button>`).join("")}</div>
      <b>모양</b>${seg([["grid", "학급별 표 모아 보기"], ["matrix", "한 줄에 한 학급"]], pr.gradeStyle, "pr-gstyle")}`;
    if (pr.type === "all") target = `<b>기준</b>${seg([["class", "학급"], ["person", "교사·강사"], ["room", "교실"]], pr.basis, "pr-basis")}`;
    const perPage = ["class", "person", "room"].includes(pr.type)
      ? `<b>한 장에</b>${seg([[1, "1개"], [2, "2개"], [4, "4개"], [6, "6개"]], pr.perPage, "pr-per")}` : "";

    const pages = T.buildPages(s, A.idx, job);
    const MAXPV = 12;
    const P = T.PAPER[pr.orient];
    after.push(() => fitPreview());
    return `<div class="print-layout">
      <section class="panel print-opts">
        <h2 class="h2">출력</h2>
        <b>무엇을</b><div class="chips">${types.map(([k, l]) => `<button class="chip ${pr.type === k ? "on" : ""}" data-act="pr-type" data-v="${k}">${l}</button>`).join("")}</div>
        ${target}
        <b>용지</b>${seg([["landscape", "A4 가로"], ["portrait", "A4 세로"]], pr.orient, "pr-orient")}
        ${perPage}${hoursOpt}
        <div class="stack" style="gap:8px;padding-top:6px;border-top:1px solid var(--line)">
          <button class="btn primary" data-act="export" data-kind="pdf" ${pages.length ? "" : "disabled"}>PDF 저장 <small>(${pages.length}쪽)</small></button>
          <button class="btn" data-act="export" data-kind="jpg" ${pages.length ? "" : "disabled"}>JPG 저장${pages.length > 1 ? " <small>(묶음 zip)</small>" : ""}</button>
          <button class="btn" data-act="export" data-kind="xlsx" ${pages.length ? "" : "disabled"}>엑셀 저장 <small>(.xlsx)</small></button>
          ${window.claude ? `<p class="hint">Claude 화면에서는 바로 인쇄가 막혀 있습니다. PDF로 저장해 인쇄하세요.</p>` : `<button class="btn ghost" data-act="export" data-kind="print" ${pages.length ? "" : "disabled"}>바로 인쇄</button>`}
        </div>

        ${pages.length ? pages.slice(0, MAXPV).map((h, i) => `<div class="pv-page" data-i="${i}">${h}</div>`).join("") : `<p class="empty">출력할 대상을 고르세요.</p>`}
      </section>
    </div>`;
  }
  function fitPreview() {
    const pv = app.querySelector("#preview");
    if (!pv) return;
    const W = Number(pv.dataset.w), H = Number(pv.dataset.h);
    const avail = Math.min(pv.clientWidth - 28, 900);
    const k = Math.min(1, avail / W);
    const n = pv.querySelectorAll(".pv-page").length;
    pv.querySelectorAll(".pv-page").forEach((el, i) => {
      el.style.width = W * k + "px"; el.style.height = H * k + "px";
      const pg = el.firstElementChild;
      pg.style.transform = `scale(${k})`;
      T.numberPage(pg, i, n);
    });
  }
  window.addEventListener("resize", () => { if (A.tab === "print") fitPreview(); });

  async function doExport(kind, btn) {
    const job = currentJob();
    const pages = T.buildPages(sc(), A.idx, job);
    if (!pages.length) return;
    if (kind === "print") return T.printPages(pages, job.orient);
    await T.busy(btn, async () => {
      try {
        const prog = (i, n) => { if (btn.isConnected) btn.textContent = `만드는 중… ${i}/${n}`; };
        const ok = kind === "pdf" ? await T.exportPDF(pages, job.orient, jobName(job), prog)
          : kind === "xlsx" ? await T.exportXLSX(sc(), A.idx, job, jobName(job))
          : await T.exportJPG(pages, job.orient, jobName(job), prog);
        if (ok) T.toast({ pdf: "PDF를", xlsx: "엑셀 파일을", jpg: "JPG를" }[kind] + " 저장했습니다.");
      } catch (e) { T.toast(e.message || "저장하지 못했습니다.", "error"); }
    });
  }

  /* ───────── 기본설정 (관리자) ───────── */
  const draft = () => (A.set.draft = A.set.draft || T.normalize(T.clone(sc())));
  const markDirty = () => {

    const bar = app.querySelector(".dirty-bar");
    if (bar) bar.hidden = false;
  };
  async function loadCodes() {

  }

  function settingsTab() {
    if (!A.me.admin) {
      return `<section class="panel narrow"><h2 class="h2">기본설정</h2><p class="muted">학년별 학급 수, 시정표, 과목·장소, 선생님과 인증코드, 교과전담 배정, 묶음 수업은 관리자만 정합니다.</p>

    return `<section class="panel"><div class="row-between"><h2 class="h2">기본설정</h2><div class="set-nav">${secs.map(([k, l]) => `<button class="chip ${A.set.sec === k ? "on" : ""}" data-act="set-sec" data-v="${k}">${l}</button>`).join("")}</div></div></section>
      ${body}
      <div class="dirty-bar" ${A.set.dirty ? "" : "hidden"}><div class="wrap"><span><b>저장하지 않은 변경이 있습니다.</b> <span class="hint">저장해야 다른 선생님 화면에도 반영됩니다.</span></span>
        <span class="btn-row"><button class="btn ghost" data-act="set-revert">되돌리기</button><button class="btn primary" data-act="set-save">변경 사항 저장</button></span></div></div>`;
  }
  const inp = (path, val, attrs = "") => `<input data-s="${path}" data-f="s-${path}" value="${E(val ?? "")}" ${attrs}>`;
  // 숫자 칸: 직접 입력(숫자 자판) + −/＋ 단추
  const numf = (attrs, val, min = 0, max = 99) => `<span class="numf"><button type="button" class="nf-b" data-step="-1" tabindex="-1" aria-label="하나 줄이기">−</button><input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-min="${min}" data-max="${max}" value="${E(val ?? "")}" ${attrs}><button type="button" class="nf-b" data-step="1" tabindex="-1" aria-label="하나 늘리기">＋</button></span>`;
  T.numf = numf;
  const dragH = (list, i) => `<span class="drag-h" data-drag="list" data-list="${list}" data-i="${i}" title="끌어서 순서 바꾸기">⠿</span>`;

  function setBasic(d) {
    return `<section class="panel"><h3 class="h3">학교 정보</h3>

        <label class="field"><span>학년도</span>${inp("year", d.year, 'type="number" min="2020" max="2100"')}</label>
        <label class="field"><span>학기 <small>예: 1학기, 2학기, 여름방학</small></span>${inp("term", d.term)}</label>
      </div></section>
      <section class="panel"><h3 class="h3">학교 찾기</h3>
        <label class="check"><input type="checkbox" data-s="listed" data-bool="1" data-tri="1" ${d.listed !== false ? "checked" : ""}><span><b>첫 화면 학교 검색에 보이기</b><br><span class="hint">끄면 학교 이름으로 찾을 수 없고, 학교 코드를 정확히 아는 사람만 들어올 수 있습니다.</span></span></label>
      </section>
      <section class="panel"><h3 class="h3">입력 순서</h3>
        <p class="hint">교과전담·강사 시간표를 먼저 다 넣은 뒤 담임 입력을 열면, 담임 선생님은 남은 칸에만 넣게 됩니다.</p>
        <label class="check"><input type="radio" name="hro" data-on="hro" value="0" ${!d.homeroomOpen ? "checked" : ""}><span><b>1단계 · 교과전담·강사 먼저</b><br><span class="hint">담임은 보기만 할 수 있습니다.</span></span></label>
        <label class="check"><input type="radio" name="hro" data-on="hro" value="1" ${d.homeroomOpen ? "checked" : ""}><span><b>2단계 · 모두 입력</b><br><span class="hint">담임은 전담 시간(잠긴 칸)을 뺀 나머지에 넣습니다.</span></span></label>
      </section>`;

  function setGrid(d) {
    T.normalize(d);
    const maxG = d.level === "elem" ? 6 : 3;
    while ((d.classCounts || []).length < maxG) d.classCounts.push(0);
    const grades = Array.from({ length: maxG }, (_, i) => i + 1);
    const schedPanel = (x, i) => {
      while (x.times.length < 9) x.times.push({ s: "", e: "" });
      const used = grades.filter((g) => (d.classCounts[g - 1] || 0) > 0 && T.schedOfGrade(d, g).id === x.id);
      return `<div class="sched">
        <div class="row-between"><div class="grid-form three" style="flex:1 1 520px">

  function validate(d) {

  /* ───────── 미리보기에서 끌어 고치기 (자동 배치·자동 생성 창) ───────── */
  function pvGrid(s, merged, kind, id, pid) {
    const idx = T.buildIndex(s, merged);
    return `<div class="g-scroll pv">${T.gridHTML(s, idx, kind, id, { cell: (d, p) => {
      const items = T.cellItems(idx, kind, id, d, p);
      const c = T.cellContent(s, kind, id, items);
      const mine = items.some((it) => it.pid === pid && !it.j && !it.b);
      return { ...c, cls: `${c.cls || ""} ${mine ? "pv-mine" : c.html ? "pv-other" : "empty"}`, attrs: `data-pv="1" data-d="${d}" data-p="${p}" ${mine ? 'data-mine="1"' : ""}` };
    } })}</div>`;
  }
  // 미리보기 칸 옮기기/바꾸기 → { e } 또는 { err }
  function pvMove(s, merged, pid, kind, id, from, to, force) {
    const e = T.clone((merged[pid] && merged[pid].e) || {});
    const find = (d, p) => kind === "class"
      ? (e[T.key(id, d, p)] && !e[T.key(id, d, p)].j ? T.key(id, d, p) : null)
      : Object.keys(e).find((k) => { const q = T.parseKey(k); return q.d === d && q.p === p && !e[k].j; }) || null;
    const ka = find(from.d, from.p);
    if (!ka) return null;
    const kb = find(to.d, to.p);
    const a = T.parseKey(ka), va = e[ka];
    const keys = [];
    if (kb) {
      const b = T.parseKey(kb), vb = e[kb];
      delete e[ka]; delete e[kb];
      keys.push(T.key(a.cls, to.d, to.p), T.key(b.cls, from.d, from.p));
      e[keys[0]] = va; e[keys[1]] = vb;
    } else {
      delete e[ka];
      keys.push(T.key(a.cls, to.d, to.p));
      e[keys[0]] = va;
    }
    for (const k of keys) { const q = T.parseKey(k); if (q.p > T.periodsOf(s, q.cls)) return { err: `${q.cls}은(는) ${q.p}교시가 없습니다.` }; }
    if (!force) for (const k of keys) { const q = T.parseKey(k); if (T.beyond(s, q.cls, q.d, q.p)) return { ask: beyondMsg(s, q.cls, q.d, q.p) }; }
    const idx = T.buildIndex(s, { ...merged, [pid]: { e } });
    const bad = idx.conflicts.find((c) => c.items.some((it) => it.pid === pid && keys.includes(it.k)));
    if (bad) return { err: "그렇게 옮기면 겹칩니다: " + T.conflictText(s, bad) };
    return { e, swapped: !!kb };
  }
  // root 안의 미리보기 표에서 내 칸을 끌어 옮기면 onMove(pid, kind, id, from, to)
  function bindPv(root, onMove) {
    root._pvMove = onMove;
    if (root._pvBound) return;
    root._pvBound = true;
    let st = null, ghost = null, over = null;
    const clear = () => { if (ghost) ghost.remove(); ghost = null; if (over) over.classList.remove("drop-hover"); over = null; };
    root.addEventListener("pointerdown", (e) => {
      const td = e.target.closest("td[data-pv][data-mine]");
      if (!td || e.button !== 0) return;
      const box = td.closest("[data-pvbox]");
      st = { td, box, x: e.clientX, y: e.clientY, on: false, id: e.pointerId };
      try { td.setPointerCapture(e.pointerId); } catch (x) {}
      e.preventDefault();
    });
    root.addEventListener("pointermove", (e) => {
      if (!st || e.pointerId !== st.id) return;
      if (!st.on) {
        if (Math.hypot(e.clientX - st.x, e.clientY - st.y) < 6) return;
        st.on = true;
        const cell = st.td.querySelector(".cell");
        ghost = document.createElement("div");
        ghost.className = "drag-ghost";
        ghost.innerHTML = cell ? cell.innerHTML : "";
        ghost.setAttribute("style", (cell && cell.getAttribute("style")) || "");
        document.body.appendChild(ghost);
      }
      ghost.style.left = e.clientX + 8 + "px"; ghost.style.top = e.clientY + 8 + "px";
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const td = el && el.closest("td[data-pv]");
      const ok = td && td.closest("[data-pvbox]") === st.box ? td : null;
      if (over !== ok) { over && over.classList.remove("drop-hover"); ok && ok.classList.add("drop-hover"); over = ok; }
    });
    const end = (e) => {
      if (!st || e.pointerId !== st.id) return;
      const s0 = st, target = over;
      st = null; clear();
      if (!s0.on || !target || e.type === "pointercancel") return;
      const b = s0.box.dataset;
      root._pvMove(b.pvpid, b.pvkind, b.pvid, { d: Number(s0.td.dataset.d), p: Number(s0.td.dataset.p) }, { d: Number(target.dataset.d), p: Number(target.dataset.p) });
    };
    root.addEventListener("pointerup", end);
    root.addEventListener("pointercancel", end);
  }
  const pvBox = (s, merged, kind, id, pid) => `<div data-pvbox data-pvpid="${E(pid)}" data-pvkind="${kind}" data-pvid="${E(id)}">${pvGrid(s, merged, kind, id, pid)}</div>`;
  const pvHint = `<p class="hint pv-hint">✋ 미리보기에서 <b>칸을 끌어 옮기거나, 두 칸을 서로 바꿀</b> 수 있습니다. 고친 대로 적용됩니다.</p>`;

  // 자동 생성을 다시 누르면 다른 배치: 두 번째부터는 무작위 씨앗 + 흔들기를 키워, 앞 결과와 다를 때까지 몇 번 더 시도
  function regen(state, run, sig) {
    state.gen = (state.gen || 0) + 1;
    let r = null, n = 0;
    do {
      const opt = state.gen === 1 ? {} : { seed: 1 + Math.floor(Math.random() * 2e9), jitter: 3 + Math.random() * 3, tries: 25 };
      r = run(opt); n++;
    } while (state.gen > 1 && sig(r) === state.last && n < 8);
    state.last = sig(r);
    return r;
  }

          ${result.missing.length ? `<br>못 넣은 시간: ${Object.entries(miss).map(([c, n]) => `${E(c)} ${n}`).join(", ")} <span class="hint">— 그 반이 이미 차 있거나 교시 범위가 좁습니다.</span>` : ""}</div>${pvHint}`;
      void prev;
      const draw = () => { res.innerHTML = note + pvBox(s, { ...A.slots, ...result.slots }, "person", pid, pid); };
      draw();
      bindPv(res, (pp, kind, id, from, to, force) => {
        let r = pvMove(s, { ...A.slots, ...result.slots }, pid, kind, id, from, to, force);
        if (!r) return;
        if (r.ask) { T.confirm(r.ask, { ok: "넣기" }).then((y) => { if (y) res._pvMove(pp, kind, id, from, to, true); }); return; }
        if (r.err) { T.toast(r.err, "error"); return; }
        result.slots[pid] = { e: r.e }; draw(); T.toast(r.swapped ? "두 칸을 바꿨습니다." : "옮겼습니다.");
      });
      apply.hidden = false;
      apply.textContent = "이대로 적용"; apply.classList.replace("ghost", "primary");
      undo = null;
    });
    apply.addEventListener("click", async () => {
      if (!result) return;
      if (undo) { await applySlots(undo); T.toast("되돌렸습니다."); m.close(); return; }
      undo = { [pid]: { e: T.clone((A.slots[pid] && A.slots[pid].e) || {}) } };
      await T.busy(apply, () => applySlots(result.slots));
      T.toast(`${result.placed}시간을 넣었습니다.`);
      apply.textContent = "되돌리기"; apply.classList.replace("primary", "ghost");
    });
  }
  async function applySlots(map) {
    const pids = Object.keys(map);
    pids.forEach((pid) => { A.slots[pid] = { ...(A.slots[pid] || {}), e: T.clone(map[pid].e || {}) }; A.pending[pid] = true; });

  /* ───────── 끌어 놓기 (과목·학급 → 칸, 칸 → 칸, 설정 목록 순서) ───────── */
  const drag = { on: false };
  document.addEventListener("pointerdown", (e) => {
    drag.justDragged = 0;
    if (e.button !== 0) return;
    const br = e.target.closest("[data-drag]");
    const td = !br && e.target.closest(".ed-grid td[data-mine]");
    if (!br && !(td && e.pointerType === "mouse")) return;
    if (!app.contains(e.target)) return;
    Object.assign(drag, { on: false, src: br || td, x: e.clientX, y: e.clientY, kind: br ? br.dataset.drag : "move", ghost: null, over: null, id: e.pointerId });
    if (drag.kind === "list") e.preventDefault();
  });
  document.addEventListener("pointermove", (e) => {
    if (!drag.src || e.pointerId !== drag.id) return;
    if (!drag.on) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 7) return;
      drag.on = true;
      document.body.classList.add("dragging");
      if (drag.kind !== "list") {
        const g = document.createElement("div");
        g.className = "drag-ghost";
        const cell = drag.src.querySelector(".cell");
        g.innerHTML = drag.kind === "move" ? (cell ? cell.innerHTML : "") : drag.src.innerHTML;
        g.setAttribute("style", (cell || drag.src).getAttribute("style") || "");
        document.body.appendChild(g);
        drag.ghost = g;
      }
      try { drag.src.setPointerCapture && drag.src.releasePointerCapture(e.pointerId); } catch (x) {}
    }
    e.preventDefault();
    if (drag.ghost) { drag.ghost.style.left = e.clientX + 8 + "px"; drag.ghost.style.top = e.clientY + 8 + "px"; }
    // 화면 위·아래 끝으로 끌면 저절로 스크롤
    if (e.clientY > innerHeight - 50) window.scrollBy(0, 14); else if (e.clientY < 70) window.scrollBy(0, -14);
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (drag.kind === "list") {
      const tbl = drag.src.closest("[data-list-tbl]");
      const rows = [...tbl.querySelectorAll("[data-row]")];
      let at = rows.length;
      for (let i = 0; i < rows.length; i++) { const r = rows[i].getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { at = i; break; } }
      rows.forEach((r, i) => { r.classList.toggle("drop-above", i === at); r.classList.toggle("drop-below", at === rows.length && i === rows.length - 1); });
      drag.at = at;
      return;
    }
    const over = el && el.closest(".ed-grid td[data-act='cell']");
    if (drag.over !== over) { drag.over && drag.over.classList.remove("drop-hover"); over && over.classList.add("drop-hover"); drag.over = over; }
  }, { passive: false });
  const endDrag = (e) => {
    if (!drag.src || (e && e.pointerId !== drag.id)) return;
    const was = drag.on, src = drag.src, kind = drag.kind, over = drag.over, at = drag.at;
    drag.src = null; drag.on = false; drag.over = null; drag.at = null;
    document.body.classList.remove("dragging");
    if (drag.ghost) { drag.ghost.remove(); drag.ghost = null; }
    app.querySelectorAll(".drop-hover,.drop-above,.drop-below").forEach((x) => x.classList.remove("drop-hover", "drop-above", "drop-below"));
    if (!was || !e || e.type === "pointercancel") return;
    drag.justDragged = Date.now();
    if (kind === "list") {
      const list = src.dataset.list, from = Number(src.dataset.i);
      const arr = draft()[list];
      if (!arr || at == null) return;
      const to = at > from ? at - 1 : at;
      if (to === from) return;
      const [it] = arr.splice(from, 1);
      arr.splice(to, 0, it);
      markDirty(); render();
      return;
    }
    if (!over) return;
    const d = Number(over.dataset.d), p = Number(over.dataset.p);
    if (kind === "move") { moveCell({ d: Number(src.dataset.d), p: Number(src.dataset.p) }, { d, p }); return; }
    if (kind === "brush") {
      const b = src.dataset.erase ? { erase: true } : { s: src.dataset.s };
      A.ed.brush = b;
      if (b.s) A.ed.room = T.defaultRoomFor(sc(), actor(), b.s);
      if (!cellClick(d, p, { brush: b })) render();
    } else if (kind === "wbrush") {
      const b = src.dataset.erase ? { erase: true } : { cls: src.dataset.id };
      A.ed.wbrush = b;
      if (!cellClick(d, p, { brush: b })) render();
    }
  };
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);
  // 끌기가 끝난 직후의 '클릭'은 무시
  document.addEventListener("click", (e) => { if (drag.justDragged && Date.now() - drag.justDragged < 400) { e.stopPropagation(); e.preventDefault(); drag.justDragged = 0; } }, true);

  /* ───────── 화면 밝기: 자동 · 주간 · 야간 ───────── */
  const THEMES = { auto: ["🌓", "자동"], light: ["☀️", "주간"], dark: ["🌙", "야간"] };
  const getTheme = () => { try { const t = localStorage.getItem("tt-theme"); return THEMES[t] ? t : "auto"; } catch (e) { return "auto"; } };
  const applyTheme = (t) => { if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; };
  applyTheme(getTheme());
  const themeBtn = () => { const t = getTheme(); return `<button class="btn sm theme-btn" data-act="theme" title="화면 밝기: ${THEMES[t][1]} (누르면 바뀜)">${THEMES[t][0]} ${THEMES[t][1]}</button>`; };

  /* 숫자 칸 (화면·대화상자 어디서나) */
  document.addEventListener("click", (e) => {

    if (!b) return;

    const inp = b.parentElement.querySelector("input");
    const min = Number(inp.dataset.min) || 0, max = Number(inp.dataset.max) || 99;
    inp.value = String(Math.max(min, Math.min(max, (Number(inp.value) || 0) + Number(b.dataset.step))));
    inp.dispatchEvent(new Event("input", { bubbles: true }));
    inp.dispatchEvent(new Event("change", { bubbles: true }));
  });
  document.addEventListener("input", (e) => {
    const inp = e.target;
    if (!inp.closest || !inp.closest(".numf")) return;
    const clean = String(inp.value).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 65248)).replace(/[^0-9]/g, "").slice(0, 3);
    if (clean !== inp.value) inp.value = clean;
    const max = Number(inp.dataset.max) || 99;
    if (Number(inp.value) > max) inp.value = String(max);
  }, true);

      const d = draft(), i = Number(el.dataset.i), p = d.people[i];
      const n = Object.keys((A.slots[p.id] && A.slots[p.id].e) || {}).length;
      if (!(await T.confirm(`${T.personName(d, p.id)}${p.role === "homeroom" ? "" : " 선생님"}을(를) 지울까요?${n ? `\n이 선생님이 넣은 시간표 ${n}칸도 저장할 때 함께 지워집니다.` : ""}`, { ok: "지우기", danger: true }))) return;
      d.people.splice(i, 1); markDirty(); render();
    },
    "auto-hr": () => {
      const d = draft();
      T.classList(d).forEach((c) => { if (!d.people.some((p) => p.role === "homeroom" && p.cls === c.id)) d.people.push({ id: T.uid("p"), name: "", role: "homeroom", cls: c.id, subject: "", room: "" }); });
      markDirty(); render();
      T.toast("담임 자리를 만들었습니다. 이름을 넣고 저장하세요.");
    },
    "code-renew": (el) => renewCode(el.dataset.id),
    slips: (el) => makeSlips(el),
    "codes-csv": codesCsv,
    "admin-code": openAdminCode,
    backup: () => {
      const data = { format: "tt-backup", v: 1, sid: A.sid, savedAt: new Date().toISOString(), school: sc(), slots: A.slots };
      T.saveFile(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }), `${sc().name}_시간표_백업_${new Date().toISOString().slice(0, 10)}.json`);
    },
    "clear-all": async () => {
      if (!(await T.confirm("입력된 시간표를 모두 지울까요? 되돌릴 수 없습니다.\n(필요하면 먼저 백업 파일을 받아 두세요.)", { ok: "모두 지우기", danger: true }))) return;
      try { await store.clearSlots(A.sid); A.slots = {}; A.idx = T.buildIndex(sc(), {}); T.toast("모두 지웠습니다."); render(); } catch (e) { T.toast(e.message, "error"); }
    },
  };

  app.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el || !app.contains(el)) return;
    const fn = actions[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  app.addEventListener("submit", (e) => {
    const f = e.target.closest("[data-form]");
    if (!f) return;
    e.preventDefault();
    if (f.dataset.form === "join") {
      const raw = String(f.sid.value || "").trim();
      if (!raw) { T.toast("학교 이름이나 학교 코드를 넣어 주세요.", "error"); return; }
      (async () => {
        const list = await store.search(raw);
        const sid = T.cleanSid(raw);
        const exact = list.find((x) => x.sid === sid);
        if (exact || (T.validSid(sid) && !list.length)) { go(`/s/${encodeURIComponent(sid)}`); return; }
        if (list.length === 1) { go(`/s/${encodeURIComponent(list[0].sid)}`); return; }
        showResults(list, raw);
        if (!list.length) T.toast("찾는 학교가 없습니다. 학교 코드를 관리자에게 물어보세요.", "error");
      })();
    }
  });
  // 첫 화면 학교 검색 (입력하는 동안 바로)
  let searchT = 0, searchSeq = 0;
  function showResults(list, q) {
    const box = app.querySelector(".search-results");
    if (!box) return;
    if (!q) { box.innerHTML = ""; return; }
    box.innerHTML = list.length
      ? list.map((x) => `<button type="button" class="sr-item" data-act="open" data-sid="${E(x.sid)}"><b>${E(x.name || x.sid)}</b><small>${E(x.sid)}</small></button>`).join("")
      : `<p class="hint sr-none">'${E(q)}'(으)로 찾은 학교가 없습니다. 학교 코드를 정확히 넣거나 관리자에게 물어보세요.</p>`;
  }
  function liveSearch(q) {
    clearTimeout(searchT);
    const my = ++searchSeq;
    if (!String(q).trim()) { showResults([], ""); return; }
    searchT = setTimeout(async () => { const list = await store.search(q); if (my === searchSeq) showResults(list, q.trim()); }, 220);
  }
  const onField = (e) => {
    const el = e.target;
    if (el.dataset.s) {
      let v = el.dataset.bool ? el.checked : el.value;
      if (el.dataset.num) v = Number(v) || 0;
      const d = draft();
      setPath(d, el.dataset.s, v);
      if (el.dataset.s === "level" && e.type === "change") {
        const fresh = T.newSchool(d.name, v);
        d.classCounts = fresh.classCounts;
        if (!(Object.keys(A.slots).length)) { d.subjects = fresh.subjects; d.rooms = fresh.rooms; d.schedules = fresh.schedules; d.gradeSched = {}; d.periods = fresh.periods; }
      }
      if (el.dataset.s.endsWith(".role") && e.type === "change") { const i = Number(el.dataset.s.split(".")[1]); if (v !== "homeroom") d.people[i].cls = ""; else { d.people[i].subject = ""; d.people[i].room = ""; } }
      markDirty();
      if (e.type === "change" && (el.dataset.structural || el.dataset.s.startsWith("classCounts"))) render();
      return;
    }
    const on = el.dataset.on;
    if (!on || (e.type === "input" && el.tagName === "SELECT")) return;
    if (on === "act-as" && e.type === "change") { A.ed.actAs = el.value || null; A.ed.forActor = null; render(); }
    if (on === "ed-room") { A.ed.room = el.value; render(); }
    if (on === "ed-join" && e.type === "change") { A.ed.join = el.checked; render(); }
    if (on === "ed-cls" && e.type === "change") { A.ed.cls = el.value; render(); }
    if (on === "ed-subj") { if (el.value === "__new") { el.value = A.ed.subj || ""; openCustom((id) => { A.ed.subj = id; render(); }); return; } A.ed.subj = el.value; A.ed.wroom = T.defaultRoomFor(sc(), actor(), el.value); render(); }
    if (on === "ed-wroom") { A.ed.wroom = el.value; render(); }
    if (on === "my-room" && e.type === "change") setMyRoom(actor(), el.value);
    if (on === "pr-hours") { A.pr.hours = el.checked; render(); }
    if (on === "hro" && e.type === "change") { draft().homeroomOpen = el.value === "1"; markDirty(); }
    if (on === "restore" && e.type === "change" && el.files[0]) restore(el.files[0]);
  };
  app.addEventListener("input", (e) => {
    if (e.target.dataset.on === "school-q") { liveSearch(e.target.value); return; }
    if (e.target.dataset.s && e.target.tagName !== "SELECT" && e.target.type !== "checkbox") onField(e);
  });
  app.addEventListener("change", onField);

  /* ───────── 시작 ───────── */
  (async () => {
    app.innerHTML = `<div class="loading">불러오는 중…</div>`;
    try { store = await T.pickStore(); T.store = store; await store.init(); }
    catch (e) {
      app.innerHTML = `<div class="wrap main"><div class="panel narrow"><h2 class="h2">연결하지 못했습니다</h2><p class="muted">${E(e.message || e)}</p>
        <div class="btn-row"><button class="btn primary" onclick="location.reload()">다시 시도</button></div></div></div>`;
      return;
    }
    document.title = cfg.SITE_NAME || "함께 짜는 시간표";
    route();
    if (store.mode === "cloud" && store.info && store.info.version && store.info.version !== T.VERSION) A.newVersion = store.info.version, render();
  })();
})();

</script>
</body>
</html>

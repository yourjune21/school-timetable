    return `${store.mode === "demo" ? `<div class="demo-banner"><div class="wrap">체험 모드 — 이 브라우저에만 저장됩니다.${A.sid === T.EXAMPLE_ID ? ` 관리자 코드 <b>${T.EXAMPLE_CODES.admin}</b> · 선생님 코드 <b>${T.EXAMPLE_CODES.teacher}</b> · <button class="link-btn" data-act="reset-example">예시 처음 상태로</button>` : ""}</div></div>` : ""}
      <header class="school-bar"><div class="wrap school-bar-in">
        <div><p class="eyebrow">${E(T.termLabel(s))} 시간표 · 학교 코드 ${E(A.sid)}</p><h1 class="school-name">${E(s.name)}</h1></div>
        <div class="me">${meText ? `<span class="me-badge">${E(meText)}</span><button class="btn sm" data-act="logout">나가기</button>` : `<button class="btn sm" data-act="login">인증코드로 들어가기</button>`}
          <a class="btn sm" href="#/">학교 바꾸기</a></div>
      </div></header>
      <nav class="tabs-bar"><div class="wrap tabs">${tabs.map(([k, l]) => `<button class="tab ${A.tab === k ? "on" : ""}" data-act="tab" data-tab="${k}">${l}${k === "settings" && !me.admin ? ' <span class="lock">🔒</span>' : ""}</button>`).join("")}</div></nav>
      <main class="wrap main">${body}</main>`;
  }

  /* ───────── 인증 ───────── */
  function openLogin({ admin = false, pid = null } = {}) {
    const s = sc();
    const groups = T.ROLE_ORDER.map((r) => {
      const ps = T.peopleSorted(s).filter((p) => p.role === r);
      return ps.length ? `<optgroup label="${T.ROLES[r]}">${ps.map((p) => `<option value="${E(p.id)}" ${pid === p.id ? "selected" : ""}>${E(T.personName(s, p.id))}${p.role === "homeroom" && p.cls && p.name ? ` (${E(p.cls)})` : p.role !== "homeroom" ? ` (${E(T.personDesc(s, p.id))})` : ""}</option>`).join("")}</optgroup>` : "";
    }).join("");
    const m = T.modal({
      title: "인증코드로 들어가기",
      body: `<form class="stack" id="lg-form">
        <label class="field"><span>누구인가요?</span><select name="pid">
          <option value="">— 이름을 고르세요 —</option>
          <option value="${ADMIN}" ${admin ? "selected" : ""}>관리자 (기본설정)</option>${groups}</select></label>
        <label class="field"><span>인증코드</span><input name="code" type="password" autocomplete="off" class="code-input" placeholder="관리자에게 받은 코드"></label>
        ${A.sid === T.EXAMPLE_ID ? `<p class="note">체험 학교: 관리자 <b>${T.EXAMPLE_CODES.admin}</b>, 선생님은 누구든 <b>${T.EXAMPLE_CODES.teacher}</b></p>` : `<p class="hint">인증코드는 학교 관리자가 선생님마다 따로 나눠 줍니다. 자기 이름의 시간표만 고칠 수 있습니다.</p>`}
        <p class="errs" hidden></p>
        <div class="row-end"><button type="button" class="btn ghost" data-close>취소</button><button class="btn primary">들어가기</button></div>
      </form>`,
    });
    const f = m.el.querySelector("#lg-form");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const who = f.pid.value, code = T.cleanCode(f.code.value);
      const err = f.querySelector(".errs");
      if (!who || !code) { err.hidden = false; err.textContent = "이름과 인증코드를 넣어 주세요."; return; }
      await T.busy(f.querySelector(".btn.primary"), async () => {
        try {
          const ok = await store.login(A.sid, who, code);
          if (!ok) { err.hidden = false; err.textContent = "인증코드가 맞지 않습니다."; return; }
          if (who === ADMIN) A.me.admin = true; else { A.me.pid = who; A.ed.actAs = null; A.ed.forActor = null; }
          saveMe();
          m.close();
          T.toast(who === ADMIN ? "관리자로 들어왔습니다." : `${T.personName(s, who)} 선생님, 반갑습니다.`);
          render();
        } catch (ex) { err.hidden = false; err.textContent = ex.message || String(ex); }
      });
    });
  }
  async function logout() {
    if (A.me.pid) await store.logout(A.sid, A.me.pid);
    if (A.me.admin) await store.logout(A.sid, ADMIN);
    A.me = { pid: null, admin: false };
    A.ed.actAs = null; A.ed.forActor = null;
    A.set = { draft: null, dirty: false, sec: A.set.sec, codes: null, codesFor: null };
    saveMe();
    T.toast("나갔습니다.");
    render();
  }

  /* ───────── 고르기 부품 ───────── */
  const classChips = (s, selected, act, extra = () => "") =>
    `<div class="chip-rows">${T.gradeList(s).map(({ g }) => `<div><span class="chip-label">${g}학년</span><div class="chips">${T.classesOfGrade(s, g)
      .map((c) => `<button type="button" class="chip ${(Array.isArray(selected) ? selected.includes(c.id) : selected === c.id) ? "on" : ""}" data-act="${act}" data-id="${c.id}">${c.id}${extra(c.id)}</button>`).join("")}</div></div>`).join("")}</div>`;
  const personChips = (s, selected, act) =>
    `<div class="chip-rows">${T.ROLE_ORDER.map((r) => {
      const ps = T.peopleSorted(s).filter((p) => p.role === r);
      return ps.length ? `<div><span class="chip-label">${T.ROLES[r]}</span><div class="chips">${ps.map((p) => `<button type="button" class="chip ${(Array.isArray(selected) ? selected.includes(p.id) : selected === p.id) ? "on" : ""}" data-act="${act}" data-id="${E(p.id)}">${E(T.personName(s, p.id))}${p.role !== "homeroom" && p.subject ? ` <small>${E(T.subjectShort(s, p.subject))}</small>` : p.role === "homeroom" && p.name && p.cls ? ` <small>${E(p.cls)}</small>` : ""}</button>`).join("")}</div></div>` : "";
    }).join("") || `<p class="hint">기본설정에서 선생님을 먼저 추가하세요.</p>`}</div>`;
  const roomChips = (s, selected, act, withHomerooms = true) => {
    const sp = T.roomList(s).filter((r) => r.special);
    const sel = (id) => (Array.isArray(selected) ? selected.includes(id) : selected === id);
    return `<div class="chip-rows"><div><span class="chip-label">특별실</span><div class="chips">${sp.map((r) => `<button type="button" class="chip ${sel(r.id) ? "on" : ""}" data-act="${act}" data-id="${E(r.id)}">${E(r.name)}</button>`).join("") || '<span class="hint">없음</span>'}</div></div>
      ${withHomerooms ? T.gradeList(s).map(({ g }) => `<div><span class="chip-label">${g}학년 교실</span><div class="chips">${T.classesOfGrade(s, g).map((c) => `<button type="button" class="chip ${sel("hr:" + c.id) ? "on" : ""}" data-act="${act}" data-id="hr:${c.id}">${c.id}</button>`).join("")}</div></div>`).join("") : ""}</div>`;
  };
  const seg = (items, cur, act) => `<div class="seg">${items.map(([k, l]) => `<button type="button" class="${String(cur) === String(k) ? "on" : ""}" data-act="${act}" data-v="${E(k)}">${l}</button>`).join("")}</div>`;

  /* ───────── 조회 ───────── */
  function defaultViewId(kind) {
    const s = sc();
    if (kind === "class") {
      const mine = A.me.pid && T.person(s, A.me.pid);
      return (mine && mine.role === "homeroom" && mine.cls && T.hasClass(s, mine.cls) && mine.cls) || T.classList(s)[0]?.id || null;
    }
    if (kind === "person") return (A.me.pid && T.person(s, A.me.pid) && A.me.pid) || T.peopleSorted(s)[0]?.id || null;
    return T.roomList(s)[0]?.id || null;
  }
  function viewTab() {
    const s = sc(), v = A.view;
    const kinds = [["class", "학급"], ["person", "교사·강사"], ["room", "교실"], ["matrix", "한눈에 보기"]];
    let pick = "", content = "";
    if (v.kind === "matrix") {
      pick = `<div class="btn-row">${seg([["class", "학급 기준"], ["person", "교사·강사 기준"], ["room", "교실 기준"]], v.mx, "mx-basis")}
        ${v.mx === "class" ? seg([[0, "전체"], ...T.gradeList(s).map(({ g }) => [g, g + "학년"])], v.mxGrade, "mx-grade") : ""}</div>`;
      const rows = T.matrixRows(s, v.mx, v.mx === "class" && v.mxGrade ? { grade: Number(v.mxGrade) } : {});
      const cols = T.dayList(s).length * T.periodList(s).length;
      content = rows.length ? `<div class="sheet-card"><div class="row-between"><div><div class="sheet-title">전체 시간표</div><p class="sheet-sub">${E({ class: "학급", person: "교사·강사", room: "교실" }[v.mx])} 기준 · 칸에 마우스를 올리면 자세히 보입니다</p></div>
        <button class="btn sm" data-act="to-print" data-type="all" data-basis="${v.mx}">이 표 출력하기</button></div>
        <div class="mx-wrap" style="--mx-min:${110 + cols * 34}px;--mx-lw:110px">${T.matrixHTML(s, A.idx, v.mx, rows)}</div></div>` : `<p class="empty">표시할 항목이 없습니다.</p>`;
    } else {
      if (!v.id || (v.kind === "class" && !T.hasClass(s, v.id)) || (v.kind === "person" && !T.person(s, v.id)) || (v.kind === "room" && !T.roomList(s).some((r) => r.id === v.id))) v.id = defaultViewId(v.kind);
      pick = v.kind === "class" ? classChips(s, v.id, "view-id") : v.kind === "person" ? personChips(s, v.id, "view-id") : roomChips(s, v.id, "view-id");
      content = v.id ? `<div class="sheet-card">
          <div class="row-between"><div><div class="sheet-title">${E(T.titleOf(s, v.kind, v.id))} 시간표</div><p class="sheet-sub">${E(T.subtitleOf(s, v.kind, v.id))}</p></div>
          <div class="btn-row">${canEditAs(editPidFor(v.kind, v.id)) ? `<button class="btn sm" data-act="to-edit">입력하러 가기</button>` : ""}
            <button class="btn sm" data-act="to-print" data-type="${v.kind}" data-id="${E(v.id)}">출력하기</button></div></div>
          <div class="g-scroll">${T.gridHTML(s, A.idx, v.kind, v.id)}</div>
          ${T.hoursHTML(s, A.idx, v.kind, v.id) || `<p class="hint">아직 입력된 시간이 없습니다.</p>`}
        </div>` : `<p class="empty">표시할 항목이 없습니다. 기본설정을 먼저 해 주세요.</p>`;
    }
    const cf = A.idx ? A.idx.conflicts : [];
    return `<section class="panel">
        <div class="row-between"><h2 class="h2">시간표 보기</h2>${seg(kinds, v.kind, "view-kind")}</div>
        ${pick}
      </section>
      ${cf.length ? `<div class="conflict-box"><b>겹치는 시간 ${cf.length}건</b> — 같은 시간에 한 학급·한 선생님·한 교실이 두 번 쓰였습니다.<ul>${cf.slice(0, 8).map((c) => `<li>${E(T.conflictText(s, c))}</li>`).join("")}${cf.length > 8 ? `<li>…그 밖에 ${cf.length - 8}건</li>` : ""}</ul></div>` : ""}
      ${A.idx && A.idx.hidden ? `<p class="hint">학급 수·교시·요일을 바꾸어 표에 나오지 않는 입력이 ${A.idx.hidden}칸 있습니다.</p>` : ""}
      ${content}`;
  }
  const editPidFor = (kind, id) => {
    if (kind === "person") return id;
    if (kind === "class") return A.me.pid || (A.me.admin ? "x" : null);
    return null;
  };

  /* ───────── 입력 ───────── */
  function myEntries(pid) { return T.clone((A.slots[pid] && A.slots[pid].e) || {}); }
  function setEntries(pid, e, flash) {
    A.slots[pid] = { ...(A.slots[pid] || {}), e };
    A.idx = T.buildIndex(sc(), A.slots);
    A.pending[pid] = true;
    A.saveState = "saving";
    clearTimeout(A.timers[pid]);
    A.timers[pid] = setTimeout(() => flush(pid), 450);
    render();
    if (flash) { const td = app.querySelector(`td[data-d="${flash[0]}"][data-p="${flash[1]}"]`); td && td.classList.add("flash"); }
  }
  async function flush(pid) {
    const sid = A.sid;
    try {
      await store.saveSlots(sid, pid, A.slots[pid].e);
      if (A.sid !== sid) return;
      delete A.pending[pid];
      A.saveState = Object.keys(A.pending).length ? "saving" : "saved";
    } catch (err) {
      delete A.pending[pid];
      A.saveState = "err";
      T.toast(err.message || "저장하지 못했습니다.", "error");
      if (err instanceof T.Denied) {
        if (A.me.pid === pid) A.me.pid = null;
        saveMe();
        openLogin({ pid });
      }
    }
    const el = app.querySelector(".save-state");
    if (el) { el.className = "save-state " + A.saveState; el.textContent = saveText(); }
  }
  window.addEventListener("beforeunload", (e) => { if (Object.keys(A.pending).length) { e.preventDefault(); e.returnValue = ""; } });
  const saveText = () => ({ saving: "저장 중…", saved: "✓ 자동 저장됨", err: "⚠ 저장 실패 — 다시 들어와 주세요" }[A.saveState] || "누르는 즉시 자동 저장됩니다");

  function syncEdDefaults() {
    const s = sc(), pid = actor();
    if (A.ed.forActor === pid) return;
    A.ed.forActor = pid;
    const p = T.person(s, pid);
    A.ed.mode = p && p.role === "homeroom" ? "class" : "week";
    A.ed.cls = (p && p.role === "homeroom" && p.cls && T.hasClass(s, p.cls) && p.cls) || T.classList(s)[0]?.id || null;
    A.ed.brush = null;
    A.ed.room = "";
    A.ed.subj = (p && p.subject) || "";
    A.ed.wroom = (p && p.room) || "";
    A.ed.wbrush = null;
  }

  function editTab() {
    const s = sc();
    if (!A.me.pid && !A.me.admin) {
      return `<section class="panel narrow"><h2 class="h2">시간표 입력</h2>
        <p class="muted">입력하려면 본인 이름을 고르고 관리자에게 받은 인증코드를 넣으세요. 자기 이름으로 넣은 시간만 고칠 수 있고, 다른 선생님이 넣은 칸은 잠겨 있습니다.</p>
        <ol class="muted" style="padding-left:20px;margin:0">
          <li><b>교과전담·강사</b>: 내 주간 시간표에서 학급을 골라 칸을 누릅니다.</li>
          <li><b>담임</b>: 우리 반 시간표에서 전담 시간(잠긴 칸)을 뺀 나머지 칸에 과목을 넣습니다.</li></ol>
        <div><button class="btn primary" data-act="login">인증코드로 들어가기</button></div></section>`;
    }
    if (A.ed.actAs && !T.person(s, A.ed.actAs)) A.ed.actAs = null;
    const pid = actor();
    const adminPick = A.me.admin ? `<label class="field" style="min-width:220px"><span>${A.me.pid ? "다른 선생님 대신 입력" : "누구의 시간표를 입력할까요?"}</span>
      <select data-on="act-as"><option value="">${A.me.pid ? `나 (${E(T.personName(s, A.me.pid))})` : "— 선생님 고르기 —"}</option>${T.peopleSorted(s).filter((p) => p.id !== A.me.pid)
        .map((p) => `<option value="${E(p.id)}" ${A.ed.actAs === p.id ? "selected" : ""}>${E(T.personName(s, p.id))} · ${E(T.personDesc(s, p.id))}</option>`).join("")}</select></label>` : "";
    if (!pid || !T.person(s, pid)) {
      return `<section class="panel"><h2 class="h2">시간표 입력</h2>${adminPick || ""}
        <p class="muted">${(s.people || []).length ? "위에서 선생님을 고르면 그 선생님 이름으로 입력합니다." : "기본설정 → 선생님·인증코드에서 선생님을 먼저 추가하세요."}</p></section>`;
    }
    syncEdDefaults();
    const p = T.person(s, pid);
    const locked = !s.homeroomOpen && p.role === "homeroom" && !A.me.admin;
    const mode = A.ed.mode;
    const top = `<section class="panel">
      <div class="row-between"><div class="who"><span class="hint">입력하는 사람</span><span class="who-name">${E(T.personName(s, pid))}</span><span class="hint">${E(T.personDesc(s, pid))}</span></div>
        <span class="save-state ${A.saveState}">${saveText()}</span></div>
      <div class="btn-row" style="align-items:flex-end">${adminPick}
        ${seg([["class", "학급 시간표에 넣기"], ["week", "내 주간 시간표에 넣기"]], mode, "ed-mode")}</div>
      ${!s.homeroomOpen ? `<p class="note warn">지금은 <b>교과전담·강사 입력 기간</b>입니다. ${p.role === "homeroom" ? (A.me.admin ? "관리자라서 담임 시간표도 고칠 수 있습니다." : "관리자가 담임 입력을 열면 남은 칸에 시간표를 넣을 수 있습니다.") : "담임 선생님들은 아직 입력할 수 없습니다."}</p>` : ""}
    </section>`;
    if (locked) return top + `<section class="panel"><h2 class="h3">${E(p.cls ? T.className(p.cls) : "")} 시간표 (보기 전용)</h2>${p.cls && T.hasClass(s, p.cls) ? `<div class="g-scroll">${T.gridHTML(s, A.idx, "class", p.cls)}</div>` : ""}</section>`;
    return top + (mode === "class" ? editClass(s, pid, p) : editWeek(s, pid, p));
  }

  const roomOptions = (s, cur, homeLabel = "학급 교실 (기본)") =>
    `<option value="">${homeLabel}</option>${(s.rooms || []).map((r) => `<option value="${E(r.id)}" ${cur === r.id ? "selected" : ""}>${E(r.name)}${r.multi ? " (여러 학급 가능)" : ""}</option>`).join("")}`;

  function editClass(s, pid, p) {
    const cls = A.ed.cls;
    if (!cls || !T.hasClass(s, cls)) return `<section class="panel"><p class="empty">학급이 없습니다. 기본설정에서 학년별 학급 수를 정하세요.</p></section>`;
    const b = A.ed.brush;
    const palette = `<div class="palette">${(s.subjects || []).map((x) => `<button type="button" class="brush ${b && b.s === x.id ? "on" : ""}" style="${T.colorVars(x.color)}" data-act="brush" data-s="${E(x.id)}">${E(x.short || x.name)}</button>`).join("")}
      <button type="button" class="brush eraser ${b && b.erase ? "on" : ""}" data-act="brush" data-erase="1">지우개</button></div>`;
    const grid = T.gridHTML(s, A.idx, "class", cls, {
      cell: (d, pp) => {
        const items = T.cellItems(A.idx, "class", cls, d, pp);
        const attrs = `data-act="cell" data-d="${d}" data-p="${pp}"`;
        const others = items.filter((i) => i.pid !== pid), mine = items.filter((i) => i.pid === pid);
        if (others.length) {
          const o = others[0];
          return { cls: "locked", style: T.colorVars(T.subjectColor(s, o.s)), attrs: attrs + ` title="${E(T.personName(s, o.pid))} 선생님이 넣은 시간"`, html: `<b>${E(T.subjectShort(s, o.s))}</b><small>${E(T.personName(s, o.pid))}</small>${mine.length ? "<small>⚠ 겹침</small>" : ""}` };
        }
        if (mine.length) {
          const m = mine[0];
          return { cls: "mine", style: T.colorVars(T.subjectColor(s, m.s)), attrs, html: `<b>${E(T.subjectShort(s, m.s))}</b>${m.r ? `<small>${E(T.roomName(s, m.r))}</small>` : ""}` };
        }
        return { cls: "empty", attrs, html: "" };
      },
    });
    const hr = T.homeroomOf(s, cls);
    const clsSel = `<label class="field" style="min-width:150px"><span>학급</span><select data-on="ed-cls">${T.gradeList(s).map(({ g }) => `<optgroup label="${g}학년">${T.classesOfGrade(s, g).map((c) => `<option value="${c.id}" ${c.id === cls ? "selected" : ""}>${c.id}${p.role === "homeroom" && p.cls === c.id ? " (우리 반)" : ""}</option>`).join("")}</optgroup>`).join("")}</select></label>`;
    return `<div class="ed-layout">
        <section class="panel">
          <div class="row-between" style="align-items:flex-end"><div><h2 class="h2">${E(T.className(cls))}</h2><p class="hint">${hr ? `담임 ${E(T.personName(s, hr.id))} · ` : ""}🔒 칸은 다른 선생님(교과전담·강사)이 넣은 시간이라 고칠 수 없습니다.</p></div>${clsSel}</div>
          <div class="stack" style="gap:8px"><span class="hint"><b>① 과목을 고르고 ② 빈칸을 누르세요.</b> 같은 과목으로 한 번 더 누르면 지워집니다.</span>${palette}
            <label class="field" style="max-width:260px"><span>장소</span><select data-on="ed-room">${roomOptions(s, A.ed.room)}</select></label></div>
          <div class="g-scroll ed-grid">${grid}</div>
        </section>
        <aside class="side">
          <div class="panel"><h3 class="h3">${E(cls)} 과목별 시수</h3>${T.hoursHTML(s, A.idx, "class", cls) || '<p class="hint">아직 없음</p>'}</div>
          <div class="panel"><h3 class="h3">내가 넣은 시간</h3><p class="muted">이 학급 ${countMine(pid, cls)}시간 · 전체 ${countMine(pid)}시간</p>
            <button class="btn sm ghost" data-act="clear-mine" data-cls="${E(cls)}">이 학급에 넣은 내 시간 지우기</button></div>
        </aside>
      </div>`;
  }
  const countMine = (pid, cls) => Object.keys((A.slots[pid] && A.slots[pid].e) || {}).filter((k) => !cls || k.startsWith(cls + "|")).length;

  function editWeek(s, pid, p) {
    const wb = A.ed.wbrush;
    const mineBy = {};
    Object.keys((A.slots[pid] && A.slots[pid].e) || {}).forEach((k) => { const c = k.split("|")[0]; mineBy[c] = (mineBy[c] || 0) + 1; });
    const palette = `${classChips(s, wb && wb.cls ? wb.cls : null, "wbrush", (id) => (mineBy[id] ? ` <small>${mineBy[id]}</small>` : ""))}
      <div><button type="button" class="brush eraser ${wb && wb.erase ? "on" : ""}" data-act="wbrush" data-erase="1">지우개</button></div>`;
    const B = wb && wb.cls;
    const roomSel = A.ed.wroom;
    const roomObj = roomSel ? T.room(s, roomSel) : null;
    const grid = T.gridHTML(s, A.idx, "person", pid, {
      cell: (d, pp) => {
        const attrs = `data-act="cell" data-d="${d}" data-p="${pp}"`;
        const mine = T.cellItems(A.idx, "person", pid, d, pp);
        if (mine.length) {
          const m = mine[0];
          return { cls: "mine" + (mine.length > 1 ? " conflict" : ""), style: T.colorVars(T.subjectColor(s, m.s)), attrs, html: mine.length > 1 ? `<b>겹침</b><small>${E(mine.map((x) => x.cls).join(", "))}</small>` : `<b>${E(m.cls)}</b><small>${E(T.subjectShort(s, m.s))}${m.r ? " · " + E(T.roomName(s, m.r)) : ""}</small>` };
        }
        if (B) {
          const busy = T.cellItems(A.idx, "class", B, d, pp).filter((i) => i.pid !== pid);
          if (busy.length) return { cls: "busy", attrs, html: `<small>${E(B)} ${E(T.subjectShort(s, busy[0].s))}</small><small>${E(T.personName(s, busy[0].pid))}</small>` };
          if (roomObj && !roomObj.multi) {
            const rb = T.cellItems(A.idx, "room", roomSel, d, pp).filter((i) => i.pid !== pid);
            if (rb.length) return { cls: "busy", attrs, html: `<small>${E(roomObj.name)}</small><small>${E(rb[0].cls)} 사용</small>` };
          }
        }
        return { cls: "empty", attrs, html: "" };
      },
    });
    const h = T.hoursBy(A.idx, "person", pid);
    return `<div class="ed-layout">
        <section class="panel">
          <div><h2 class="h2">${E(T.personName(s, pid))} 선생님 주간 시간표</h2>
          <p class="hint"><b>① 과목·장소를 정하고 ② 학급을 고른 뒤 ③ 칸을 누르세요.</b> 학급을 고르면 그 반이 이미 찬 시간은 빗금으로 막힙니다. 같은 학급으로 한 번 더 누르면 지워집니다.</p></div>
          <div class="grid-form two">
            <label class="field"><span>과목</span><select data-on="ed-subj"><option value="">— 과목 고르기 —</option>${(s.subjects || []).map((x) => `<option value="${E(x.id)}" ${A.ed.subj === x.id ? "selected" : ""}>${E(x.name)}</option>`).join("")}</select></label>
            <label class="field"><span>장소</span><select data-on="ed-wroom">${roomOptions(s, A.ed.wroom, "각 학급 교실로 찾아감")}</select></label>
          </div>
          ${palette}
          <div class="g-scroll ed-grid">${grid}</div>
        </section>
        <aside class="side">
          <div class="panel"><h3 class="h3">내 수업 시수</h3><p class="muted">주 <b>${h.total}</b>시간</p>
            ${Object.keys(mineBy).length ? `<ul class="mini-list">${Object.keys(mineBy).sort((a, b) => T.clsKey(a) - T.clsKey(b)).map((c) => `<li><span>${E(c)}</span><b>${mineBy[c]}</b></li>`).join("")}</ul>` : '<p class="hint">아직 없음</p>'}
            ${T.hoursHTML(s, A.idx, "person", pid)}</div>
          <div class="panel"><button class="btn sm ghost" data-act="clear-mine">내 시간표 모두 지우기</button></div>
        </aside>
      </div>`;
  }

  function cellClick(d, p) {
    const s = sc(), pid = actor();
    if (!canEditAs(pid)) { openLogin({ pid }); return; }
    const per = T.person(s, pid);
    if (!s.homeroomOpen && per && per.role === "homeroom" && !A.me.admin) { T.toast("지금은 교과전담·강사 입력 기간입니다.", "error"); return; }
    const e = myEntries(pid);
    if (A.ed.mode === "class") {
      const cls = A.ed.cls, k = T.key(cls, d, p), b = A.ed.brush;
      const items = T.cellItems(A.idx, "class", cls, d, p);
      const others = items.filter((i) => i.pid !== pid);
      if (others.length) { T.toast(`${T.personName(s, others[0].pid)} 선생님이 넣은 ${T.subjectName(s, others[0].s)} 시간이라 고칠 수 없습니다.`, "error"); return; }
      if (!b) { T.toast(e[k] ? "지우려면 지우개를, 바꾸려면 다른 과목을 먼저 고르세요." : "위에서 과목을 먼저 고르세요.", "error"); return; }
      if (b.erase) { if (!e[k]) return; delete e[k]; return setEntries(pid, e, [d, p]); }
      if (e[k] && e[k].s === b.s && (e[k].r || "") === (A.ed.room || "")) { delete e[k]; return setEntries(pid, e, [d, p]); }
      const elsewhere = T.cellItems(A.idx, "person", pid, d, p).filter((i) => i.cls !== cls);
      if (elsewhere.length) { T.toast(`이 시간(${T.DAYS[d]} ${p}교시)에 이미 ${elsewhere[0].cls} 수업이 있습니다.`, "error"); return; }
      if (A.ed.room) {
        const r = T.room(s, A.ed.room);
        const rb = T.cellItems(A.idx, "room", A.ed.room, d, p).filter((i) => !(i.pid === pid && i.cls === cls));
        if (r && !r.multi && rb.length) { T.toast(`${r.name}은(는) 이 시간에 ${rb[0].cls}이(가) 씁니다.`, "error"); return; }
      }
      e[k] = { s: b.s, r: A.ed.room || "" };
      return setEntries(pid, e, [d, p]);
    }
    // 주간 모드
    const wb = A.ed.wbrush;
    const mine = T.cellItems(A.idx, "person", pid, d, p);
    if (!wb) { T.toast(mine.length ? "지우려면 지우개를 고르세요." : "아래에서 학급을 먼저 고르세요.", "error"); return; }
    if (wb.erase) { if (!mine.length) return; mine.forEach((i) => delete e[i.k]); return setEntries(pid, e, [d, p]); }
    const B = wb.cls, k = T.key(B, d, p);
    if (!A.ed.subj) { T.toast("과목을 먼저 고르세요.", "error"); return; }
    if (mine.length === 1 && mine[0].cls === B && e[k] && e[k].s === A.ed.subj && (e[k].r || "") === (A.ed.wroom || "")) { delete e[k]; return setEntries(pid, e, [d, p]); }
    const busy = T.cellItems(A.idx, "class", B, d, p).filter((i) => i.pid !== pid);
    if (busy.length) { T.toast(`${B} ${T.DAYS[d]} ${p}교시는 ${T.personName(s, busy[0].pid)} 선생님의 ${T.subjectName(s, busy[0].s)} 시간입니다.`, "error"); return; }
    if (A.ed.wroom) {
      const r = T.room(s, A.ed.wroom);
      const rb = T.cellItems(A.idx, "room", A.ed.wroom, d, p).filter((i) => i.pid !== pid);
      if (r && !r.multi && rb.length) { T.toast(`${r.name}은(는) 이 시간에 ${rb[0].cls}이(가) 씁니다.`, "error"); return; }
    }
    mine.forEach((i) => delete e[i.k]);
    e[k] = { s: A.ed.subj, r: A.ed.wroom || "" };
    setEntries(pid, e, [d, p]);
  }

  /* ───────── 출력 ───────── */
  const prIds = (type) => {
    const s = sc();
    if (!A.pr.ids[type]) {
      if (type === "class") A.pr.ids.class = T.classList(s).map((c) => c.id);
      else if (type === "person") A.pr.ids.person = T.peopleSorted(s).filter((p) => p.role !== "homeroom").map((p) => p.id);
      else if (type === "room") A.pr.ids.room = (s.rooms || []).map((r) => r.id);
    }
    const valid = type === "class" ? new Set(T.classList(s).map((c) => c.id)) : type === "person" ? new Set((s.people || []).map((p) => p.id)) : new Set(T.roomList(s).map((r) => r.id));
    A.pr.ids[type] = A.pr.ids[type].filter((x) => valid.has(x));
    return A.pr.ids[type];
  };
  const sortIds = (type, ids) => {
    const s = sc();
    const order = type === "class" ? T.classList(s).map((c) => c.id) : type === "person" ? T.peopleSorted(s).map((p) => p.id) : T.roomList(s).map((r) => r.id);
    return ids.slice().sort((a, b) => order.indexOf(a) - order.indexOf(b));
  };
  function currentJob() {
    const s = sc(), pr = A.pr;
    if (!pr.grades) pr.grades = T.gradeList(s).map((x) => x.g);
    pr.grades = pr.grades.filter((g) => T.gradeList(s).some((x) => x.g === g));
    const job = { type: pr.type, orient: pr.orient, perPage: pr.perPage, basis: pr.basis, gradeStyle: pr.gradeStyle, hours: pr.hours, grades: pr.grades.slice().sort() };
    if (["class", "person", "room"].includes(pr.type)) job.ids = sortIds(pr.type, prIds(pr.type));
    return job;
  }
  const jobName = (job) => {
    const s = sc();
    const t = { class: "학급별", person: "교사강사별", room: "교실별", grade: "학년별", all: "전체" }[job.type];
    let x = "";
    if (job.ids && job.ids.length === 1) x = "_" + T.titleOf(s, job.type, job.ids[0]).replace(/\s+/g, "");
    if (job.type === "grade" && job.grades.length === 1) x = `_${job.grades[0]}학년`;
    if (job.type === "all") x = "_" + { class: "학급기준", person: "교사기준", room: "교실기준" }[job.basis];
    return `${s.name}_${t}시간표${x}_${job.orient === "landscape" ? "가로" : "세로"}`.replace(/[\\/:*?"<>|]/g, "");
  };

  function printTab() {
    const s = sc(), pr = A.pr;
    const job = currentJob();
    const types = [["class", "학급별"], ["grade", "학년별"], ["person", "교사·강사별"], ["room", "교실별"], ["all", "전체 (한눈에)"]];
    let target = "";
    if (pr.type === "class") target = `<div class="row-between"><b>학급</b><span class="btn-row"><button class="link-btn" data-act="pr-all">모두</button><button class="link-btn" data-act="pr-none">해제</button></span></div>${classChips(s, prIds("class"), "pr-id")}`;
    if (pr.type === "person") target = `<div class="row-between"><b>선생님</b><span class="btn-row"><button class="link-btn" data-act="pr-all">모두</button><button class="link-btn" data-act="pr-subject">전담·강사만</button><button class="link-btn" data-act="pr-none">해제</button></span></div>${personChips(s, prIds("person"), "pr-id")}`;
    if (pr.type === "room") target = `<div class="row-between"><b>교실</b><span class="btn-row"><button class="link-btn" data-act="pr-all">모두</button><button class="link-btn" data-act="pr-none">해제</button></span></div>${roomChips(s, prIds("room"), "pr-id")}`;
    if (pr.type === "grade") target = `<b>학년</b><div class="chips">${T.gradeList(s).map(({ g }) => `<button class="chip ${pr.grades.includes(g) ? "on" : ""}" data-act="pr-grade" data-g="${g}">${g}학년</button>`).join("")}</div>
      <b>모양</b>${seg([["grid", "학급별 표 모아 보기"], ["matrix", "한 줄에 한 학급"]], pr.gradeStyle, "pr-gstyle")}`;
    if (pr.type === "all") target = `<b>기준</b>${seg([["class", "학급"], ["person", "교사·강사"], ["room", "교실"]], pr.basis, "pr-basis")}`;
    const perPage = ["class", "person", "room"].includes(pr.type)
      ? `<b>한 장에</b>${seg([[1, "1개"], [2, "2개"], [4, "4개"], [6, "6개"]], pr.perPage, "pr-per")}` : "";
    const hoursOpt = pr.type !== "all" && !(pr.type === "grade" && pr.gradeStyle === "matrix") ? `<label class="check"><input type="checkbox" data-on="pr-hours" ${pr.hours ? "checked" : ""}><span>과목별 시수 함께 출력</span></label>` : "";
    const pages = T.buildPages(s, A.idx, job);
    const MAXPV = 12;
    const P = T.PAPER[pr.orient];
    after.push(() => fitPreview());
    return `<div class="print-layout">
      <section class="panel print-opts">

  function fitPreview() {
    const pv = app.querySelector("#preview");
    if (!pv) return;
    const W = Number(pv.dataset.w), H = Number(pv.dataset.h);
    const avail = Math.min(pv.clientWidth - 28, 900);
    const k = Math.min(1, avail / W);
    const n = pv.querySelectorAll(".pv-page").length;
    pv.querySelectorAll(".pv-page").forEach((el, i) => {
      el.style.width = W * k + "px"; el.style.height = H * k + "px";
      const pg = el.firstElementChild;
      pg.style.transform = `scale(${k})`;
      T.numberPage(pg, i, n);
    });
  }

        const ok = kind === "pdf" ? await T.exportPDF(pages, job.orient, jobName(job), prog) : await T.exportJPG(pages, job.orient, jobName(job), prog);
        if (ok) T.toast(kind === "pdf" ? "PDF를 저장했습니다." : "JPG를 저장했습니다.");

  function setPath(obj, path, val) {
    const ks = path.split(".");
    let o = obj;
    ks.slice(0, -1).forEach((k) => (o = o[k]));
    o[ks[ks.length - 1]] = val;
  }
  function validate(d) {
    const errs = [];
    if (!String(d.name || "").trim()) errs.push("학교 이름을 넣어 주세요.");
    if (!d.days.length) errs.push("요일을 하나 이상 고르세요.");
    const names = d.subjects.map((x) => x.name.trim());
    if (names.some((n) => !n)) errs.push("이름이 빈 과목이 있습니다.");
    if (new Set(names).size !== names.length) errs.push("같은 이름의 과목이 두 개 있습니다.");
    if (d.rooms.some((r) => !String(r.name || "").trim())) errs.push("이름이 빈 장소가 있습니다.");
    const seen = {};
    d.people.forEach((p) => {
      if (p.role !== "homeroom") return;
      if (p.cls && !T.hasClass(d, p.cls)) errs.push(`${p.name || "담임"}: ${p.cls} 반이 없습니다(학급 수 확인).`);
      if (p.cls) { if (seen[p.cls]) errs.push(`${p.cls} 담임이 두 명입니다.`); seen[p.cls] = 1; }
    });
    return errs;
  }
  async function saveSettings(btn) {
    const d = draft();
    d.periods = Number(d.periods) || 6;
    d.times = d.times.slice(0, 9);
    d.classCounts = d.classCounts.slice(0, d.level === "elem" ? 6 : 3).map((n) => Math.max(0, Math.min(30, Number(n) || 0)));
    d.name = String(d.name).trim();
    d.year = Number(d.year) || "";
    const errs = validate(d);
    if (errs.length) { T.toast(errs[0], "error"); return; }
    await T.busy(btn, async () => {
      try {
        const before = new Set((sc().people || []).map((p) => p.id));
        const after2 = new Set(d.people.map((p) => p.id));
        const out = T.clone(d);
        out.updatedAt = new Date().toISOString();
        await store.saveSchool(A.sid, out);
        for (const pid of before) if (!after2.has(pid)) await store.removePerson(A.sid, pid);
        const codes = A.set.codes || {};
        let made = 0;
        for (const p of d.people) if (!codes[p.id]) { const c = T.newCode(); await store.setCode(A.sid, p.id, c); codes[p.id] = c; made++; }
        A.set.codes = codes;
        A.set.dirty = false; A.set.draft = null;
        A.school = out; A.idx = T.buildIndex(out, A.slots);
        T.toast(made ? `저장했습니다. 인증코드 ${made}개를 새로 만들었습니다.` : "저장했습니다.");
        render();
      } catch (e) {
        T.toast(e.message || "저장하지 못했습니다.", "error");
        if (e instanceof T.Denied) { A.me.admin = false; saveMe(); render(); }
      }
    });
  }

  async function renewCode(pid) {
    if (A.set.codes && A.set.codes[pid] && !(await T.confirm(`${T.personName(sc(), pid)} 선생님 인증코드를 새로 만들까요?\n예전 코드는 더 이상 쓸 수 없습니다.`, { ok: "새로 만들기" }))) return;
    try {
      const c = T.newCode();
      await store.setCode(A.sid, pid, c);
      A.set.codes = { ...(A.set.codes || {}), [pid]: c };
      T.toast(`새 코드: ${c}`);
      render();
    } catch (e) { T.toast(e.message, "error"); }
  }
  function openAdminCode() {
    const m = T.modal({
      title: "관리자 코드 바꾸기",
      body: `<form class="stack" id="ac-form"><div class="grid-form two">
        <label class="field"><span>새 관리자 코드</span><input name="a" type="password" class="code-input" autocomplete="new-password"></label>
        <label class="field"><span>한 번 더</span><input name="b" type="password" class="code-input" autocomplete="new-password"></label></div>
        <p class="errs" hidden></p><div class="row-end"><button type="button" class="btn ghost" data-close>취소</button><button class="btn primary">바꾸기</button></div></form>`,
    });
    const f = m.el.querySelector("#ac-form");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const a = T.cleanCode(f.a.value), err = f.querySelector(".errs");
      if (a.length < 6) { err.hidden = false; err.textContent = "영문·숫자 6자 이상으로 정하세요."; return; }
      if (a !== T.cleanCode(f.b.value)) { err.hidden = false; err.textContent = "두 번 넣은 코드가 다릅니다."; return; }
      await T.busy(f.querySelector(".btn.primary"), async () => {
        try { await store.setCode(A.sid, ADMIN, a); if (store.mode === "demo") await store.login(A.sid, ADMIN, a); m.close(); T.toast("관리자 코드를 바꿨습니다."); }
        catch (ex) { err.hidden = false; err.textContent = ex.message; }
      });
    });
  }
  async function makeSlips(btn) {
    const s = sc(), codes = A.set.codes || {};
    const list = T.peopleSorted(s).filter((p) => codes[p.id]).map((p) => ({ sid: A.sid, name: T.personName(s, p.id), desc: T.personDesc(s, p.id), code: codes[p.id] }));
    const url = location.href.split("#")[0].replace(/\?.*$/, "");
    const pages = T.buildSlipPages(s, list, /^https?:/.test(url) && !/claude|localhost|usercontent/.test(url) ? url : "시간표 사이트");
    await T.busy(btn, async () => {
      try { await T.exportPDF(pages, "portrait", `${s.name}_인증코드_안내문`); } catch (e) { T.toast(e.message, "error"); }
    });
  }
  function codesCsv() {
    const s = sc(), codes = A.set.codes || {};
    const rows = [["이름", "구분", "학급/과목", "인증코드"], ...T.peopleSorted(s).filter((p) => codes[p.id]).map((p) => [T.personName(s, p.id), T.ROLES[p.role], p.role === "homeroom" ? p.cls : T.subjectName(s, p.subject || ""), codes[p.id]])];
    const csv = "﻿" + rows.map((r) => r.map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
    T.saveFile(new Blob([csv], { type: "text/csv" }), `${s.name}_인증코드.csv`);
  }
  async function restore(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { T.toast("백업 파일을 읽지 못했습니다.", "error"); return; }
    if (!data || data.format !== "tt-backup" || !data.school) { T.toast("이 프로그램의 백업 파일이 아닙니다.", "error"); return; }
    if (!(await T.confirm(`백업(${data.school.name}, ${data.savedAt ? data.savedAt.slice(0, 10) : ""})으로 학교 설정과 모든 시간표를 바꿀까요?\n지금 자료는 사라집니다.`, { ok: "불러오기", danger: true }))) return;
    try {
      const before = (sc().people || []).map((p) => p.id);
      await store.saveSchool(A.sid, data.school);
      await store.putAllSlots(A.sid, data.slots || {});
      const keep = new Set(data.school.people.map((p) => p.id));
      for (const pid of before) if (!keep.has(pid)) await store.removePerson(A.sid, pid);
      A.set.codes = null; A.set.codesFor = null; A.set.draft = null; A.set.dirty = false;
      const codes = await store.getCodes(A.sid);
      for (const p of data.school.people) if (!codes[p.id]) await store.setCode(A.sid, p.id, T.newCode());
      A.set.codes = null; A.set.codesFor = null;
      T.toast("백업을 불러왔습니다.");
      render();
    } catch (e) { T.toast(e.message, "error"); }
  }

  /* ───────── 이벤트 ───────── */
  const actions = {
    open: (el) => go(`/s/${el.dataset.sid}`),
    "new-school": openNewSchool,
    "reset-example": async () => { if (await T.confirm("체험 학교를 처음 상태로 되돌릴까요?")) { await store.resetExample(); A.me = { pid: null, admin: false }; saveMe(); openSchool(T.EXAMPLE_ID); render(); } },
    tab: (el) => go(`/s/${A.sid}/${el.dataset.tab}`),
    login: () => openLogin(),
    "login-admin": () => openLogin({ admin: true }),
    logout,
    "view-kind": (el) => { A.view.kind = el.dataset.v; A.view.id = null; render(); },
    "view-id": (el) => { A.view.id = el.dataset.id; render(); },
    "mx-basis": (el) => { A.view.mx = el.dataset.v; render(); },
    "mx-grade": (el) => { A.view.mxGrade = Number(el.dataset.v); render(); },
    "to-edit": () => {
      const v = A.view;
      if (v.kind === "person" && A.me.admin && v.id !== A.me.pid) { A.ed.actAs = v.id; A.ed.forActor = null; }
      if (v.kind === "class" && actor()) { A.ed.forActor = null; syncEdDefaults(); A.ed.mode = "class"; A.ed.cls = v.id; }
      go(`/s/${A.sid}/edit`);
    },
    "to-print": (el) => {
      const t = el.dataset.type;
      A.pr.type = t;
      if (t === "all") A.pr.basis = el.dataset.basis || "class";
      else { A.pr.ids[t] = [el.dataset.id]; A.pr.perPage = 1; }
      go(`/s/${A.sid}/print`);
    },
    "ed-mode": (el) => { A.ed.mode = el.dataset.v; render(); },
    "ed-cls": (el) => { A.ed.cls = el.dataset.id; render(); },
    brush: (el) => {
      A.ed.brush = el.dataset.erase ? (A.ed.brush && A.ed.brush.erase ? null : { erase: true }) : A.ed.brush && A.ed.brush.s === el.dataset.s ? null : { s: el.dataset.s };
      render();
    },
    wbrush: (el) => {
      A.ed.wbrush = el.dataset.erase ? (A.ed.wbrush && A.ed.wbrush.erase ? null : { erase: true }) : A.ed.wbrush && A.ed.wbrush.cls === el.dataset.id ? null : { cls: el.dataset.id };
      render();
    },
    cell: (el) => cellClick(Number(el.dataset.d), Number(el.dataset.p)),
    "clear-mine": async (el) => {
      const pid = actor(), cls = el.dataset.cls;
      if (!(await T.confirm(cls ? `${cls}에 넣은 ${T.personName(sc(), pid)} 선생님 시간을 모두 지울까요?` : `${T.personName(sc(), pid)} 선생님 시간표를 모두 지울까요?`, { ok: "지우기", danger: true }))) return;
      const e = myEntries(pid);
      Object.keys(e).forEach((k) => { if (!cls || k.startsWith(cls + "|")) delete e[k]; });
      setEntries(pid, e);
    },
    "pr-type": (el) => { A.pr.type = el.dataset.v; render(); },
    "pr-id": (el) => { const ids = prIds(A.pr.type); const i = ids.indexOf(el.dataset.id); i >= 0 ? ids.splice(i, 1) : ids.push(el.dataset.id); render(); },
    "pr-all": () => {
      const s = sc();
      A.pr.ids[A.pr.type] = A.pr.type === "class" ? T.classList(s).map((c) => c.id) : A.pr.type === "person" ? T.peopleSorted(s).map((p) => p.id) : T.roomList(s).map((r) => r.id);
      render();
    },
    "pr-subject": () => { A.pr.ids.person = T.peopleSorted(sc()).filter((p) => p.role !== "homeroom").map((p) => p.id); render(); },
    "pr-none": () => { A.pr.ids[A.pr.type] = []; render(); },
    "pr-grade": (el) => { const g = Number(el.dataset.g); const i = A.pr.grades.indexOf(g); i >= 0 ? A.pr.grades.splice(i, 1) : A.pr.grades.push(g); render(); },
    "pr-gstyle": (el) => { A.pr.gradeStyle = el.dataset.v; render(); },
    "pr-basis": (el) => { A.pr.basis = el.dataset.v; render(); },
    "pr-orient": (el) => { A.pr.orient = el.dataset.v; render(); },
    "pr-per": (el) => { A.pr.perPage = Number(el.dataset.v); render(); },
    export: (el) => doExport(el.dataset.kind, el),
    "set-sec": (el) => { A.set.sec = el.dataset.v; render(); },
    "set-save": (el) => saveSettings(el),
    "set-revert": () => { A.set.draft = null; A.set.dirty = false; render(); },
    "set-day": (el) => { const d = draft(), x = Number(el.dataset.v); d.days = d.days.includes(x) ? d.days.filter((y) => y !== x) : [...d.days, x].sort(); markDirty(); render(); },
    "set-times-default": () => { const d = draft(); d.times = T.defaultTimes(d.level).map(([s, e]) => ({ s, e })); markDirty(); render(); },
    "subj-add": () => { draft().subjects.push({ id: T.uid("s"), name: "", short: "", color: T.COLOR_KEYS[draft().subjects.length % 12] }); markDirty(); render(); },
    "subj-del": async (el) => {
      const d = draft(), i = Number(el.dataset.i), x = d.subjects[i];
      const used = Object.values(A.slots).reduce((n, doc) => n + Object.values((doc && doc.e) || {}).filter((v) => v.s === x.id).length, 0);
      if (used && !(await T.confirm(`'${x.name}' 과목으로 넣은 칸이 ${used}개 있습니다. 그래도 지울까요?`, { ok: "지우기", danger: true }))) return;
      d.subjects.splice(i, 1); markDirty(); render();
    },
    "subj-move": (el) => { const d = draft(), i = Number(el.dataset.i), j = i + Number(el.dataset.v); [d.subjects[i], d.subjects[j]] = [d.subjects[j], d.subjects[i]]; markDirty(); render(); },
    "subj-color": (el) => { draft().subjects[Number(el.dataset.i)].color = el.dataset.v; markDirty(); render(); },
    "room-add": () => { draft().rooms.push({ id: T.uid("r"), name: "", multi: false }); markDirty(); render(); },
    "room-del": (el) => { draft().rooms.splice(Number(el.dataset.i), 1); markDirty(); render(); },
    "person-add": (el) => { draft().people.push({ id: T.uid("p"), name: "", role: el.dataset.role, cls: "", subject: "", room: "" }); markDirty(); render(); },
    "person-del": async (el) => {
      const d = draft(), i = Number(el.dataset.i), p = d.people[i];
      const n = Object.keys((A.slots[p.id] && A.slots[p.id].e) || {}).length;
      if (!(await T.confirm(`${T.personName(d, p.id)}${p.role === "homeroom" ? "" : " 선생님"}을(를) 지울까요?${n ? `\n이 선생님이 넣은 시간표 ${n}칸도 저장할 때 함께 지워집니다.` : ""}`, { ok: "지우기", danger: true }))) return;
      d.people.splice(i, 1); markDirty(); render();
    },
    "auto-hr": () => {
      const d = draft();
      T.classList(d).forEach((c) => { if (!d.people.some((p) => p.role === "homeroom" && p.cls === c.id)) d.people.push({ id: T.uid("p"), name: "", role: "homeroom", cls: c.id, subject: "", room: "" }); });
      markDirty(); render();
      T.toast("담임 자리를 만들었습니다. 이름을 넣고 저장하세요.");
    },
    "code-renew": (el) => renewCode(el.dataset.id),
    slips: (el) => makeSlips(el),
    "codes-csv": codesCsv,
    "admin-code": openAdminCode,
    backup: () => {
      const data = { format: "tt-backup", v: 1, sid: A.sid, savedAt: new Date().toISOString(), school: sc(), slots: A.slots };
      T.saveFile(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }), `${sc().name}_시간표_백업_${new Date().toISOString().slice(0, 10)}.json`);
    },
    "clear-all": async () => {
      if (!(await T.confirm("입력된 시간표를 모두 지울까요? 되돌릴 수 없습니다.\n(필요하면 먼저 백업 파일을 받아 두세요.)", { ok: "모두 지우기", danger: true }))) return;
      try { await store.clearSlots(A.sid); A.slots = {}; A.idx = T.buildIndex(sc(), {}); T.toast("모두 지웠습니다."); render(); } catch (e) { T.toast(e.message, "error"); }
    },
  };

  app.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el || !app.contains(el)) return;
    const fn = actions[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  app.addEventListener("submit", (e) => {
    const f = e.target.closest("[data-form]");
    if (!f) return;
    e.preventDefault();
    if (f.dataset.form === "join") {
      const sid = T.cleanSid(f.sid.value);
      if (!sid) { T.toast("학교 코드를 넣어 주세요.", "error"); return; }
      go(`/s/${encodeURIComponent(sid)}`);
    }
  });
  const onField = (e) => {
    const el = e.target;
    if (el.dataset.s) {
      let v = el.dataset.bool ? el.checked : el.value;
      if (el.dataset.num) v = Number(v) || 0;
      const d = draft();
      setPath(d, el.dataset.s, v);
      if (el.dataset.s === "level" && e.type === "change") {
        const fresh = T.newSchool(d.name, v);
        d.classCounts = fresh.classCounts;
        if (!(Object.keys(A.slots).length)) { d.subjects = fresh.subjects; d.rooms = fresh.rooms; d.times = fresh.times; d.periods = fresh.periods; }
      }
      if (el.dataset.s.endsWith(".role") && e.type === "change") { const i = Number(el.dataset.s.split(".")[1]); if (v !== "homeroom") d.people[i].cls = ""; else { d.people[i].subject = ""; d.people[i].room = ""; } }
      markDirty();
      if (e.type === "change" && (el.dataset.structural || el.dataset.s.startsWith("classCounts"))) render();
      return;
    }
    const on = el.dataset.on;
    if (!on || (e.type === "input" && el.tagName === "SELECT")) return;
    if (on === "act-as" && e.type === "change") { A.ed.actAs = el.value || null; A.ed.forActor = null; render(); }
    if (on === "ed-room") { A.ed.room = el.value; render(); }
    if (on === "ed-cls" && e.type === "change") { A.ed.cls = el.value; render(); }
    if (on === "ed-subj") { A.ed.subj = el.value; render(); }
    if (on === "ed-wroom") { A.ed.wroom = el.value; render(); }
    if (on === "pr-hours") { A.pr.hours = el.checked; render(); }
    if (on === "hro" && e.type === "change") { draft().homeroomOpen = el.value === "1"; markDirty(); }
    if (on === "restore" && e.type === "change" && el.files[0]) restore(el.files[0]);
  };
  app.addEventListener("input", (e) => { if (e.target.dataset.s && e.target.tagName !== "SELECT" && e.target.type !== "checkbox") onField(e); });
  app.addEventListener("change", onField);

  /* ───────── 시작 ───────── */
  (async () => {
    app.innerHTML = `<div class="loading">불러오는 중…</div>`;
    try { store = await T.pickStore(); T.store = store; await store.init(); }
    catch (e) {
      app.innerHTML = `<div class="wrap main"><div class="panel narrow"><h2 class="h2">연결하지 못했습니다</h2><p class="muted">${E(e.message || e)}</p>
        <div class="btn-row"><button class="btn primary" onclick="location.reload()">다시 시도</button></div></div></div>`;
      return;
    }
    document.title = cfg.SITE_NAME || "함께 짜는 시간표";
    route();
  })();
})();

</script>
</body>
</html>

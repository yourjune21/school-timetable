  /* ───────── 미리보기에서 끌어 고치기 (자동 배치·자동 생성 창) ───────── */
  function pvGrid(s, merged, kind, id, pid) {
    const idx = T.buildIndex(s, merged);
    return `<div class="g-scroll pv">${T.gridHTML(s, idx, kind, id, { cell: (d, p, r) => {
      const items = T.rowItems(s, T.cellItems(idx, kind, id, d, p), r);
      const c = T.cellContent(s, kind, id, items);
      const mi = items.find((it) => it.pid === pid && !it.j && !it.b);
      const mine = !!mi, pinned = mine && ((T._pvPins || {})[pid] || {})[mi.k];
      return { ...c, html: (c.html || "") + (pinned ? '<i class="pin" aria-label="고정">📌</i>' : ""), cls: `${c.cls || ""} ${mine ? "pv-mine" : c.html ? "pv-other" : "empty"}${pinned ? " pinned" : ""}`, attrs: `data-pv="1" data-d="${d}" data-p="${p}" ${mine ? `data-mine="1" data-k="${E(mi.k)}"` : ""} ${pinned ? "data-pinned" : ""}` };
    } })}</div>`;
  }
  // 미리보기 칸 옮기기/바꾸기 → { e } 또는 { err }
  function pvMove(s, merged, pid, kind, id, from, to, force) {
    const e = T.clone((merged[pid] && merged[pid].e) || {});
    const find = (d, p, t) => kind === "class"
      ? (e[T.key(id, d, p)] && !e[T.key(id, d, p)].j ? T.key(id, d, p) : null)
      : Object.keys(e).find((k) => { const q = T.parseKey(k); return q.d === d && q.p === p && !e[k].j && (t == null || T.span(s, q.cls, p).s === t); }) || null;
    const ka = find(from.d, from.p, from.t);
    if (!ka) return null;
    const kb = find(to.d, to.p, to.t);
    const rowBad = (cls, at) => at.t != null && T.span(s, cls, at.p).s !== at.t;
    if (rowBad(T.parseKey(ka).cls, to) || (kb && rowBad(T.parseKey(kb).cls, from))) return { err: "그 줄은 다른 학년 시각입니다. 같은 시각 줄로 옮기세요." };
    const a = T.parseKey(ka), va = e[ka];
    const keys = [];
    if (kb) {
      const b = T.parseKey(kb), vb = e[kb];
      delete e[ka]; delete e[kb];
      keys.push(T.key(a.cls, to.d, to.p), T.key(b.cls, from.d, from.p));
      e[keys[0]] = va; e[keys[1]] = vb;
    } else {
      delete e[ka];
      keys.push(T.key(a.cls, to.d, to.p));
      e[keys[0]] = va;
    }
    for (const k of keys) { const q = T.parseKey(k); if (q.p > T.periodsOf(s, q.cls)) return { err: `${q.cls}은(는) ${q.p}교시가 없습니다.` }; }
    if (!force) for (const k of keys) { const q = T.parseKey(k); if (T.beyond(s, q.cls, q.d, q.p)) return { ask: beyondMsg(s, q.cls, q.d, q.p) }; }
    const idx = T.buildIndex(s, { ...merged, [pid]: { e } });
    const bad = idx.conflicts.find((c) => c.items.some((it) => it.pid === pid && keys.includes(it.k)));
    if (bad) return { err: "그렇게 옮기면 겹칩니다: " + T.conflictText(s, bad) };
    const ld = lunchBroken(s, T.buildIndex(s, merged), idx, pid, keys);
    if (ld) return { err: `${T.DAYS[ld]}요일: ${T.lunchMsg(s)}` };
    return { e, swapped: !!kb };
  }
  // root 안의 미리보기 표에서 내 칸을 끌어 옮기면 onMove(pid, kind, id, from, to)
  // 미리보기 칸 고정 (길게 누르기 · 두 번 누르기): 다시 생성해도 그 칸은 그대로
  function togglePin(res, pid, k, v) {
    res._pins = res._pins || {};
    const m = (res._pins[pid] = res._pins[pid] || {});
    if (m[k]) { delete m[k]; T.toast("고정을 풀었습니다."); }
    else if (v) { m[k] = T.clone(v); T.toast("📌 이 칸을 고정했습니다. '다시 생성'해도 그대로 둡니다."); }
  }
  function bindPv(root, onMove, onPin) {
    root._pvMove = onMove;

    root._pvBound = true;
    root.addEventListener("dblclick", (e) => { const td = e.target.closest("td[data-pv][data-mine]"); if (td && root._pvPin && td.dataset.k) { e.preventDefault(); root._pvPin(td.closest("[data-pvbox]").dataset.pvpid, td.dataset.k); } });
    let st = null, ghost = null, over = null;
    const clear = () => { if (ghost) ghost.remove(); ghost = null; if (over) over.classList.remove("drop-hover"); over = null; };
    root.addEventListener("pointerdown", (e) => {
      const td = e.target.closest("td[data-pv][data-mine]");
      if (!td || e.button !== 0) return;
      const box = td.closest("[data-pvbox]");
      st = { td, box, x: e.clientX, y: e.clientY, on: false, id: e.pointerId, pinned: td.hasAttribute("data-pinned") };
      // 길게 누르면 고정/풀기
      st.timer = setTimeout(() => { if (st && !st.on && root._pvPin && td.dataset.k) { const pid0 = box.dataset.pvpid; st = null; clear(); root._pvPin(pid0, td.dataset.k); } }, 550);

        st.on = true;

      const el = document.elementFromPoint(e.clientX, e.clientY);
      const td = el && el.closest("td[data-pv]");
      const ok = td && td.closest("[data-pvbox]") === st.box ? td : null;
      if (over !== ok) { over && over.classList.remove("drop-hover"); ok && ok.classList.add("drop-hover"); over = ok; }
    });
    const end = (e) => {
      if (!st || e.pointerId !== st.id) return;
      clearTimeout(st.timer);

      const b = s0.box.dataset;
      root._pvMove(b.pvpid, b.pvkind, b.pvid, { d: Number(s0.td.dataset.d), p: Number(s0.td.dataset.p), t: tOf(s0.td) }, { d: Number(target.dataset.d), p: Number(target.dataset.p), t: tOf(target) });
    };
    root.addEventListener("pointerup", end);
    root.addEventListener("pointercancel", end);
  }
  const pvBox = (s, merged, kind, id, pid) => `<div data-pvbox data-pvpid="${E(pid)}" data-pvkind="${kind}" data-pvid="${E(id)}">${pvGrid(s, merged, kind, id, pid)}</div>`;
  const pvHint = `<p class="hint pv-hint">✋ 미리보기에서 <b>칸을 끌어 옮기거나 두 칸을 서로 바꿀</b> 수 있습니다. 칸을 <b>길게 누르면(PC는 두 번 클릭) 📌 고정</b> — '다시 생성'해도 그 칸은 그대로 둡니다.</p>`;

  // 자동 생성을 다시 누르면 다른 배치: 두 번째부터는 무작위 씨앗 + 흔들기를 키워, 앞 결과와 다를 때까지 몇 번 더 시도
  function regen(state, run, sig) {
    state.gen = (state.gen || 0) + 1;
    let r = null, n = 0;
    do {
      const opt = state.gen === 1 ? {} : { seed: 1 + Math.floor(Math.random() * 2e9), jitter: 3 + Math.random() * 3, tries: 25 };
      r = run(opt); n++;
    } while (state.gen > 1 && sig(r) === state.last && n < 8);
    state.last = sig(r);
    return r;
  }
  /* ───────── 교담 자동 배치 ───────── */
  function openAutoPlace(onlyPid) {

    f.s.addEventListener("change", () => { f.querySelector(".wf-body").innerHTML = body(f.s.value); });
    let result = null, undo = null;
    const gstate = {};
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      const sid = f.s.value;
      const asg = [];
      f.querySelectorAll('input[name="h"]').forEach((i) => {
        const g = Number(i.dataset.g), h = Math.max(0, Math.min(10, Number(i.value) || 0));
        const classes = [...f.querySelectorAll(`input[name="c"][data-g="${g}"]:checked`)].map((x) => x.value);
        if (h && classes.length) asg.push({ id: "tmp" + g, g, s: sid, pid, h, classes, r: f.r.value });
      });
      if (!asg.length) { T.toast("학년별 시수를 하나 이상 넣으세요.", "error"); return; }
      const pmin = Number(f.pmin.value), pmax = Number(f.pmax.value);
      if (pmin > pmax) { T.toast("시작 교시가 끝 교시보다 늦습니다.", "error"); return; }
      result = regen(gstate, (o) => T.autoPlace(s, A.slots, asg, { pmin, pmax, reset: f.mode.value === "reset", sameDay: f.same.checked, pinned: res._pins || {}, ...o }), (r) => JSON.stringify(r.slots));
      f.querySelector('[type="submit"]').textContent = "🔀 다시 생성하기";
      const miss = {};
      result.missing.forEach((x) => (miss[x.cls] = (miss[x.cls] || 0) + 1));
      const prev = { ...A.slots, ...result.slots };
      res.hidden = false;
      const note = `<div class="${result.missing.length ? "note warn" : "note"}"><b>${result.placed}시간</b>을 넣었습니다${result.wanted ? ` (필요 ${result.wanted}시간)` : ""}.
          ${result.missing.length ? `<br>못 넣은 시간: ${Object.entries(miss).map(([c, n]) => `${E(c)} ${n}`).join(", ")} <span class="hint">— 그 반이 이미 차 있거나 교시 범위가 좁습니다.</span>` : ""}</div>${pvHint}`;
      void prev;
      const draw = () => { T._pvPins = res._pins || {}; res.innerHTML = note + pvBox(s, { ...A.slots, ...result.slots }, "person", pid, pid); };
      draw();
      bindPv(res, (pp, kind, id, from, to, force) => {
        let r = pvMove(s, { ...A.slots, ...result.slots }, pid, kind, id, from, to, force);
        if (!r) return;
        if (r.ask) { T.confirm(r.ask, { ok: "넣기" }).then((y) => { if (y) res._pvMove(pp, kind, id, from, to, true); }); return; }
        if (r.err) { T.toast(r.err, "error"); return; }
        result.slots[pid] = { e: r.e }; draw(); T.toast(r.swapped ? "두 칸을 바꿨습니다." : "옮겼습니다.");
      }, (pp, k) => { togglePin(res, pp, k, (((result.slots[pp] || A.slots[pp] || {}).e) || {})[k]); draw(); });
      apply.hidden = false;
      apply.textContent = "이대로 적용"; apply.classList.replace("ghost", "primary");
      undo = null;
    });
    apply.addEventListener("click", async () => {
      if (!result) return;
      if (undo) { await applySlots(undo); T.toast("되돌렸습니다."); m.close(); return; }
      undo = { [pid]: { e: T.clone((A.slots[pid] && A.slots[pid].e) || {}) } };
      await T.busy(apply, () => applySlots(result.slots));
      T.toast(`${result.placed}시간을 넣었습니다.`);
      apply.textContent = "되돌리기"; apply.classList.replace("primary", "ghost");

  /* ───────── 끌어 놓기 (과목·학급 → 칸, 칸 → 칸, 설정 목록 순서) ───────── */
  const drag = { on: false };
  document.addEventListener("pointerdown", (e) => {
    drag.justDragged = 0;
    if (e.button !== 0) return;
    const br = e.target.closest("[data-drag]");
    const td = !br && e.target.closest(".ed-grid td[data-mine]");
    if (!br && !(td && e.pointerType === "mouse")) return;
    if (!app.contains(e.target)) return;
    Object.assign(drag, { on: false, src: br || td, x: e.clientX, y: e.clientY, kind: br ? br.dataset.drag : "move", ghost: null, over: null, id: e.pointerId });
    if (drag.kind === "list" || drag.kind === "brk") e.preventDefault();
  });
  document.addEventListener("pointermove", (e) => {
    if (!drag.src || e.pointerId !== drag.id) return;
    if (!drag.on) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 7) return;
      drag.on = true;
      document.body.classList.add("dragging");
      if (drag.kind !== "list" && drag.kind !== "brk") {
        const g = document.createElement("div");
        g.className = "drag-ghost";
        const cell = drag.src.querySelector(".cell");
        g.innerHTML = drag.kind === "move" ? (cell ? cell.innerHTML : "") : drag.src.innerHTML;
        g.setAttribute("style", (cell || drag.src).getAttribute("style") || "");
        document.body.appendChild(g);
        drag.ghost = g;
      }
      try { drag.src.setPointerCapture && drag.src.releasePointerCapture(e.pointerId); } catch (x) {}
    }
    e.preventDefault();
    if (drag.ghost) { drag.ghost.style.left = e.clientX + 8 + "px"; drag.ghost.style.top = e.clientY + 8 + "px"; }
    // 화면 위·아래 끝으로 끌면 저절로 스크롤
    if (e.clientY > innerHeight - 50) window.scrollBy(0, 14); else if (e.clientY < 70) window.scrollBy(0, -14);
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (drag.kind === "brk") {
      const tbl = drag.src.closest("table");
      const tr = el && el.closest("tr[data-at]");
      const ok = tr && tbl.contains(tr) ? tr : null;
      tbl.querySelectorAll("tr[data-at]").forEach((r) => r.classList.toggle("drop-below", r === ok));
      drag.at = ok ? Number(ok.dataset.at) : null;
      return;
    }
    if (drag.kind === "list") {
      const tbl = drag.src.closest("[data-list-tbl]");
      const rows = [...tbl.querySelectorAll("[data-row]")];
      let at = rows.length;
      for (let i = 0; i < rows.length; i++) { const r = rows[i].getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { at = i; break; } }
      rows.forEach((r, i) => { r.classList.toggle("drop-above", i === at); r.classList.toggle("drop-below", at === rows.length && i === rows.length - 1); });
      // 목록 일부만 보일 때(학년군별 과목)도 전체 목록의 자리로 바꿈
      drag.at = rows.length ? (at < rows.length ? Number(rows[at].dataset.row) : Number(rows[rows.length - 1].dataset.row) + 1) : at;
      return;
    }
    const over = el && el.closest(".ed-grid td[data-act='cell']");
    if (drag.over !== over) { drag.over && drag.over.classList.remove("drop-hover"); over && over.classList.add("drop-hover"); drag.over = over; }
  }, { passive: false });
  const endDrag = (e) => {
    if (!drag.src || (e && e.pointerId !== drag.id)) return;
    const was = drag.on, src = drag.src, kind = drag.kind, over = drag.over, at = drag.at;
    drag.src = null; drag.on = false; drag.over = null; drag.at = null;
    document.body.classList.remove("dragging");
    if (drag.ghost) { drag.ghost.remove(); drag.ghost = null; }
    app.querySelectorAll(".drop-hover,.drop-above,.drop-below").forEach((x) => x.classList.remove("drop-hover", "drop-above", "drop-below"));
    document.querySelectorAll("tr.drop-below").forEach((r) => r.classList.remove("drop-below"));
    if (!was || !e || e.type === "pointercancel") return;
    drag.justDragged = Date.now();
    if (kind === "brk") { if (at != null) moveBreak(Number(src.dataset.i), src.dataset.b, at); return; }
    if (kind === "list") {
      const list = src.dataset.list, from = Number(src.dataset.i);
      const arr = draft()[list];
      if (!arr || at == null) return;
      const to = at > from ? at - 1 : at;
      if (to === from) return;
      const [it] = arr.splice(from, 1);
      arr.splice(to, 0, it);
      markDirty(); render();
      return;
    }
    if (!over) return;
    const d = Number(over.dataset.d), p = Number(over.dataset.p), t = tOf(over);
    if (kind === "move") { moveCell({ d: Number(src.dataset.d), p: Number(src.dataset.p), t: tOf(src) }, { d, p, t }); return; }
    if (kind === "brush") {
      const b = src.dataset.erase ? { erase: true } : { s: src.dataset.s };
      A.ed.brush = b;
      if (b.s) A.ed.room = T.defaultRoomFor(sc(), actor(), b.s);
      if (!cellClick(d, p, { brush: b, t })) render();
    } else if (kind === "wbrush") {
      const b = src.dataset.erase ? { erase: true } : { cls: src.dataset.id };
      A.ed.wbrush = b;
      if (!cellClick(d, p, { brush: b, t })) render();
    }
  };
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);
  // 끌기가 끝난 직후의 '클릭'은 무시
  document.addEventListener("click", (e) => { if (drag.justDragged && Date.now() - drag.justDragged < 400) { e.stopPropagation(); e.preventDefault(); drag.justDragged = 0; } }, true);

  /* ───────── 화면 밝기: 자동 · 주간 · 야간 ───────── */
  const THEMES = { auto: ["🌓", "자동"], light: ["☀️", "주간"], dark: ["🌙", "야간"] };
  const getTheme = () => { try { const t = localStorage.getItem("tt-theme"); return THEMES[t] ? t : "auto"; } catch (e) { return "auto"; } };
  const applyTheme = (t) => { if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; };
  applyTheme(getTheme());
  const themeBtn = () => { const t = getTheme(); return `<button class="btn sm theme-btn" data-act="theme" title="화면 밝기: ${THEMES[t][1]} (누르면 바뀜)">${THEMES[t][0]} ${THEMES[t][1]}</button>`; };

  /* 숫자 칸 (화면·대화상자 어디서나) */
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".numf [data-step]");
    if (!b) return;
    e.preventDefault();
    const inp = b.parentElement.querySelector("input");
    const min = Number(inp.dataset.min) || 0, max = Number(inp.dataset.max) || 99;
    inp.value = String(Math.max(min, Math.min(max, (Number(inp.value) || 0) + Number(b.dataset.step))));
    inp.dispatchEvent(new Event("input", { bubbles: true }));
    inp.dispatchEvent(new Event("change", { bubbles: true }));
  });
  document.addEventListener("input", (e) => {
    const inp = e.target;
    if (!inp.closest || !inp.closest(".numf")) return;
    const clean = String(inp.value).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 65248)).replace(/[^0-9]/g, "").slice(0, 3);
    if (clean !== inp.value) inp.value = clean;
    const max = Number(inp.dataset.max) || 99;
    if (Number(inp.value) > max) inp.value = String(max);
  }, true);
  document.addEventListener("focusin", (e) => { if (e.target.closest && e.target.closest(".numf")) setTimeout(() => { try { e.target.select(); } catch (x) {} }, 0); });

    "codes-csv": codesCsv,
    "admin-code": openAdminCode,
    backup: () => {
      const data = { format: "tt-backup", v: 1, sid: A.sid, savedAt: new Date().toISOString(), school: sc(), slots: A.slots };
      T.saveFile(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }), `${sc().name}_시간표_백업_${new Date().toISOString().slice(0, 10)}.json`);
    },
    "clear-cls": (el) => { const v = el.dataset.id || (app.querySelector('[data-f="clr-cls"]') || {}).value; if (v) CLEAR.cls(v); },
    "clear-grade": (el) => { const v = Number(el.dataset.g || (app.querySelector('[data-f="clr-grade"]') || {}).value); if (v) CLEAR.grade(v); },
    "clear-subject": () => CLEAR.subject(),
    "clear-person": (el) => { const v = el.dataset.id || (app.querySelector('[data-f="clr-person"]') || {}).value; if (v) CLEAR.person(v); },
    "next-term": () => {
      const s = sc();
      const m = T.modal({ title: "다음 학기 준비", body: `<form class="stack" id="nt-form">
        <label class="field"><span>새 학년도</span><input name="year" type="number" value="${E(s.year || "")}"></label>
        <label class="field"><span>새 학기</span><input name="term" value="${E(/1학기/.test(s.term || "") ? "2학기" : "1학기")}"></label>
        <label class="check"><input type="checkbox" name="clear" checked><span><b>지금 시간표를 보관하고 새로 시작</b> <span class="hint">(보관한 시간표는 조회 → 보관함에서 볼 수 있고, 관리에서 되돌릴 수 있습니다)</span></span></label>
        <div class="row-end"><button type="button" class="btn ghost" data-close>취소</button><button class="btn primary">준비하기</button></div></form>` });
      const f = m.el.querySelector("#nt-form");
      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        actions.backup();
        const doc = T.clone(sc());
        if (f.clear.checked) doc.archives = [archiveOf(sc(), A.slots), ...(doc.archives || [])].slice(0, 3);
        doc.year = Number(f.year.value) || doc.year; doc.term = f.term.value.trim() || doc.term;
        doc.homeroomOpen = false; doc.finalized = false; doc.updatedAt = new Date().toISOString();
        try {
          await store.saveSchool(A.sid, doc); A.school = doc;
          if (f.clear.checked) { pushTrash("다음 학기 준비", Object.keys(A.slots)); await store.clearSlots(A.sid); A.slots = {}; }
          A.idx = T.buildIndex(doc, A.slots); A.set.draft = null; A.set.dirty = false;
          m.close(); T.toast(`${doc.year}학년도 ${doc.term} 준비를 마쳤습니다. 1단계부터 시작합니다.`); render();
        } catch (err) { T.toast(err.message, "error"); }
      });
    },
    "clear-all": async () => {
      if (!(await T.confirm("입력된 시간표를 모두 지울까요? 되돌릴 수 없습니다.\n(필요하면 먼저 백업 파일을 받아 두세요.)", { ok: "모두 지우기", danger: true }))) return;
      const ti = pushTrash("모든 시간표 지우기", Object.keys(A.slots));
      try { await store.clearSlots(A.sid); A.slots = {}; A.idx = T.buildIndex(sc(), {}); T.toast("모두 지웠습니다.", "info", { label: "되돌리기", fn: () => restoreTrash(ti) }); render(); } catch (e) { T.toast(e.message, "error"); }
    },
  };

  let wasNarrow = narrow(), rzT;
  window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (narrow() !== wasNarrow) { wasNarrow = narrow(); render(); } }, 150); });
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === "z" || e.key === "Z") && A.tab === "edit" && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || "")) { e.preventDefault(); undo(); }
  });
  app.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el || !app.contains(el)) return;
    const fn = actions[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  app.addEventListener("submit", (e) => {
    const f = e.target.closest("[data-form]");
    if (!f) return;
    e.preventDefault();
    if (f.dataset.form === "super") { superLoad(f.code.value); return; }
    if (f.dataset.form === "join") {
      const raw = String(f.sid.value || "").trim();
      if (!raw) { T.toast("학교 이름이나 학교 코드를 넣어 주세요.", "error"); return; }
      (async () => {
        const list = await store.search(raw);
        const sid = T.cleanSid(raw);
        const exact = list.find((x) => x.sid === sid);
        if (exact || (T.validSid(sid) && !list.length)) { go(`/s/${encodeURIComponent(sid)}`); return; }
        if (list.length === 1) { go(`/s/${encodeURIComponent(list[0].sid)}`); return; }
        showResults(list, raw);
        if (!list.length) T.toast("찾는 학교가 없습니다. 학교 코드를 관리자에게 물어보세요.", "error");
      })();
    }
  });
  // 첫 화면 학교 검색 (입력하는 동안 바로)
  let searchT = 0, searchSeq = 0;
  function showResults(list, q) {
    const box = app.querySelector(".search-results");
    if (!box) return;
    if (!q) { box.innerHTML = ""; return; }
    box.innerHTML = list.length
      ? list.map((x) => `<button type="button" class="sr-item" data-act="open" data-sid="${E(x.sid)}"><b>${E(x.name || x.sid)}</b><small>${E(x.sid)}</small></button>`).join("")
      : `<p class="hint sr-none">'${E(q)}'(으)로 찾은 학교가 없습니다. 학교 코드를 정확히 넣거나 관리자에게 물어보세요.</p>`;
  }
  function liveSearch(q) {
    clearTimeout(searchT);
    const my = ++searchSeq;
    if (!String(q).trim()) { showResults([], ""); return; }
    searchT = setTimeout(async () => { const list = await store.search(q); if (my === searchSeq) showResults(list, q.trim()); }, 220);
  }
  const onField = (e) => {
    const el = e.target;
    if (el.dataset.s) {
      let v = el.dataset.bool ? el.checked : el.value;
      if (el.dataset.num) v = Number(v) || 0;
      const d = draft();
      // 학급 수: 바꾼 뒤(change)에만 반영 — 줄일 때 담임이 있으면 확인, 늘리면 담임 자리 자동
      { const m = /^classCounts\.(\d+)$/.exec(el.dataset.s);
        if (m) {
          if (e.type !== "change") return;
          const g = Number(m[1]) + 1, nv = Math.max(0, Math.min(30, v)), old = Number(d.classCounts[g - 1]) || 0;
          if (A.set.shrinkBusy) return; // 확인창이 떠 있는 동안 또 오는 change(포커스 잃음)는 무시
          if (nv < old) { A.set.shrinkBusy = true; shrinkClasses(d, g, nv).then((ok) => { A.set.shrinkBusy = false; if (ok) { d.classCounts[g - 1] = nv; ensureHomerooms(d); markDirty(); } render(); }); return; }
          d.classCounts[g - 1] = nv; ensureHomerooms(d); markDirty(); render(); return;
        } }
      setPath(d, el.dataset.s, v);
      if (el.dataset.s === "level" && e.type === "change") {
        const fresh = T.newSchool(d.name, v);
        d.classCounts = fresh.classCounts;
        if (!(Object.keys(A.slots).length)) { d.subjects = fresh.subjects; d.rooms = fresh.rooms; d.schedules = fresh.schedules; d.gradeSched = fresh.gradeSched || {}; d.periods = fresh.periods; d.schedGen = fresh.schedGen; d.subjGroups = T.defaultSubjGroups(v); d.assign = []; }
        else T.toast("이미 시간표가 있어 과목·시정표는 그대로 두었습니다. 학년 수만 바뀝니다.");
      }
      // 점심 위치·교시 수·쉬는 시간 길이를 바꾸면 그 시정표 시각을 저절로 다시 맞춤
      { const m = /^schedules\.(\d+)\.(lunchAfter|periods|breaks\.\d+\.min)$/.exec(el.dataset.s); if (m && e.type === "change") { const x = d.schedules[Number(m[1])]; if (x) { if (x.lunchAfter >= x.periods) x.lunchAfter = 0; genTimes(x); if (m[2].startsWith("breaks")) render(); } } }
      if (el.dataset.s.endsWith(".role") && e.type === "change") { const i = Number(el.dataset.s.split(".")[1]); if (v !== "homeroom") d.people[i].cls = ""; else { d.people[i].subject = ""; d.people[i].room = ""; } }
      markDirty();
      if (e.type === "change" && (el.dataset.structural || el.dataset.s.startsWith("classCounts"))) render();
      return;
    }
    const on = el.dataset.on;
    if (!on || (e.type === "input" && el.tagName === "SELECT")) return;
    if (on === "act-as" && e.type === "change") { A.ed.actAs = el.value || null; A.ed.forActor = null; render(); }
    if (on === "ed-room") { A.ed.room = el.value; render(); }
    if (on === "ed-join" && e.type === "change") { A.ed.join = el.checked; render(); }
    if (on === "ed-cls" && e.type === "change") { A.ed.cls = el.value; render(); }
    if (on === "ed-subj") { if (el.value === "__new") { el.value = A.ed.subj || ""; openCustom((id) => { A.ed.subj = id; render(); }); return; } A.ed.subj = el.value; A.ed.wroom = T.defaultRoomFor(sc(), actor(), el.value); render(); }
    if (on === "ed-wroom") { A.ed.wroom = el.value; render(); }
    if (on === "my-room" && e.type === "change") setMyRoom(actor(), el.value);
    if (on === "pr-hours") { A.pr.hours = el.checked; render(); }
    if (on === "hro" && e.type === "change") { const d = draft(); d.homeroomOpen = el.value !== "0"; d.finalized = el.value === "2"; markDirty(); }
    if (on === "subj-hours") {
      const d = draft(), x = d.subjects[Number(el.dataset.i)], gs = String(el.dataset.gs || "").split(",").map(Number).filter(Boolean);
      if (x) { const h = Math.max(0, Math.min(12, Number(el.value) || 0)); x.hours = { ...(x.hours || {}) }; gs.forEach((g) => { if (h) x.hours[g] = h; else delete x.hours[g]; }); markDirty(); updHourSums(); }
    }
    if ((on === "subj-asg" || on === "subj-asg-pid" || on === "subj-asg-h") && e.type === "change") {
      const d = draft(), x = d.subjects[Number(el.dataset.i)], gs = String(el.dataset.gs || "").split(",").map(Number).filter(Boolean);
      if (!x) return;
      const mine = (a) => a.s === x.id && gs.includes(a.g);
      if (on === "subj-asg") {
        if (el.checked) {
          const p0 = (d.people.find((p) => p.role !== "homeroom" && p.subject === x.id) || {}).id || "";
          gs.forEach((g) => { if (!d.assign.some((a) => a.s === x.id && a.g === g)) d.assign.push({ id: T.uid("a"), g, s: x.id, pid: p0, h: Number((x.hours || {})[g]) || 2 }); });
        } else d.assign = d.assign.filter((a) => !mine(a));
      } else if (on === "subj-asg-pid") {
        d.assign.forEach((a) => { if (mine(a)) a.pid = el.value; });
        const p = T.person(d, el.value);
        if (p && !p.subject) p.subject = x.id; // 담당 과목이 비어 있으면 함께 채움
      } else {
        const h = Math.max(0, Math.min(10, Number(el.value) || 0));
        d.assign.forEach((a) => { if (mine(a)) a.h = h; });
      }
      markDirty();
      if (on !== "subj-asg-h") render();
    }
    if (on === "person-title" && e.type === "change") {
      const d = draft(), p = d.people[Number(el.dataset.i)], t = T.posList(d).find((x) => x.id === el.value);
      if (p && t) {
        if (t.role !== p.role) { if (t.role === "homeroom") { p.subject = ""; p.room = ""; } else p.cls = ""; }
        p.role = t.role; p.title = t.id; markDirty(); render();
      }
    }
    if (on === "restore" && e.type === "change" && el.files[0]) restore(el.files[0]);
    if (on === "sched-xlsx" && e.type === "change" && el.files[0]) { const f = el.files[0]; el.value = ""; importSchedXlsx(f); }
  };
  app.addEventListener("input", (e) => {
    if (e.target.dataset.on === "school-q") { liveSearch(e.target.value); return; }
    if (e.target.dataset.on === "subj-hours") { onField(e); return; }
    if (e.target.dataset.s && e.target.tagName !== "SELECT" && e.target.type !== "checkbox") onField(e);
  });
  app.addEventListener("change", onField);

  /* ───────── 시작 ───────── */
  (async () => {
    app.innerHTML = `<div class="loading">불러오는 중…</div>`;
    try { store = await T.pickStore(); T.store = store; await store.init(); }
    catch (e) {
      app.innerHTML = `<div class="wrap main"><div class="panel narrow"><h2 class="h2">연결하지 못했습니다</h2><p class="muted">${E(e.message || e)}</p>
        <div class="btn-row"><button class="btn primary" onclick="location.reload()">다시 시도</button></div></div></div>`;
      return;
    }
    document.title = cfg.SITE_NAME || "함께 짜는 시간표";
    route();
    if (store.mode === "cloud" && store.info && store.info.version && store.info.version !== T.VERSION) A.newVersion = store.info.version, render();
  })();
})();

</script>
</body>
</html>

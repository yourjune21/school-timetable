      this.mode = "demo";
      this.key = "tt-demo-v1";
      this.gkey = "tt-demo-grants-v1";
      this.subs = new Set();
      this.mem = null;
      window.addEventListener("storage", (e) => { if (e.key === this.key) { this.mem = null; this.emit(); } });
    }
    async init() {}
    read() {
      if (this.mem) return this.mem;
      let d = null;
      try { d = JSON.parse(localStorage.getItem(this.key) || "null"); } catch (e) {}
      if (!d || !d.schools) d = { schools: {} };
      this.mem = d;
      return d;
    }
    write() { try { localStorage.setItem(this.key, JSON.stringify(this.mem)); } catch (e) {} this.emit(); }
    grants() { try { const v = localStorage.getItem(this.gkey); if (v) return JSON.parse(v); } catch (e) {} return T.clone(this.gmem || {}); }
    setGrants(g) { this.gmem = T.clone(g); try { localStorage.setItem(this.gkey, JSON.stringify(g)); } catch (e) {} }
    box(sid) { return this.read().schools[sid] || null; }
    async ensureExample() {
      if (this.box(T.EXAMPLE_ID)) return;
      const { school, slots } = T.exampleSchool();
      const locks = { [ADMIN]: await T.codeHash(T.EXAMPLE_ID, ADMIN, T.EXAMPLE_CODES.admin) };
      const codes = {};
      for (const p of school.people) {
        locks[p.id] = await T.codeHash(T.EXAMPLE_ID, p.id, T.EXAMPLE_CODES.teacher);
        codes[p.id] = T.EXAMPLE_CODES.teacher;
      }
      this.read().schools[T.EXAMPLE_ID] = { doc: school, slots, locks, codes };
      this.write();
    }
    async search(q) {
      const n = (v) => String(v || "").toLowerCase().replace(/[\s·.\-_()]/g, "");
      const k = n(q);
      if (!k) return [];
      await this.ensureExample();
      return Object.entries(this.read().schools).filter(([sid, b]) => b.doc && b.doc.listed !== false && (n(b.doc.name) + " " + sid).includes(k))
        .map(([sid, b]) => ({ sid, name: b.doc.name })).slice(0, 10);
    }
    async resetExample() { delete this.read().schools[T.EXAMPLE_ID]; const g = this.grants(); delete g[T.EXAMPLE_ID]; this.setGrants(g); await this.ensureExample(); }
    async getSchool(sid) { if (sid === T.EXAMPLE_ID) await this.ensureExample(); const b = this.box(sid); return b ? T.clone(b.doc) : null; }
    watch(sid, cb) {
      const fn = () => { const b = this.box(sid); cb({ school: b ? T.clone(b.doc) : null, slots: b ? T.clone(b.slots) : {} }); };
      this.subs.add(fn);
      setTimeout(fn, 0);
      return () => this.subs.delete(fn);
    }
    emit() { this.subs.forEach((fn) => fn()); }
    can(sid, pid) {
      const b = this.box(sid); const g = this.grants()[sid] || {};
      return !!(b && b.locks[pid] && g[pid] === b.locks[pid]);
    }
    need(sid, pid) { if (!(this.can(sid, pid) || this.can(sid, ADMIN))) throw new Denied(); }
    async createSchool(sid, doc, adminCode, superCode) {
      this.superOk(superCode);
      if (this.box(sid)) throw Object.assign(new Error("이미 있는 학교 코드입니다."), { code: "exists" });
      const h = await T.codeHash(sid, ADMIN, adminCode);
      this.read().schools[sid] = { doc, slots: {}, locks: { [ADMIN]: h }, codes: {}, adminCode: T.cleanCode(adminCode) };
      this.write();
      await this.login(sid, ADMIN, adminCode);
    }
    // 최고관리자 (체험판 코드: T.EXAMPLE_CODES.super)
    superOk(code) { if (T.cleanCode(code) !== T.EXAMPLE_CODES.super) throw Object.assign(new Error("최고관리자 코드가 맞지 않습니다."), { code: "super" }); }
    async superSchools(code) { this.superOk(code); await this.ensureExample(); return Object.entries(this.read().schools).map(([sid, b]) => ({ sid, name: b.doc.name || sid, listed: b.doc.listed !== false ? 1 : 0, at: 0 })); }
    async superAdminCode(code, sid, newCode) {
      this.superOk(code);
      const b = this.box(sid); if (!b) throw new Error("없는 학교입니다.");
      if (T.cleanCode(newCode).length < 6) throw new Error("학교관리자 코드는 영문·숫자 6자 이상입니다.");
      b.locks[ADMIN] = await T.codeHash(sid, ADMIN, newCode); b.adminCode = T.cleanCode(newCode); this.write();
    }
    async login(sid, pid, code) {
      const b = this.box(sid);
      const h = await T.codeHash(sid, pid, code);
      if (!b || !b.locks[pid] || b.locks[pid] !== h) return false;
      const g = this.grants(); (g[sid] = g[sid] || {})[pid] = h; this.setGrants(g);
      return true;
    }
    async logout(sid, pid) { const g = this.grants(); if (g[sid]) delete g[sid][pid]; this.setGrants(g); }
    async check(sid, pid) { return this.can(sid, pid); }
    async saveSchool(sid, doc) { this.need(sid, ADMIN); this.box(sid).doc = T.clone(doc); this.write(); }
    async saveSlots(sid, pid, e) { this.need(sid, pid); const b = this.box(sid); b.slots[pid] = { e: T.clone(e), at: Date.now() }; this.write(); }
    async setCode(sid, pid, code) {
      this.need(sid, ADMIN);
      const b = this.box(sid);
      b.locks[pid] = await T.codeHash(sid, pid, code);
      if (pid !== ADMIN) b.codes[pid] = T.cleanCode(code); else b.adminCode = T.cleanCode(code);
      this.write();
    }
    async getCodes(sid) { this.need(sid, ADMIN); const b = this.box(sid); this.adminCodes = { ...(this.adminCodes || {}), [sid]: b.adminCode || (sid === T.EXAMPLE_ID ? T.EXAMPLE_CODES.admin : "") }; return T.clone(b.codes || {}); }
    adminCode(sid) { return (this.adminCodes || {})[sid] || ""; }
    async superEnter(code, sid) { this.superOk(code); const b = this.box(sid); if (!b) throw new Error("없는 학교입니다."); const g = this.grants(); (g[sid] = g[sid] || {})[ADMIN] = b.locks[ADMIN]; this.setGrants(g); }
    async removePerson(sid, pid) {
      this.need(sid, ADMIN);
      const b = this.box(sid);
      delete b.locks[pid]; delete b.codes[pid]; delete b.slots[pid];
      this.write();
    }
    async clearSlots(sid, pids) {
      this.need(sid, ADMIN);
      const b = this.box(sid);
      (pids || Object.keys(b.slots)).forEach((p) => delete b.slots[p]);
      this.write();
    }
    async setPersonRoom(sid, pid, room) {
      this.need(sid, pid);
      const p = (this.box(sid).doc.people || []).find((x) => x.id === pid);
      if (p) { p.room = room || ""; this.write(); }
    }
    async putAllSlots(sid, slots) {
      this.need(sid, ADMIN);
      this.box(sid).slots = T.clone(slots);
      this.write();
    }
  }

  /* ───────── Cloudflare (Worker + Durable Object) ─────────
     인증코드는 서버가 확인하고, 맞으면 이 기기에 '입장권(token)'을 줍니다.
     입장권은 이 브라우저에만 보관하며, 코드가 바뀌면 서버에서 바로 무효가 됩니다. */
  class CloudStore {
    constructor(base, info) {
      this.mode = "cloud";
      this.base = base;
      this.info = info || {};
    }
    async init() {}
    tkKey(sid) { return `tt-tok-${sid}`; }
    tokens(sid) { try { return JSON.parse(localStorage.getItem(this.tkKey(sid)) || "{}"); } catch (e) { return (this.tmem && this.tmem[sid]) || {}; } }
    setToken(sid, pid, token) {
      const t = this.tokens(sid);
      if (token) t[pid] = token; else delete t[pid];
      (this.tmem = this.tmem || {})[sid] = t;
      try { localStorage.setItem(this.tkKey(sid), JSON.stringify(t)); } catch (e) {}
    }
    async api(sid, method, path, body) {
      let r;
      try {
        r = await fetch(`${this.base}/api/s/${encodeURIComponent(sid)}${path}`, {
          method,
          headers: { "content-type": "application/json", "x-tt-tokens": Object.values(this.tokens(sid)).join(" ") },
          body: body === undefined ? undefined : JSON.stringify(body),
          cache: "no-store",
        });
      } catch (e) { throw new Error("서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요."); }
      let j = {};
      try { j = await r.json(); } catch (e) {}
      if (r.ok) return j;
      if (r.status === 403 && j.error === "denied") throw new Denied(j.message);
      throw Object.assign(new Error(j.message || `서버 오류 (${r.status})`), { code: j.error, status: r.status });
    }
    async getSchool(sid) { return (await this.api(sid, "GET", "/state")).school; }
    async search(q) {
      try { const r = await fetch(`${this.base}/api/search?q=${encodeURIComponent(q)}`, { cache: "no-store" }); const j = await r.json(); return j.results || []; }
      catch (e) { return []; }
    }
    // 서버에 올라 있는 버전 (새로 배포됐는지 확인)
    async serverVersion() {
      try { const r = await fetch(`${this.base}/api/health`, { cache: "no-store" }); const j = await r.json(); if (j && j.version) this.info.version = j.version; return j.version || null; }
      catch (e) { return null; }
    }
    watch(sid, cb) {
      let closed = false, ws = null, retry = 0, pingT = null, reT = null;
      const st = { school: undefined, slots: {} };
      const emit = () => cb({ school: st.school, slots: T.clone(st.slots) });
      const load = async () => {
        try { const j = await this.api(sid, "GET", "/state"); if (closed) return; st.school = j.school; st.slots = j.slots || {}; emit(); }
        catch (e) { if (!closed && st.school === undefined) cb({ error: e }); }
      };
      const wsUrl = (this.base ? this.base.replace(/^http/, "ws") : `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`) + `/api/s/${encodeURIComponent(sid)}/ws`;
      const connect = () => {
        if (closed) return;
        clearTimeout(reT);
        try { ws = new WebSocket(wsUrl); } catch (e) { ws = null; return again(); }
        ws.onopen = () => { if (retry) load(); retry = 0; };
        ws.onmessage = (ev) => {
          if (ev.data === "pong") return;
          let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
          if (m.t === "school") st.school = m.school;
          else if (m.t === "slots") { if (m.e) st.slots[m.pid] = { e: m.e, at: m.at }; else delete st.slots[m.pid]; }
          else if (m.t === "all") st.slots = m.slots || {};
          else return;
          if (st.school !== undefined) emit();
        };
        ws.onclose = () => { ws = null; again(); };
        ws.onerror = () => {};
      };
      const again = () => {
        if (closed) return;
        retry++;
        if (retry >= 2) load(); // 연결이 끊긴 동안 바뀐 것은 다시 받아 옴
        reT = setTimeout(connect, Math.min(30000, 1000 * 2 ** Math.min(retry, 5)));
      };
      const onVis = () => { if (document.visibilityState === "visible" && !closed) { load(); if (!ws) connect(); } };
      document.addEventListener("visibilitychange", onVis);
      pingT = setInterval(() => { try { ws && ws.readyState === 1 && ws.send("ping"); } catch (e) {} }, 25000);
      load();
      connect();
      return () => { closed = true; clearInterval(pingT); clearTimeout(reT); document.removeEventListener("visibilitychange", onVis); try { ws && ws.close(); } catch (e) {} };
    }
    async superApi(path, body) {
      const r = await fetch(`${this.base}/api/super/${path}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(j.message || `서버 오류 (${r.status})`), { code: j.error, status: r.status });
      return j;
    }
    async superSchools(code) { return (await this.superApi("schools", { code: T.cleanCode(code) })).schools || []; }
    async superAdminCode(code, sid, newCode) { await this.superApi("admin-code", { code: T.cleanCode(code), sid, newCode: T.cleanCode(newCode) }); }
    async createSchool(sid, doc, adminCode, superCode) {
      const j = await this.api(sid, "POST", "/create", { doc, adminCode: T.cleanCode(adminCode), superCode: T.cleanCode(superCode) });
      this.setToken(sid, ADMIN, j.token);
    }
    async login(sid, pid, code) {
      const j = await this.api(sid, "POST", "/login", { pid, code: T.cleanCode(code) });
      if (!j.ok) return false;
      this.setToken(sid, pid, j.token);
      return true;
    }
    async logout(sid, pid) {
      const tok = this.tokens(sid)[pid];
      this.setToken(sid, pid, null);
      if (tok) { try { await this.api(sid, "POST", "/logout", { token: tok }); } catch (e) {} }
    }
    async check(sid, pid) {
      if (!this.tokens(sid)[pid]) return false;
      try {
        const now = Date.now();
        if (!this.ck || this.ck.sid !== sid || now - this.ck.at > 3000) this.ck = { sid, at: now, p: this.api(sid, "GET", "/check") };
        const ok = (await this.ck.p).pids.includes(pid);
        if (!ok) this.setToken(sid, pid, null);
        return ok;
      } catch (e) { return true; } // 연결 문제면 일단 그대로 두고, 저장할 때 다시 확인
    }
    async saveSchool(sid, doc) { await this.api(sid, "PUT", "/school", { doc }); }
    async saveSlots(sid, pid, e) { await this.api(sid, "PUT", `/slots/${encodeURIComponent(pid)}`, { e }); }
    async setCode(sid, pid, code) {
      const j = await this.api(sid, "POST", "/code", { pid, code: T.cleanCode(code) });
      if (pid === ADMIN && j.token) this.setToken(sid, ADMIN, j.token);
    }
    async getCodes(sid) { const j = await this.api(sid, "GET", "/codes"); this.adminCodes = { ...(this.adminCodes || {}), [sid]: j.admin || "" }; return j.codes || {}; }
    adminCode(sid) { return (this.adminCodes || {})[sid] || ""; }
    async superEnter(code, sid) { const j = await this.superApi("enter", { code: T.cleanCode(code), sid }); this.setToken(sid, ADMIN, j.token); }
    async removePerson(sid, pid) { await this.api(sid, "POST", "/remove", { pid }); }
    async clearSlots(sid, pids) { await this.api(sid, "POST", "/clear", pids ? { pids } : {}); }
    async putAllSlots(sid, slots) { await this.api(sid, "PUT", "/all-slots", { slots }); }
    async setPersonRoom(sid, pid, room) { await this.api(sid, "POST", "/me-room", { pid, room: room || "" }); }
  }

  // 어떤 저장소를 쓸지: SERVER true = 서버 필수, false = 체험 모드, "auto" = 서버가 있으면 서버
  T.pickStore = async () => {
    const cfg = window.TT_CONFIG || {};
    const q = new URLSearchParams(location.search);
    if (cfg.SERVER === false || q.has("demo")) return new DemoStore();
    const base = String(cfg.API_BASE || "").replace(/\/+$/, "");
    if (!base && !/^https?:$/.test(location.protocol)) {
      if (cfg.SERVER === true) throw new Error("index.html을 파일로 열었습니다. 배포한 주소(https://…)로 들어오세요.");
      return new DemoStore();
    }
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 6000);
      const r = await fetch(`${base}/api/health`, { cache: "no-store", signal: ctl.signal });
      clearTimeout(t);
      const j = await r.json();
      if (j && j.app === "tt") return new CloudStore(base, j);
    } catch (e) {}
    if (cfg.SERVER === true) throw new Error("시간표 서버에 연결하지 못했습니다. 잠시 뒤 새로고침해 주세요.");
    return new DemoStore();
  };
})();

</script>
<script>
/* 시간표 그리기: 주간 표(학급·사람·장소), 한눈에 보기 표, 출력용 종이 */
(function () {
  const T = (window.TT = window.TT || {});
  const E = T.esc;

  // 한 칸 기본 내용 (조회·출력)
  // 사람 시간표: 시정마다 시각이 다른 교시면 "5·6학년 기준 11:30~12:10"
  T.schedNote = (sc, it, scheds) => {
    if (!it || !it.cls || !T.periodVaries(scheds, it.p)) return "";
    const x = T.schedOfClass(sc, it.cls), t = T.timeAt(sc, it.cls, it.p);
    return `${x.name || T.gradesLabel(T.schedGrades(sc, x))} 기준${t && t.s ? ` ${t.s}~${t.e}` : ""}`;
  };
  // 좁은 칸(입력 화면)에서는 시각 부분을 숨길 수 있게 나눠서 그림
  T.schedNoteHTML = (sc, it, scheds) => {
    const n = T.schedNote(sc, it, scheds);
    if (!n) return "";
    const m = /^(.*?기준)(.*)$/.exec(n);
    return `<small class="sg"><i>${E(m ? m[1] : n)}</i>${m && m[2] ? `<span>${E(m[2])}</span>` : ""}</small>`;
  };
  T.cellContent = (sc, kind, id, items, ctx = {}) => {
    if (!items.length) return { html: "", cls: "" };
    const units = kind === "person"
      ? [...new Map(items.map((it) => [it.b ? "b" + it.b : it.k, it])).values()].map((m) => ({ main: m, joins: [], block: m.b }))
      : kind === "class" ? T.units(items) : T.units(items);
    const pScheds = kind === "person" ? ctx.scheds || T.usedScheds(sc) : null;
    // 같은 교시라도 시정이 달라 시각이 안 겹치면 (예: 5·6학년 4교시 11:30, 3·4학년 4교시 12:10) 나눠서 보여 줌
    if (kind === "person" && units.length > 1) {
      const sps = units.map((u) => T.span(sc, u.main.cls, u.main.p));
      const clash = sps.some((a, i) => sps.some((b, j) => j > i && T.overlap(a, b)));
      if (!clash) {
        const order = units.map((u, i) => [u, sps[i]]).sort((a, b) => (a[1].s || 0) - (b[1].s || 0));
        return { cls: "split", html: order.map(([u]) => {
          const it = u.main;
          const what = it.b ? T.blockName(sc, it.b) : T.subjectShort(sc, it.s);
          const note = T.schedNoteHTML(sc, it, pScheds) || (() => { const t = T.timeAt(sc, it.cls, it.p); return t ? `<small class="sg"><span>${E(t.s)}~${E(t.e)}</span></small>` : ""; })();
          return `<div class="half" style="${T.colorVars(T.itemColor(sc, it))}"><b>${E(T.clsLabel(it.cls))} ${E(what)}</b>${note}</div>`;
        }).join("") };
      }
    }
    if (units.length > 1 && !(kind === "room" && !String(id).startsWith("hr:") && T.room(sc, id)?.multi)) {
      const lines = units.map((u) => {
        const it = u.main;
        const what = it.b ? T.blockName(sc, it.b) : T.subjectShort(sc, it.s);
        return kind === "class" ? `${what}·${T.personName(sc, it.pid)}` : `${T.clsLabel(it.cls)} ${what}`;
      });
      return { html: `<b>겹침</b>${lines.map((l) => `<small>${E(l)}</small>`).join("")}`, cls: "conflict" };
    }
    const u = units[0], it = u.main;
    const style = T.colorVars(T.itemColor(sc, it));
    const subj = T.subjectShort(sc, it.s);
    const time = () => "";
    let main = "", subs = [];
    if (u.block) {
      const bk = (sc.blocks || []).find((x) => x.id === u.block) || {};
      if (kind === "class") { main = bk.name || "묶음"; subs.push(`${(bk.members || []).length}명 · ${subj}`); }
      else if (kind === "person") { main = bk.name || "묶음"; subs.push(it.r ? T.roomName(sc, it.r) : `${(bk.classes || []).join(",")} 교실`); subs.push(time()); }
      else { main = bk.name || "묶음"; subs.push(items.filter((x) => x.b === u.block).map((x) => T.personName(sc, x.pid)).filter((v, i, a) => a.indexOf(v) === i).join(",")); }
    } else if (kind === "class") {
      main = subj;
      var tag = T.roleTag(sc, it.pid);
      const hr = T.homeroomOf(sc, id);
      const names = [it, ...u.joins].map((x) => x.pid).filter((pid, i, arr) => arr.indexOf(pid) === i);
      const shown = names.filter((pid) => !hr || pid !== hr.id || names.length > 1).map((pid) => T.personName(sc, pid));
      if (shown.length) subs.push(shown.join("+"));
      if (it.r) subs.push(T.roomName(sc, it.r));
    } else if (kind === "person" && (T.person(sc, id) || {}).role === "homeroom" && (T.person(sc, id) || {}).cls === it.cls) {
      // 담임의 자기 반 수업: 학급 이름 대신 과목을 크게
      main = subj;
      if (it.j) subs.push("협력");
      if (it.r) subs.push(T.roomName(sc, it.r));
    } else if (kind === "person") {
      main = T.clsLabel(it.cls);
      subs.push(subj + (it.j ? " (협력)" : "") + (it.r ? ` · ${T.roomName(sc, it.r)}` : ""));
      subs.push(time());
    } else {
      main = T.clsLabel(it.cls);
      subs.push(`${subj} · ${[it, ...u.joins].map((x) => T.personName(sc, x.pid)).join("+")}`);
    }
    subs = subs.filter(Boolean);
    const tg = typeof tag !== "undefined" && tag ? `<i class="tag">${E(tag)}</i>` : "";
    return { html: `<b>${E(main)}${tg}</b>${subs.map((x) => `<small>${E(x)}</small>`).join("")}`, cls: u.joins.length ? "co" : "", style };
  };

  /* 주간 표. opts.cell(d,p) → {html, cls, style, attrs} 로 칸을 바꿀 수 있음 (입력 화면) */
  T.gridHTML = (sc, idx, kind, id, opts = {}) => {
    const sch = T.gridSched(sc, kind, id);
    const days = opts.day ? [opts.day] : T.dayList(sc); // 휴대폰: 요일 하나
    const periods = Array.from({ length: sch.periods || 6 }, (_, i) => i + 1);
    const lunch = Number(sch.lunchAfter) || 0;
    const head = `<thead><tr><th class="g-corner">교시</th>${days.map((d) => `<th>${T.DAYS[d]}</th>`).join("")}</tr></thead>`;
    const clsId = kind === "class" ? id : kind === "room" && String(id).startsWith("hr:") ? id.slice(3) : null;
    // 사람·특별실 표: 그 사람이 들어가는 학년 시정으로 교시 시각 (시정마다 다르면 줄마다 학년 표시)
    const scheds = kind === "person" ? T.personScheds(sc, idx, id) : kind === "room" && !clsId ? T.usedScheds(sc) : null;
    // 같은 교시라도 학년마다 시각이 다르면 (예: 4교시 5·6학년 11:30, 1~4학년 12:10) 그 교시를 두 줄로, 시간 순서대로
    const trows = scheds && opts.times !== false ? T.timeRows(sc, scheds, periods.length) : null;
    const rowList = trows || periods.map((p) => ({ p, t: null }));
    const headOf = (r) => {
      if (opts.times === false) return "";
      if (trows) return r.s ? `<small${r.label ? ' class="pt"' : ""}>${r.label ? `<i>${E(r.label)}</i>` : ""}${E(r.s)}~${E(r.e)}</small>` : "";
      if (!scheds) { const t = (sch.times || [])[r.p - 1]; return t && t.s ? `<small>${E(t.s)}~${E(t.e)}</small>` : ""; }
      const h = T.periodHead(sc, scheds, r.p)[0];
      return h ? `<small>${E(h.s)}~${E(h.e)}</small>` : "";
    };
    const rows = rowList.map((r) => {
      const p = r.p;
      const cells = days.map((d) => {
        const c = opts.cell ? opts.cell(d, p, r) : T.cellContent(sc, kind, id, T.rowItems(sc, T.cellItems(idx, kind, id, d, p), r), { scheds });
        const inner = c.html || c.cls ? `<div class="cell ${c.cls || ""}" style="${c.style || ""}">${c.html || ""}</div>` : "";
        const by = clsId && T.beyond(sc, clsId, d, p) ? ' class="beyond" title="이 요일은 이 교시가 없습니다"' : "";
        return `<td${by} ${c.attrs || ""}${r.t != null ? ` data-t="${r.t}"` : ""}>${inner}</td>`;
      }).join("");
      const row = `<tr${r.t != null ? ' class="g-split"' : ""}><th class="g-p"><b>${p}</b>${headOf(r)}</th>${cells}</tr>`;
      const lunchRow = !trows && lunch && p === lunch && p < periods.length
        ? `<tr class="g-lunch"><th>점심</th><td colspan="${days.length}">점심시간${(() => { const t = T.lunchTime(sch); return t ? ` ${E(t.s)}~${E(t.e)}` : ""; })()}</td></tr>` : "";
      // 중간놀이 등 (학급 표)
      const brkRows = !trows && p < periods.length ? (sch.breaks || []).filter((b) => Number(b.after) === p).map((b) => `<tr class="g-brk"><th>${E(b.name)}</th><td colspan="${days.length}">${E(b.name)}${b.s && b.e ? ` ${E(b.s)}~${E(b.e)}` : ""}</td></tr>`).join("") : "";
      return row + (Number(lunch) === p && brkRows ? lunchRow + brkRows : brkRows + lunchRow);
    }).join("");
    return `<table class="g${trows ? " g-wide" : ""}${opts.day ? " g-one" : ""}${opts.compact ? " g-compact" : ""} g-k-${kind}">${head}<tbody>${rows}</tbody></table>`;
  };

  // 학급별·선생님별 색일 때 범례
  T.colorLegendHTML = (sc, idx, kind, id) => {
    if (T.colorBy !== "class" && T.colorBy !== "person") return "";
    const seen = new Map();
    T.dayList(sc).forEach((d) => T.periodList(sc).forEach((p) => T.cellItems(idx, kind, id, d, p).forEach((it) => {
      const k = T.colorBy === "class" ? it.cls : it.pid;
      if (k && !seen.has(k)) seen.set(k, it);
    })));
    if (seen.size < 2) return "";
    const lab = (k) => (T.colorBy === "class" ? k : T.personName(sc, k));
    return `<div class="hours legend">${[...seen.entries()].map(([k, it]) => `<span style="${T.colorVars(T.itemColor(sc, it))}"><i></i>${E(lab(k))}</span>`).join("")}</div>`;
  };
  /* 교담 없는 시간 찾기: 고른 학년(여러 개도)의 모든 반이 담임 수업(또는 빈 칸)인 시간 */
  T.freeSlots = (sc, idx, gs) => {
    gs = [].concat(gs);
    const cls = gs.flatMap((g) => T.classesOfGrade(sc, g).map((c) => c.id));
    const maxP = Math.max(0, ...gs.map((g) => T.schedOfGrade(sc, g).periods));
    const out = {};
    T.dayList(sc).forEach((d) => { for (let p = 1; p <= maxP; p++) {
      const live = cls.filter((c) => p <= T.periodsOf(sc, c) && !T.beyond(sc, c, d, p));
      if (!live.length) { out[d + "|" + p] = { off: true }; continue; }
      const busy = [];
      live.forEach((c) => T.cellItems(idx, "class", c, d, p).forEach((it) => { const pr = T.person(sc, it.pid); if (it.b || (pr && pr.role !== "homeroom")) busy.push({ c, it }); }));
      const offGs = gs.filter((g) => !live.some((c) => T.gradeOf(c) === g));
      out[d + "|" + p] = { free: !busy.length, busy, n: live.length, offGs };
    } });
    return out;
  };
  T.freeGridHTML = (sc, idx, gs) => {
    gs = [].concat(gs);
    const f = T.freeSlots(sc, idx, gs), days = T.dayList(sc), multi = gs.length > 1;
    const scheds = [...new Set(gs.map((g) => T.schedOfGrade(sc, g)))];
    const maxP = Math.max(0, ...scheds.map((x) => x.periods));
    const nFree = Object.values(f).filter((x) => x.free).length;
    const glab = (g) => T.gradeName(g).replace(/학년$/, "");
    const clsLab = (c) => (multi ? T.clsLabel(c) : T.clsLabel(c).replace(/^\d+-/, "") + (T.clsLabel(c) === c ? "반" : ""));
    const rows = Array.from({ length: maxP }, (_, k) => k + 1).map((p) => {
      const hs = T.periodHead(sc, scheds, p);
      return `<tr><th class="g-p"><b>${p}</b>${hs.map((h) => `<small>${h.label ? E(h.label.replace("학년", "")) + " " : ""}${E(h.s)}~${E(h.e)}</small>`).join("")}</th>${days.map((d) => {
        const x = f[d + "|" + p];
        if (!x || x.off) return `<td class="beyond"></td>`;
        const offNote = x.offGs && x.offGs.length ? `<small class="free-off">${E(x.offGs.map(glab).join("·"))}학년 수업 없음</small>` : "";
        if (x.free) return `<td class="free-ok"><div class="cell"><b>✓ 행사 가능</b><small>${x.n}개 반 모두 담임</small>${offNote}</div></td>`;
        const by = {}; x.busy.forEach(({ c, it }) => { const k = it.b ? T.blockName(sc, it.b) : T.subjectShort(sc, it.s); (by[k] = by[k] || []).push(clsLab(c)); });
        return `<td class="free-no"><div class="cell">${Object.entries(by).map(([k, v]) => `<small><b>${E(k)}</b> ${E([...new Set(v)].join("·"))}</small>`).join("")}${offNote}</div></td>`;
      }).join("")}</tr>`;
    }).join("");
    const name = gs.map(glab).join("·") + "학년";
    return `<div class="free-sum">${E(name)} ${multi ? "모두 " : ""}· 행사 가능 <b>${nFree}</b>칸</div><table class="g free-g"><thead><tr><th class="g-corner">교시</th>${days.map((d) => `<th>${T.DAYS[d]}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
  };
  T.hoursHTML = (sc, idx, kind, id) => {
    const h = T.hoursBy(idx, kind, id);
    if (!h.total) return "";
    const order = (sc.subjects || []).map((s) => s.id);
    const ids = Object.keys(h.by).sort((a, b) => order.indexOf(a) - order.indexOf(b));
    return `<div class="hours"><span style="background:transparent;padding-left:0">주 <b>${h.total}</b>시간</span>${ids
      .map((s) => `<span style="${T.colorVars(T.subjectColor(sc, s))}"><i></i>${E(T.subjectShort(sc, s))} <b>${h.by[s]}</b></span>`).join("")}</div>`;
  };

  T.titleOf = (sc, kind, id) => {
    if (kind === "class") return T.className(id);
    if (kind === "person") return `${T.personName(sc, id)} 선생님`;
    return T.roomName(sc, id);
  };
  T.subtitleOf = (sc, kind, id) => {
    if (kind === "class") { const hr = T.homeroomOf(sc, id); return hr ? `담임 ${T.personName(sc, hr.id)}` : ""; }
    if (kind === "person") return T.personDesc(sc, id);
    const r = id.startsWith("hr:") ? null : T.room(sc, id);
    return r ? (r.multi ? "특별실 · 여러 학급 함께 사용" : "특별실") : "학급 교실";
  };

  /* 한눈에 보기: 줄 = 학급/사람/장소, 칸 = 요일×교시 */
  T.matrixRows = (sc, kind, filter = {}) => {
    if (kind === "class") {
      return T.classList(sc).filter((c) => !filter.grade || c.g === filter.grade).map((c) => ({ id: c.id, label: T.clsLabel(c.id), sub: T.homeroomOf(sc, c.id) ? T.personName(sc, T.homeroomOf(sc, c.id).id) : "", group: c.g }));
    }
    if (kind === "person") {
      return T.peopleSorted(sc).filter((p) => !filter.roles || filter.roles.includes(p.role))
        .map((p) => ({ id: p.id, label: T.personName(sc, p.id), sub: p.role === "homeroom" ? p.cls || "" : T.posOf(sc, p).short || T.posOf(sc, p).name, group: p.role }));
    }
    return T.roomList(sc).filter((r) => (filter.special === undefined ? true : r.special === filter.special))
      .map((r) => ({ id: r.id, label: r.name, sub: "", group: r.special ? "s" : "h" }));
  };
  T.matrixHTML = (sc, idx, kind, rows, opts = {}) => {
    const days = T.dayList(sc), periods = T.periodList(sc);
    const head1 = `<tr><th rowspan="2" style="width:var(--mx-lw,92px)">${kind === "class" ? "학급" : kind === "person" ? "선생님" : "장소"}</th>${days
      .map((d) => `<th class="mx-day" colspan="${periods.length}">${T.DAYS[d]}</th>`).join("")}</tr>`;
    const head2 = `<tr>${days.map(() => periods.map((p, i) => `<th class="${i === 0 ? "mx-day" : ""}">${p}</th>`).join("")).join("")}</tr>`;
    let prev = null;
    const body = rows.map((r) => {
      const sep = prev !== null && r.group !== prev ? "gsep" : "";
      prev = r.group;
      const tds = days.map((d) => periods.map((p, i) => {
        const c1 = i === 0 ? "d1" : "";
        if (kind === "class" && T.beyond(sc, r.id, d, p) && !T.cellItems(idx, kind, r.id, d, p).length) return `<td class="${c1} na"></td>`;
        const items = T.cellItems(idx, kind, r.id, d, p);
        if (!items.length) return `<td class="${c1}"></td>`;
        const units = kind === "person" ? [...new Map(items.map((it) => [it.b ? "b" + it.b : it.k, it])).values()] : T.units(items).map((u) => u.main);
        const multiOk = kind === "room" && !r.id.startsWith("hr:") && T.room(sc, r.id)?.multi;
        if (units.length > 1 && !multiOk) return `<td class="${c1} x" title="겹침">!</td>`;
        const it = units[0];
        const style = T.colorVars(T.itemColor(sc, it));
        const bname = it.b ? T.blockName(sc, it.b) : "";
        let txt = "", sub = "";
        if (kind === "class") { txt = it.b ? bname.replace(/^\d학년\s*/, "") : T.subjectShort(sc, it.s); }
        else if (kind === "person") { txt = it.b ? bname.replace(/^\d학년\s*/, "") : it.cls; sub = opts.compact || it.b ? "" : T.subjectShort(sc, it.s); }
        else { txt = it.b ? bname.replace(/^\d학년\s*/, "") : units.length > 1 ? units.map((x) => T.clsLabel(x.cls)).join(",") : T.clsLabel(it.cls); }
        const co = items.some((x) => x.j);
        return `<td class="${c1} f" style="${style}" title="${E(`${it.cls} ${it.b ? bname : T.subjectName(sc, it.s)} · ${T.personName(sc, it.pid)}`)}">${E(txt.length > 3 && kind !== "person" ? txt.slice(0, 3) : txt)}${co ? "⁺" : ""}${sub ? `<small>${E(sub.slice(0, 3))}</small>` : ""}</td>`;
      }).join("")).join("");
      return `<tr class="${sep}"><th title="${E(r.label)}">${E(r.label)}${r.sub && opts.showSub !== false ? ` <small>${E(r.sub)}</small>` : ""}</th>${tds}</tr>`;
    }).join("");
    return `<table class="mx"><thead>${head1}${head2}</thead><tbody>${body}</tbody></table>`;
  };

  /* ───── 출력용 종이 ───── */
  T.PAPER = { landscape: { w: 1123, h: 794, label: "A4 가로", mm: [297, 210] }, portrait: { w: 794, h: 1123, label: "A4 세로", mm: [210, 297] } };
  T.termLabel = (sc) => `${sc.year ? sc.year + "학년도 " : ""}${sc.term || ""}`.trim();

  const pageWrap = (sc, P, title, kicker, body, bodyStyle = "", foot = "") => `
    <div class="page" style="width:${P.w}px;height:${P.h}px">
      <div class="page-head">
        <div><p class="page-kicker">${E(kicker)}</p><div class="page-title">${E(title)}</div></div>
        <div class="page-school">${E(sc.name)}<small>${E(T.termLabel(sc))}</small></div>
      </div>
      <div class="page-body" style="${bodyStyle}">${body}</div>
      <div class="page-foot"><span>${E(foot)}</span><span class="pg-no"></span></div>
    </div>`;

  // 한 장에 몇 개를 어떻게 놓을지 (가로 cols × 세로 rows)
  T.arrange = (n, orient) => {
    const P = T.PAPER[orient];
    const W = P.w - 64, H = P.h - 120;
    let best = null;
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      const cw = W / cols, ch = H / rows;
      const ideal = 1.25; // 시간표 한 개의 알맞은 가로:세로
      const score = Math.abs(Math.log((cw / ch) / ideal)) + (cols * rows - n) * 0.08;
      if (!best || score < best.score) best = { cols, rows, score };
    }
    return best;
  };
  const fsFor = (cols, rows, orient) => {
    const P = T.PAPER[orient];
    const cw = (P.w - 64) / cols, ch = (P.h - 120) / rows;
    const s = Math.min(cw / 640, ch / 470);
    return Math.max(8.5, Math.min(15, 13.5 * Math.sqrt(s) * (s < 0.6 ? 1.05 : 1)));
  };

  // 칸 높이에 맞춰 한 칸에 몇 줄까지 쓸지 (1: 과목만, 2: +한 줄, 3: 모두)
  const linesFor = (sc, P, rows, fs, withHours) => {
    const bodyH = P.h - 150 - (rows - 1) * 14;
    const unitH = bodyH / rows;
    const gridH = unitH - fs * 1.8 - (withHours ? fs * 2.6 : 0) - 8;
    const rowH = gridH / (T.periodList(sc).length + 1 + (Number(sc.lunchAfter) ? 0.7 : 0));
    return rowH >= fs * 3.5 ? 3 : rowH >= fs * 2.5 ? 2 : 1;
  };
  const unitHTML = (sc, idx, kind, id, fs, withHours, lines = 3) => `
    <div class="unit l${lines}" style="--g-fs:${fs}px;--u-fs:${(fs * 1.2).toFixed(1)}px;--g-pw:${Math.round(fs * 4.2)}px">
      <div class="unit-title"><span>${E(T.titleOf(sc, kind, id))}</span><small>${E(T.subtitleOf(sc, kind, id))}</small></div>
      <div class="g-box">${T.gridHTML(sc, idx, kind, id, { times: fs >= 10 })}</div>
      ${withHours ? T.colorLegendHTML(sc, idx, kind, id) || T.hoursHTML(sc, idx, kind, id) : ""}
    </div>`;

  /* 출력 작업 → 종이 HTML 목록
     job: { type: 'class'|'person'|'room'|'grade'|'all', ids:[], grades:[], orient, perPage, basis, hours } */
  T.buildPages = (sc, idx, job) => T.withColorBy(job.color, () => buildPages0(sc, idx, job));
  const buildPages0 = (sc, idx, job) => {
    const P = T.PAPER[job.orient] || T.PAPER.landscape;
    const pages = [];
    const term = T.termLabel(sc);
    const kindName = { class: "학급별 시간표", person: "교사·강사별 시간표", room: "교실별 시간표" };
    if (["class", "person", "room"].includes(job.type)) {
      const per = Math.max(1, Number(job.perPage) || 1);
      const lay = per === 1 ? { cols: 1, rows: 1 } : T.arrange(per, job.orient);
      const fs = fsFor(lay.cols, lay.rows, job.orient);
      for (let i = 0; i < job.ids.length; i += per) {
        const chunk = job.ids.slice(i, i + per);
        const f = per === 1 ? Math.min(16, fs * 1.1) : fs;
        const lines = linesFor(sc, P, lay.rows, f, job.hours !== false);
        const body = chunk.map((id) => unitHTML(sc, idx, job.type, id, f, job.hours !== false, lines)).join("");
        const title = per === 1 ? T.titleOf(sc, job.type, chunk[0]) + " 시간표" : kindName[job.type];
        pages.push(pageWrap(sc, P, title, per === 1 ? kindName[job.type] : `한 장에 ${per}개`, per === 1 ? body.replace('class="unit-title"', 'class="unit-title" hidden') : body,
          `grid-template-columns:repeat(${lay.cols},minmax(0,1fr));grid-template-rows:repeat(${lay.rows},minmax(0,1fr))`,
          per === 1 ? T.subtitleOf(sc, job.type, chunk[0]) : ""));
      }
    } else if (job.type === "grade") {
      (job.grades || []).forEach((g) => {
        const ids = T.classesOfGrade(sc, g).map((c) => c.id);
        if (!ids.length) return;
        if (job.gradeStyle === "matrix") {
          const rows = T.matrixRows(sc, "class", { grade: g });
          pages.push(matrixPage(sc, idx, P, "class", rows, `${g}학년 시간표`, "학년별 한눈에 보기", job));
          return;
        }
        const lay = T.arrange(ids.length, job.orient);
        const fs = fsFor(lay.cols, lay.rows, job.orient);
        const lines = linesFor(sc, P, lay.rows, fs, job.hours !== false);
        const body = ids.map((id) => unitHTML(sc, idx, "class", id, fs, job.hours !== false, lines)).join("");
        pages.push(pageWrap(sc, P, `${g}학년 시간표`, "학년별 시간표", body,
          `grid-template-columns:repeat(${lay.cols},minmax(0,1fr));grid-template-rows:repeat(${lay.rows},minmax(0,1fr))`));
      });
    } else if (job.type === "free") {
      const gs = (job.grades || []).filter((g) => T.classesOfGrade(sc, g).length);
      const groups = job.freeEach ? gs.map((g) => [g]) : gs.length ? [gs] : [];
      groups.forEach((grp) => pages.push(pageWrap(sc, P, `${grp.map((g) => T.gradeName(g).replace(/학년$/, "")).join("·")}학년 행사 가능 시간`, grp.length > 1 ? "교담 없는 시간 찾기 · 여러 학년 함께" : "교담 없는 시간 찾기", `<div class="free-wrap">${T.freeGridHTML(sc, idx, grp)}</div>`, "",
        grp.length > 1 ? "음영 칸 = 고른 학년 모든 반이 담임 수업(교담·강사·묶음 수업 없음) → 여러 학년 함께 하는 행사를 넣기 좋은 시간" : "음영 칸 = 이 학년 모든 반이 담임 수업(교담·강사·묶음 수업 없음) → 학년 행사를 넣기 좋은 시간")));
    } else if (job.type === "all") {
      const basis = job.basis || "class";
      const rows = T.matrixRows(sc, basis, basis === "room" ? { special: job.roomSpecial ? true : undefined } : {});
      const perPage = job.orient === "landscape" ? 26 : 42;
      const nPages = Math.max(1, Math.ceil(rows.length / perPage));
      const each = Math.ceil(rows.length / nPages);
      const name = { class: "전체 시간표 (학급 기준)", person: "전체 시간표 (교사·강사 기준)", room: "전체 시간표 (교실 기준)" }[basis];
      for (let i = 0; i < nPages; i++) {
        pages.push(matrixPage(sc, idx, P, basis, rows.slice(i * each, (i + 1) * each), name, nPages > 1 ? `한눈에 보기 · ${i + 1}/${nPages}` : "한눈에 보기", job));
      }
    }
    return pages;
  };

  const matrixPage = (sc, idx, P, kind, rows, title, kicker, job) => {
    const cols = T.dayList(sc).length * T.periodList(sc).length;
    const usableW = P.w - 64, usableH = P.h - 130;
    const lw = kind === "person" ? 108 : kind === "room" ? 96 : 88;
    const cw = (usableW - lw) / cols;
    const rh = Math.max(16, Math.min(46, Math.floor((usableH - 44) / Math.max(rows.length, 1))));
    const fs = Math.max(8, Math.min(13, Math.min(cw / 2.6, rh / 2.1)));
    const compact = kind === "person" && rh < 28;
    return pageWrap(sc, P, title, kicker,
      `<div class="mx-box" style="--mx-lw:${lw}px;--mx-rh:${rh}px;--mx-fs:${fs.toFixed(1)}px">${T.matrixHTML(sc, idx, kind, rows, { compact, showSub: kind !== "room" })}</div>`,
      "display:block");
  };

  // 인증코드 안내문 (잘라서 나눠 주기): QR을 휴대폰으로 찍으면 바로 입력 화면
  T.buildSlipPages = (sc, list) => {
    const P = T.PAPER.portrait;
    const per = 10;
    const pages = [];
    for (let i = 0; i < list.length; i += per) {
      const body = `<div class="slips">${list.slice(i, i + per).map((x) => `
        <div class="slip">
          <div class="slip-t"><small>${E(sc.name)} 시간표 · 학교 코드 <b>${E(x.sid)}</b></small>
            <b>${E(x.name)} <small>${E(x.desc)}</small></b>
            <span class="code">${E(x.code)}</span>
            <small>QR을 찍거나 받은 링크를 누르면 바로 입력 화면이 열립니다. 다른 사람에게 알려 주지 마세요.</small></div>
          ${x.qr ? `<img class="slip-qr" src="${x.qr}" alt="">` : ""}</div>`).join("")}</div>`;
      pages.push(pageWrap(sc, P, "시간표 입력 인증코드", "선생님별로 잘라서 나눠 주세요", body, "display:block"));
    }
    return pages;
  };
})();

</script>
<script>
/* 출력: PDF · JPG · 인쇄 */
(function () {
  const T = (window.TT = window.TT || {});
  const LIBS = {
    html2canvas: "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js",
    jspdf: "https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js",
    jszip: "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js",
    exceljs: "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js",
    qr: "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js",
  };
  const loaded = {};
  T.loadScript = (src) =>
    (loaded[src] = loaded[src] || new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = res;
      s.onerror = () => { delete loaded[src]; rej(new Error("출력 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요.")); };
      document.head.appendChild(s);
    }));

  // 파일 저장: Claude 화면 안이면 downloads 기능, 아니면 브라우저 내려받기
  let dl;
  const downloads = () => (dl = dl || (window.claude && window.claude.use ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null)));
  T.saveFile = async (blob, filename) => {
    const d = await downloads();
    if (d) {
      try { await d.save({ filename, data: blob }); return true; }
      catch (e) { if (e && e.code === "declined") return false; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    return true;
  };

  // 종이 HTML → 캔버스
  async function renderPages(pagesHtml, onProgress) {
    await T.loadScript(LIBS.html2canvas);
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const host = document.createElement("div");
    host.style.cssText = "position:fixed;left:-30000px;top:0;";
    document.body.appendChild(host);
    const out = [];
    try {
      for (let i = 0; i < pagesHtml.length; i++) {
        host.innerHTML = pagesHtml[i];
        const el = host.firstElementChild;
        T.numberPage(el, i, pagesHtml.length);
        onProgress && onProgress(i + 1, pagesHtml.length);
        const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: "#ffffff", logging: false, useCORS: true, windowWidth: el.offsetWidth + 40 });
        out.push(canvas);
      }
    } finally { host.remove(); }
    return out;
  }
  T.numberPage = (el, i, n) => { const s = el.querySelector(".pg-no"); if (s) s.textContent = n > 1 ? `${i + 1} / ${n}` : ""; };

  T.exportPDF = async (pagesHtml, orient, filename, onProgress) => {
    const canvases = await renderPages(pagesHtml, onProgress);
    await T.loadScript(LIBS.jspdf);
    const [mw, mh] = T.PAPER[orient].mm;
    const pdf = new window.jspdf.jsPDF({ orientation: orient, unit: "mm", format: "a4" });
    canvases.forEach((c, i) => {
      if (i) pdf.addPage("a4", orient);
      pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, mw, mh);
    });
    return T.saveFile(pdf.output("blob"), filename + ".pdf");
  };

  T.exportJPG = async (pagesHtml, orient, filename, onProgress) => {
    const canvases = await renderPages(pagesHtml, onProgress);
    const blobs = await Promise.all(canvases.map((c) => new Promise((r) => c.toBlob(r, "image/jpeg", 0.92))));
    if (blobs.length === 1) return T.saveFile(blobs[0], filename + ".jpg");
    await T.loadScript(LIBS.jszip);
    const zip = new window.JSZip();
    blobs.forEach((b, i) => zip.file(`${filename}_${String(i + 1).padStart(2, "0")}.jpg`, b));
    return T.saveFile(await zip.generateAsync({ type: "blob" }), filename + "_JPG.zip");
  };

  T.printPages = (pagesHtml, orient) => {
    let root = document.getElementById("print-root");
    if (!root) { root = document.createElement("div"); root.id = "print-root"; document.body.appendChild(root); }
    root.innerHTML = pagesHtml.join("");
    [...root.children].forEach((el, i) => T.numberPage(el, i, pagesHtml.length));
    let st = document.getElementById("print-page-style");
    if (!st) { st = document.createElement("style"); st.id = "print-page-style"; document.head.appendChild(st); }
    st.textContent = `@page { size: A4 ${orient}; margin: 0; } @media print { #print-root .page { width: ${T.PAPER[orient].mm[0]}mm !important; height: ${T.PAPER[orient].mm[1] - 0.5}mm !important; } }`;
    document.body.classList.add("printing");
    const done = () => { document.body.classList.remove("printing"); root.innerHTML = ""; window.removeEventListener("afterprint", done); };
    window.addEventListener("afterprint", done);
    setTimeout(() => { try { window.print(); } catch (e) { T.toast("이 화면에서는 인쇄가 막혀 있습니다. PDF로 저장한 뒤 인쇄하세요.", "error"); } setTimeout(done, 1500); }, 60);
  };

  T.qrDataUrl = async (text) => {
    await T.loadScript(LIBS.qr);
    const q = window.qrcode(0, "M");
    q.addData(text);
    q.make();
    return q.createDataURL(4, 2);
  };

  /* ───── 엑셀(.xlsx) ─────
     학급별·교사별·교실별: 한 개에 시트 하나 / 학년별: 학년마다 시트 하나(반을 위아래로) / 전체: 한눈에 표 */
  const argb = (hex) => "FF" + String(hex || "#ffffff").replace("#", "").toUpperCase();
  const sheetName = (wb, name) => {
    let n = String(name).replace(/[\\/?*[\]:]/g, " ").slice(0, 28) || "시트";
    let k = n, i = 2;
    while (wb.getWorksheet(k)) k = `${n.slice(0, 25)} ${i++}`;
    return k;
  };
  const thin = { style: "thin", color: { argb: "FF9EA9A3" } };
  const box = { top: thin, left: thin, bottom: thin, right: thin };
  const textOf = (sc, kind, id, items, scheds) => {
    const c = T.cellContent(sc, kind, id, items, scheds ? { scheds } : {});
    if (!c.html) return { text: "", color: null };
    const div = document.createElement("div");
    div.innerHTML = c.html;
    div.querySelectorAll(".tag").forEach((t) => (t.textContent = " (" + t.textContent + ")"));
    const parts = c.cls === "split"
      ? [...div.children].map((h) => [...h.children].map((x) => x.textContent).filter(Boolean).join(" / "))
      : [...div.children].map((x) => x.textContent).filter(Boolean);
    const it = items[0];
    return { text: parts.join("\n"), color: c.cls === "conflict" ? "#fde3e0" : (T.itemColor(sc, it) === "none" ? null : T.COLORS[T.itemColor(sc, it)].bg) };
  };
  function writeGrid(ws, sc, idx, kind, id, row0, withHours) {
    const sch = T.gridSched(sc, kind, id);
    const scheds = kind === "person" ? T.personScheds(sc, idx, id) : kind === "room" && !String(id).startsWith("hr:") ? T.usedScheds(sc) : null;
    const days = T.dayList(sc);
    ws.mergeCells(row0, 1, row0, days.length + 1);
    const t = ws.getCell(row0, 1);
    t.value = `${T.titleOf(sc, kind, id)} 시간표   ${T.subtitleOf(sc, kind, id)}`;
    t.font = { bold: true, size: 14 };
    let r = row0 + 1;
    ["교시", ...days.map((d) => T.DAYS[d])].forEach((v, i) => {
      const c = ws.getCell(r, i + 1);
      c.value = v; c.font = { bold: true }; c.alignment = { horizontal: "center", vertical: "middle" };
      c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF2F5F3" } }; c.border = box;
    });
    ws.getRow(r).height = 20;
    const trows = scheds ? T.timeRows(sc, scheds, sch.periods || 6) : null;
    const rowList = trows || Array.from({ length: sch.periods || 6 }, (_, i) => ({ p: i + 1, t: null }));
    for (const row of rowList) {
      const p = row.p;
      r++;
      const tm = (sch.times || [])[p - 1];
      const h = ws.getCell(r, 1);
      const h0 = scheds && !trows ? T.periodHead(sc, scheds, p)[0] : null;
      const hl = trows ? (row.s ? [(row.label ? row.label + " " : "") + `${row.s}~${row.e}`] : []) : h0 ? [`${h0.s}~${h0.e}`] : tm && tm.s ? [`${tm.s}~${tm.e}`] : [];
      h.value = [`${p}교시`, ...hl].join("\n");
      h.alignment = { horizontal: "center", vertical: "middle", wrapText: true }; h.font = { bold: true, size: 10 };
      h.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF2F5F3" } }; h.border = box;
      days.forEach((d, i) => {
        const c = ws.getCell(r, i + 2);
        const { text, color } = textOf(sc, kind, id, T.rowItems(sc, T.cellItems(idx, kind, id, d, p), row), scheds);
        c.value = text;
        c.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
        c.border = box;
        if (color) c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: argb(color) } };
        else if (kind === "class" && T.beyond(sc, id, d, p)) c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE5E8E6" } };
      });
      ws.getRow(r).height = 42;
      if (!trows && sch.lunchAfter && p === sch.lunchAfter && p < sch.periods) {
        r++;
        ws.mergeCells(r, 2, r, days.length + 1);
        ws.getCell(r, 1).value = "점심";
        const lt = T.lunchTime(sch);
        ws.getCell(r, 2).value = lt ? `점심시간 ${lt.s}~${lt.e}` : "점심시간";
        [1, 2].forEach((col) => { const c = ws.getCell(r, col); c.alignment = { horizontal: "center" }; c.font = { size: 9, color: { argb: "FF66716C" } }; c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF2F5F3" } }; c.border = box; });
      }
    }
    if (withHours) {
      const hrs = T.hoursBy(idx, kind, id);
      if (hrs.total) {
        r++;
        ws.mergeCells(r, 1, r, days.length + 1);
        const order = (sc.subjects || []).map((x) => x.id);
        ws.getCell(r, 1).value = `주 ${hrs.total}시간 — ` + Object.keys(hrs.by).sort((a, b) => order.indexOf(a) - order.indexOf(b)).map((x) => `${T.subjectShort(sc, x)} ${hrs.by[x]}`).join(" · ");
        ws.getCell(r, 1).font = { size: 10, color: { argb: "FF66716C" } };
      }
    }
    return r + 2;
  }
  function writeMatrix(ws, sc, idx, kind, rows) {
    const days = T.dayList(sc), periods = T.periodList(sc);
    ws.getCell(1, 1).value = kind === "class" ? "학급" : kind === "person" ? "선생님" : "장소";
    let col = 2;
    days.forEach((d) => {
      ws.mergeCells(1, col, 1, col + periods.length - 1);
      ws.getCell(1, col).value = T.DAYS[d];
      periods.forEach((p, i) => { ws.getCell(2, col + i).value = p; });
      col += periods.length;
    });
    ws.mergeCells(1, 1, 2, 1);
    for (let c = 1; c < col; c++) [1, 2].forEach((r) => { const x = ws.getCell(r, c); x.font = { bold: true }; x.alignment = { horizontal: "center", vertical: "middle" }; x.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF2F5F3" } }; x.border = box; });
    rows.forEach((rw, ri) => {
      const r = ri + 3;
      const h = ws.getCell(r, 1);
      h.value = rw.sub ? `${rw.label} (${rw.sub})` : rw.label; h.font = { bold: true }; h.border = box;
      let c = 2;
      days.forEach((d) => periods.forEach((p) => {
        const x = ws.getCell(r, c++);
        x.border = box; x.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
        if (kind === "class" && T.beyond(sc, rw.id, d, p) && !T.cellItems(idx, kind, rw.id, d, p).length) { x.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE5E8E6" } }; return; }
        const items = T.cellItems(idx, kind, rw.id, d, p);
        if (!items.length) return;
        const it = items[0];
        const name = it.b ? T.blockName(sc, it.b) : T.subjectShort(sc, it.s);
        x.value = kind === "class" ? name : kind === "person" ? (it.b ? name : `${it.cls}\n${name}`) : `${it.cls}\n${name}`;
        x.fill = { type: "pattern", pattern: "solid", fgColor: { argb: argb(T.COLORS[T.itemColor(sc, it) === "none" ? "gray" : T.itemColor(sc, it)].bg) } };
        x.font = { size: 9 };
      }));
      ws.getRow(r).height = kind === "class" ? 22 : 30;
    });
    ws.getColumn(1).width = 16;
    for (let c = 2; c < col; c++) ws.getColumn(c).width = 6.5;
  }
  T.loadExcel = () => T.loadScript(LIBS.exceljs);
  T.exportXLSX = async (sc, idx, job, filename) => {
    await T.loadScript(LIBS.exceljs);
    const prevColor = T.colorBy; T.colorBy = job.color || "subject";
    try { return await exportXLSX0(sc, idx, job, filename); } finally { T.colorBy = prevColor; }
  };
  const exportXLSX0 = async (sc, idx, job, filename) => {
    const wb = new window.ExcelJS.Workbook();
    wb.creator = "함께 짜는 시간표";
    const setup = (ws, fit = true) => {
      ws.pageSetup = { paperSize: 9, orientation: job.orient || "landscape", fitToPage: fit, fitToWidth: 1, fitToHeight: fit ? 1 : 0, margins: { left: 0.3, right: 0.3, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 } };
    };
    const gridSheet = (ws) => { ws.getColumn(1).width = 12; T.dayList(sc).forEach((_, i) => (ws.getColumn(i + 2).width = 18)); };
    if (["class", "person", "room"].includes(job.type)) {
      (job.ids || []).forEach((id) => {
        const ws = wb.addWorksheet(sheetName(wb, T.titleOf(sc, job.type, id)));
        gridSheet(ws); setup(ws);
        writeGrid(ws, sc, idx, job.type, id, 1, job.hours !== false);
      });
    } else if (job.type === "grade") {
      (job.grades || []).forEach((g) => {
        const ws = wb.addWorksheet(sheetName(wb, `${g}학년`));
        if (job.gradeStyle === "matrix") { setup(ws); writeMatrix(ws, sc, idx, "class", T.matrixRows(sc, "class", { grade: g })); return; }
        gridSheet(ws); setup(ws, false);
        let r = 1;
        T.classesOfGrade(sc, g).forEach((c) => { r = writeGrid(ws, sc, idx, "class", c.id, r, job.hours !== false); ws.getRow(r - 1).addPageBreak && ws.getRow(r - 1).addPageBreak(); });
      });
    } else if (job.type === "all") {
      const basis = job.basis || "class";
      const ws = wb.addWorksheet(sheetName(wb, { class: "전체(학급)", person: "전체(교사)", room: "전체(교실)" }[basis]));
      setup(ws);
      writeMatrix(ws, sc, idx, basis, T.matrixRows(sc, basis, {}));
    }
    if (!wb.worksheets.length) throw new Error("내보낼 시간표가 없습니다.");
    const buf = await wb.xlsx.writeBuffer();
    return T.saveFile(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), filename + ".xlsx");
  };
})();

</script>
<script>
/* 화면 공통 부품: 알림, 대화상자, 확인창 */
(function () {
  const T = (window.TT = window.TT || {});
  T.$ = (s, r = document) => r.querySelector(s);
  T.$$ = (s, r = document) => [...r.querySelectorAll(s)];

  let toastTimer;
  T.toast = (msg, kind = "info", action) => {
    let t = T.$("#toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "toast";
      t.setAttribute("role", "status");
      t.setAttribute("aria-live", "polite");
      document.body.appendChild(t);
    }
    t.className = "toast toast-" + kind;
    t.textContent = msg;
    // action: { label, fn } → 알림 안에 단추 (예: 되돌리기)
    if (action && action.label) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "toast-act"; b.textContent = action.label;
      b.onclick = () => { t.hidden = true; action.fn(); };
      t.appendChild(b);
    }
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.hidden = true), action ? 9000 : kind === "error" ? 5000 : 2600);
  };

  T.modal = ({ title, body, wide = false, onClose }) => {
    const wrap = document.createElement("div");
    wrap.className = "modal-back";
    wrap.innerHTML = `
      <div class="modal ${wide ? "modal-wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-head"><h2 id="modal-title">${T.esc(title)}</h2>
          <button type="button" class="icon-btn" data-close aria-label="닫기">✕</button></div>
        <div class="modal-body">${body}</div>
      </div>`;
    document.body.appendChild(wrap);
    document.body.classList.add("no-scroll");
    let closed = false;
    const close = () => {
      if (closed) return;
      closed = true;
      wrap.remove();
      if (!T.$(".modal-back")) document.body.classList.remove("no-scroll");
      document.removeEventListener("keydown", onKey);
      onClose && onClose();
    };
    const onKey = (e) => { if (e.key === "Escape" && wrap === T.$$(".modal-back").pop()) close(); };
    document.addEventListener("keydown", onKey);
    let downOnBack = false;
    wrap.addEventListener("pointerdown", (e) => { downOnBack = e.target === wrap; });
    wrap.addEventListener("click", (e) => {
      if (e.target.closest("[data-close]")) return close();
      if (e.target === wrap && downOnBack && !wrap.querySelector("input:not([type=hidden]), select, textarea")) close();
    });
    const first = wrap.querySelector("input, select, textarea");
    setTimeout(() => first && first.focus(), 30);
    return { el: wrap, close };
  };

  T.confirm = (message, { ok = "확인", danger = false } = {}) =>
    new Promise((resolve) => {
      let answered = false;
      const m = T.modal({
        title: "확인",
        body: `<p style="margin:0">${T.esc(message).replace(/\n/g, "<br>")}</p>
          <div class="row-end"><button type="button" class="btn ghost" data-close>취소</button>
          <button type="button" class="btn ${danger ? "danger" : "primary"}" data-ok>${T.esc(ok)}</button></div>`,
        onClose: () => { if (!answered) resolve(false); },
      });
      m.el.querySelector("[data-ok]").addEventListener("click", () => { answered = true; resolve(true); m.close(); });
    });

  T.busy = async (btn, fn, label = "처리 중…") => {
    const html = btn ? btn.innerHTML : "";
    if (btn) { btn.disabled = true; btn.textContent = label; }
    try { return await fn(); }
    finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = html; } }
  };
})();

</script>
<script>
/* 화면: 첫 화면 · 조회 · 입력 · 출력 · 기본설정 */
(function () {
  const T = window.TT;
  const E = T.esc;
  const cfg = window.TT_CONFIG || {};
  let store = null;
  const app = document.getElementById("app");
  const ADMIN = T.ADMIN;

  const A = {
    ready: false, initError: null,
    sid: null, school: undefined, slots: {}, idx: null, loadError: null,
    me: { pid: null, admin: false },
    tab: "view",
    view: { kind: "class", id: null, mx: "class", mxGrade: 0 },
    ed: { actAs: null, mode: null, cls: null, brush: null, room: "", subj: "", wroom: "", wbrush: null, forActor: null },
    pr: { type: "class", ids: {}, grades: null, orient: "landscape", perPage: 1, basis: "class", gradeStyle: "grid", hours: true },
    set: { draft: null, dirty: false, sec: "basic", codes: null, codesFor: null },
    pending: {}, timers: {}, saveState: "", unsub: null,
  };
  T.A = A; // 시험·점검용

  /* ───────── 공통 ───────── */
  const meKey = (sid) => `tt-me-${sid}`;
  const saveMe = () => { try { localStorage.setItem(meKey(A.sid), JSON.stringify(A.me)); } catch (e) {} };
  const loadMe = (sid) => { try { return JSON.parse(localStorage.getItem(meKey(sid)) || "null") || { pid: null, admin: false }; } catch (e) { return { pid: null, admin: false }; } };
  const recent = () => { try { return JSON.parse(localStorage.getItem("tt-recent") || "[]"); } catch (e) { return []; } };
  const addRecent = (sid, name) => {
    if (sid === T.EXAMPLE_ID) return;
    const list = recent().filter((x) => x.sid !== sid);
    list.unshift({ sid, name });
    try { localStorage.setItem("tt-recent", JSON.stringify(list.slice(0, 5))); } catch (e) {}
  };
  const go = (path) => { if (location.hash !== "#" + path) location.hash = path; else route(); };
  const sc = () => A.school;
  // 링크로 들어온 '간단 화면': 내 시간표만 입력, 조회는 학년별만
  const isSimple = () => !!(A.me.simple && A.me.pid && !A.me.admin);
  const actor = () => A.ed.actAs || A.me.pid;
  // 휴대폰: 요일 하나씩 (요일 단추로 바꿈)
  const narrow = () => window.innerWidth < 640;
  const mDay = (s) => { const ds = T.dayList(s); if (!ds.includes(A.mDay)) { const t = new Date().getDay(); A.mDay = ds.includes(t) ? t : ds[0]; } return A.mDay; };
  const mob = (s, o = {}) => (narrow() ? { ...o, day: mDay(s) } : o);
  const mTabs = (s) => (narrow() ? `<div class="mday" role="tablist">${T.dayList(s).map((d) => `<button type="button" class="${mDay(s) === d ? "on" : ""}" data-act="mday" data-d="${d}" role="tab" aria-selected="${mDay(s) === d}">${T.DAYS[d]}</button>`).join("")}</div>` : "");
  const canEditAs = (pid) => !!pid && (A.me.admin || A.me.pid === pid);

  const after = [];
  /* ───────── 버전 ───────── */
  const footer = () => {
    const sv = store && store.mode === "cloud" ? (store.info && store.info.version) || "?" : null;
    return `<footer class="app-foot"><div class="wrap">${E(cfg.SITE_NAME || "함께 짜는 시간표")} <b>v${E(T.VERSION)}</b> <span class="hint">(${E(T.RELEASED)})</span>
      · <button class="link-btn" data-act="changes">변경 내역</button>
      · ${sv ? `서버 v${E(sv)}${sv !== T.VERSION ? ' <b class="warn">(버전 다름)</b>' : ""}` : "체험 모드"}</div></footer>`;
  };
  const updateBar = () => (A.newVersion ? `<div class="update-bar"><div class="wrap">새 버전(v${E(A.newVersion)})이 올라왔습니다. 입력 중인 내용은 이미 저장되어 있습니다.
      <button class="btn sm primary" data-act="reload">새로 고침</button></div></div>` : "");
  function showChanges() {
    T.modal({
      title: `변경 내역 · 지금 v${T.VERSION}`,
      body: `<div class="stack">${T.CHANGES.map(([v, d, items]) => `<div><b>v${E(v)}</b> <span class="hint">${E(d)}</span><ul class="changes">${items.map((x) => `<li>${E(x)}</li>`).join("")}</ul></div>`).join("")}</div>`,
    });
  }
  // 서버에 새 버전이 배포됐는지: 창으로 돌아올 때와 10분마다
  let lastVerCheck = 0;
  async function checkVersion(force) {
    if (!store || store.mode !== "cloud" || !store.serverVersion) return;
    if (!force && Date.now() - lastVerCheck < 60000) return;
    lastVerCheck = Date.now();
    const v = await store.serverVersion();
    if (v && v !== T.VERSION && A.newVersion !== v) { A.newVersion = v; render(); }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkVersion(); });
  setInterval(() => checkVersion(true), 10 * 60 * 1000);

  function render() {
    const a = document.activeElement;
    const fk = a && a.dataset && a.dataset.f;
    let sel = null;
    try { sel = fk ? [a.selectionStart, a.selectionEnd] : null; } catch (e) {}
    T.setNames(A.sid && A.school ? (A.tab === "settings" && A.set && A.set.draft ? A.set.draft : A.school) : null);
    app.innerHTML = updateBar() + (A.sid ? shell() : A.page === "super" ? superPage() : landing()) + footer();
    if (fk) {
      const n = app.querySelector(`[data-f="${CSS.escape(fk)}"]`);
      if (n) { n.focus(); try { sel && n.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
    }
    // 휴대폰: 표를 카드처럼 쌓을 때 칸 이름 붙이기
    app.querySelectorAll("table.cardify").forEach((t) => { const hs = [...t.querySelectorAll("thead th")].map((th) => th.textContent.trim()); t.querySelectorAll("tbody tr").forEach((tr) => [...tr.children].forEach((td, i) => { if (hs[i]) td.dataset.label = hs[i]; })); });
    while (after.length) after.shift()();
  }

  /* ───────── 길찾기 ───────── */
  async function route() {
    const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    let sid = parts[0] === "s" ? T.cleanSid(decodeURIComponent(parts[1] || "")) : "";
    if (!sid && cfg.DEFAULT_SCHOOL && !parts.length) sid = T.cleanSid(cfg.DEFAULT_SCHOOL);
    // 개인 입력 링크: #/s/학교/k/사람/코드 → 자동으로 들어간 뒤 주소에서 코드를 지움
    if (parts[0] === "s" && parts[2] === "k" && parts[3] && parts[4]) {
      A.pendingKey = { sid, pid: decodeURIComponent(parts[3]), code: decodeURIComponent(parts[4]) };
      try { history.replaceState(null, "", `${location.pathname}${location.search}#/s/${encodeURIComponent(sid)}/edit`); } catch (e) { location.hash = `/s/${sid}/edit`; }
      parts[2] = "edit";
      if (sid === A.sid) usePendingKey();
    }
    A.page = parts[0] === "super" ? "super" : null;
    const tab = (parts[0] === "s" ? parts[2] : "") || "view";
    A.tab = ["view", "edit", "print", "settings"].includes(tab) ? tab : "view";
    if (!sid) { closeSchool(); render(); return; }
    if (sid !== A.sid) openSchool(sid);
    render();
  }
  window.addEventListener("hashchange", route);

  async function usePendingKey() {
    const k = A.pendingKey;
    if (!k || k.sid !== A.sid) return;
    A.pendingKey = null;
    try {
      const ok = await store.login(A.sid, k.pid, k.code);
      if (!ok) { T.toast("링크의 인증코드가 바뀌었습니다. 관리자에게 새 링크를 받으세요.", "error"); return; }
      if (k.pid === ADMIN) A.me.admin = true; else { A.me.pid = k.pid; A.me.simple = true; A.ed.actAs = null; A.ed.forActor = null; }
      A.view.kind = "grade";
      saveMe();
      const s = sc();
      T.toast(s && k.pid !== ADMIN ? `${T.personName(s, k.pid)} 선생님, 바로 입력할 수 있습니다.` : "들어왔습니다.");
      render();
    } catch (e) { T.toast(e.message || "들어가지 못했습니다.", "error"); }
  }
  function closeSchool() {
    if (A.unsub) A.unsub();
    A.unsub = null; A.sid = null; A.school = undefined; A.slots = {}; A.idx = null;
  }
  function openSchool(sid) {
    closeSchool();
    Object.assign(A, { sid, school: undefined, slots: {}, idx: null, loadError: null, me: loadMe(sid) });
    A.ed = { actAs: null, mode: null, cls: null, brush: null, room: "", subj: "", wroom: "", wbrush: null, forActor: null };
    A.view = { kind: "class", id: null, mx: "class", mxGrade: 0 };
    A.pr.ids = {}; A.pr.grades = null;
    A.set = { draft: null, dirty: false, sec: "basic", codes: null, codesFor: null };
    const go2 = async () => {

  // 이 선생님이 직접 입력한 과목 (넣어 둔 칸 + 이번에 만든 것)

  function openCustom(done) {

        <div class="field"><span>색</span><div class="color-pick big">${T.COLOR_KEYS.map((k) => `<button type="button" class="${k === color ? "on" : ""}" style="${T.colorVars(k)}" title="${T.COLORS[k].name}" data-c="${k}"></button>`).join("")}</div></div>

      if (!same) A.ed.custom = [...new Set([...(A.ed.custom || []), id])];
      m.close();
      T.toast(same ? `'${name}'은(는) 이미 학교 과목에 있어 그것을 골랐습니다.` : `'${name}' 과목을 만들었습니다. 끌어다 칸에 놓으세요.`);

    const hr = T.homeroomOf(s, cls);

    const asg = T.assignOf(s, g).map((a) => ({ a, done: T.assignDone(s, A.slots, a)[cls] || 0 }));
    return `<div class="ed-layout">
        <section class="panel">
          <div class="row-between" style="align-items:flex-end"><div><h2 class="h2">${E(T.className(cls))}</h2><p class="hint">${hr ? `담임 ${E(T.personName(s, hr.id))} · ` : ""}🔒 칸은 다른 선생님이 넣은 시간이나 묶음 수업이라 고칠 수 없습니다.</p></div>${isSimple() ? "" : clsSel}</div>
          <div class="stack" style="gap:8px"><span class="hint"><b>과목을 끌어다 칸에 놓거나, 과목을 고른 뒤 칸을 누르세요.</b> 같은 과목으로 한 번 더 누르면 지워집니다. 넣은 칸은 끌어서 옮기고, 넣은 칸끼리 끌어 놓으면 서로 바뀝니다.</span>${palette}
            <div class="btn-row" style="align-items:flex-end">
              <label class="field" style="max-width:260px"><span>장소</span><select data-on="ed-room">${roomOptions(s, A.ed.room)}</select></label>
              <label class="check join-toggle"><input type="checkbox" data-on="ed-join" ${A.ed.join ? "checked" : ""}><span><b>함께 들어가기(협력수업)</b><br><span class="hint">켜고 🔒 칸을 누르면 그 수업에 함께 들어갑니다</span></span></label></div></div>

        </aside>
      </div>`;

  function classCell(s, pid, cls, d, pp) {
    const items = T.cellItems(A.idx, "class", cls, d, pp);

    const mineJ = items.find((i) => i.pid === pid && i.j), mineM = items.find((i) => i.pid === pid && !i.j);

      if (mineJ) return { cls: "mine co", style: T.colorVars(T.subjectColor(s, o.s)), attrs: attrs + ' data-mine="1"', html: `<b>${E(T.subjectShort(s, o.s))}</b><small>${E(names)}</small><small>함께 들어감</small>` };

    return { cls: "empty", attrs, html: "" };

              ${myCustoms(pid).length ? `<optgroup label="직접 입력한 과목">${myCustoms(pid).map((id) => `<option value="${E(id)}" ${A.ed.subj === id ? "selected" : ""}>${E(T.subject(s, id).name)}</option>`).join("")}</optgroup>` : ""}

  // 넣은 칸 끌어서 옮기기 — 내가 넣은 다른 칸에 놓으면 두 칸을 서로 바꿈

  function fitPreview() {

    const n = pv.querySelectorAll(".pv-page").length;
    pv.querySelectorAll(".pv-page").forEach((el, i) => {
      el.style.width = W * k + "px"; el.style.height = H * k + "px";

      pg.style.transform = `scale(${k})`;
      T.numberPage(pg, i, n);

  // 짧은 설명 + '자세히'

  /* 담임 자동: 학급마다 담임 자리가 없으면 만들고, 없어진 학급의 '빈' 담임(이름·시간표 없음)은 조용히 지움 → 바뀌었으면 true */
  function ensureHomerooms(d) {
    let ch = false;
    const ids = new Set(T.classList(d).map((c) => c.id));
    const before = d.people.length;
    d.people = d.people.filter((p) => !(p.role === "homeroom" && p.cls && !ids.has(p.cls) && !String(p.name || "").trim() && !Object.keys((A.slots[p.id] && A.slots[p.id].e) || {}).length));
    if (d.people.length !== before) ch = true;
    T.classList(d).forEach((c) => { if (!d.people.some((p) => p.role === "homeroom" && p.cls === c.id)) { d.people.push({ id: T.uid("p"), name: "", role: "homeroom", title: "hr", cls: c.id, subject: "", room: "" }); ch = true; } });
    return ch;
  }
  // 학급을 줄이거나 학년을 뺄 때: 이름이 있거나 시간표를 넣은 담임이 있으면 묻고, 함께 지움
  async function shrinkClasses(d, g, newN, label) {
    const old = Number(d.classCounts[g - 1]) || 0;
    const gone = Array.from({ length: Math.max(0, old - newN) }, (_, k) => `${g}-${newN + k + 1}`);
    const hrs = d.people.filter((p) => p.role === "homeroom" && gone.includes(p.cls));
    // '세팅된' 담임 = 이름을 넣었거나 시간표를 넣은 담임 (저절로 만든 빈 자리는 묻지 않고 함께 빠짐)
    const real = hrs.filter((p) => String(p.name || "").trim() || Object.keys((A.slots[p.id] && A.slots[p.id].e) || {}).length);
    const cells = Object.values(A.slots).reduce((n, v) => n + Object.keys((v && v.e) || {}).filter((k) => gone.includes(k.split("|")[0])).length, 0);

  function setPath(obj, path, val) {
    const ks = path.split(".");
    let o = obj;
    ks.slice(0, -1).forEach((k) => (o = o[k] = o[k] && typeof o[k] === "object" ? o[k] : {}));
    o[ks[ks.length - 1]] = val;
  }
  function validate(d) {
    const errs = [];
    (d.blocks || []).forEach((b) => { if (!String(b.name || "").trim()) errs.push("이름이 빈 묶음 수업이 있습니다."); });
    (d.assign || []).forEach((a) => { if (a.s && !a.pid) errs.push(`${a.g}학년 ${T.subjectName(d, a.s)}: 담당 선생님을 고르세요.`); });
    if (!String(d.name || "").trim()) errs.push("학교 이름을 넣어 주세요.");
    if (!d.days.length) errs.push("요일을 하나 이상 고르세요.");
    const names = d.subjects.map((x) => x.name.trim());
    if (names.some((n) => !n)) errs.push("이름이 빈 과목이 있습니다.");
    if (new Set(names).size !== names.length) errs.push("같은 이름의 과목이 두 개 있습니다.");
    d.subjects.forEach((x) => { if (Array.isArray(x.grades) && !x.grades.length) errs.push(`'${x.name}' 과목에 학년을 하나 이상 고르세요.`); });
    if (d.rooms.some((r) => !String(r.name || "").trim())) errs.push("이름이 빈 장소가 있습니다.");
    const seen = {};
    d.people.forEach((p) => {
      if (p.role !== "homeroom") return;
      if (p.cls && !T.hasClass(d, p.cls)) errs.push(`${p.name || "담임"}: ${p.cls} 반이 없습니다(학급 수 확인).`);
      if (p.cls) { if (seen[p.cls]) errs.push(`${p.cls} 담임이 두 명입니다.`); seen[p.cls] = 1; }
    });
    return errs;
  }
  async function saveSettings(btn) {
    const d = draft();
    T.normalize(d);
    d.schedules.forEach((x) => { x.name = String(x.name || "").trim() || "시정표"; x.times = x.times.slice(0, x.periods); if (x.lunchAfter >= x.periods) x.lunchAfter = 0;
      x.breaks = (x.breaks || []).filter((b) => b && String(b.name || "").trim()).map((b) => ({ ...b, name: String(b.name).trim().slice(0, 10), after: Math.max(1, Math.min(x.periods - 1, Number(b.after) || 1)), min: Math.max(0, Number(b.min) || 0) })); });
    Object.keys(d.gradeSched).forEach((g) => { if (!d.schedules.some((x) => x.id === d.gradeSched[g])) delete d.gradeSched[g]; });
    ensureHomerooms(d);
    const noPid = d.assign.filter((a) => a.s && !a.pid);
    if (noPid.length) { T.toast(`${[...new Set(noPid.map((a) => `${a.g}학년 ${T.subjectName(d, a.s)}`))].slice(0, 3).join(", ")}: 교담 선생님을 고르세요.`, "error"); return false; }
    d.assign = d.assign.filter((a) => a.s && a.pid && Number(a.h) > 0).map((a) => ({ ...a, h: Math.min(10, Number(a.h) || 0) }));
    d.blocks.forEach((b) => { b.members = (b.members || []).filter((m) => m.pid); b.classes = (b.classes || []).filter((c) => T.hasClass(d, c)); });
    T.normalize(d);
    d.classCounts = d.classCounts.slice(0, T.maxGrade(d.level, d)).map((n) => Math.max(0, Math.min(30, Number(n) || 0)));
    d.name = String(d.name).trim();
    Object.keys(d.gradeNames || {}).forEach((g) => { const v = String(d.gradeNames[g] || "").trim(); if (!v || Number(g) > d.classCounts.length) delete d.gradeNames[g]; else d.gradeNames[g] = v.slice(0, 10); });
    Object.keys(d.classNames || {}).forEach((k) => { const v = String(d.classNames[k] || "").trim(); const [g, n] = k.split("-").map(Number); if (!v || n > (d.classCounts[g - 1] || 0)) delete d.classNames[k]; else d.classNames[k] = v.slice(0, 8); });
    d.year = Number(d.year) || "";
    const errs = validate(d);
    if (errs.length) { T.toast(errs[0], "error"); return false; }
    if (A.set.baseAt !== undefined && (sc().updatedAt || "") !== (A.set.baseAt || "")) {
      const when = sc().updatedAt ? new Date(sc().updatedAt).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : "";
      if (!(await T.confirm(`고치는 사이에 다른 관리자가 ${when} 기본설정을 저장했습니다.\n지금 저장하면 그 내용을 덮어씁니다. 그래도 저장할까요?\n(취소하고 '되돌리기'를 누르면 새 내용을 불러옵니다.)`, { ok: "덮어쓰기", danger: true }))) return false;
    }
    let ok = false;
    await T.busy(btn, async () => {
      try {
        const before = new Set((sc().people || []).map((p) => p.id));
        const after2 = new Set(d.people.map((p) => p.id));
        const roomChanged = d.people.filter((p) => p.role !== "homeroom" && before.has(p.id) && ((T.person(sc(), p.id) || {}).room || "") !== (p.room || "")
          && Object.values((A.slots[p.id] && A.slots[p.id].e) || {}).some((v) => v && !v.j && (v.r || "") !== (p.room || "")));
        const out = T.clone(d);
        out.updatedAt = new Date().toISOString();
        await store.saveSchool(A.sid, out);
        for (const pid of before) if (!after2.has(pid)) await store.removePerson(A.sid, pid);
        const codes = A.set.codes || {};
        let made = 0;
        for (const p of d.people) if (!codes[p.id]) { const c = T.newCode(); await store.setCode(A.sid, p.id, c); codes[p.id] = c; made++; }
        A.set.codes = codes;
        A.set.dirty = false; A.set.draft = null;
        A.school = out; A.idx = T.buildIndex(out, A.slots);
        T.toast(made ? `저장했습니다. 인증코드 ${made}개를 새로 만들었습니다.` : "저장했습니다.");
        ok = true;
        render();
        if (roomChanged.length && (await T.confirm(`기본 교실을 바꾼 선생님: ${roomChanged.map((p) => T.personName(out, p.id)).join(", ")}\n이미 넣은 수업의 장소도 새 기본 교실로 바꿀까요?`, { ok: "바꾸기" }))) {
          for (const p of roomChanged) await applyRoomToMine(p.id, p.room || "");
        }
      } catch (e) {
        T.toast(e.message || "저장하지 못했습니다.", "error");
        if (e instanceof T.Denied) { A.me.admin = false; saveMe(); render(); }
      }
    });
    return ok;
  }

  /* 시간표 지우기 (관리자): pred(pid, {cls,d,p}, v) 가 참인 칸을 모든 선생님 시간표에서 지움 */
  async function bulkClear(label, pred) {
    const s = sc(), changes = {};
    let n = 0;
    Object.entries(A.slots || {}).forEach(([pid, doc]) => {
      const e = { ...((doc && doc.e) || {}) };
      let c = 0;
      Object.keys(e).forEach((k) => { if (pred(pid, T.parseKey(k), e[k])) { delete e[k]; c++; } });
      if (c) { changes[pid] = e; n += c; }
    });
    if (!n) { T.toast(`${label}: 지울 시간이 없습니다.`); return; }
    const who = Object.keys(changes).map((pid) => T.personName(s, pid));
    if (!(await T.confirm(`${label}\n${who.length}명(${who.slice(0, 4).join(", ")}${who.length > 4 ? " …" : ""})이 넣은 ${n}시간을 지울까요?\n되돌릴 수 없습니다. 필요하면 먼저 기본설정 → 관리 → 백업 파일을 받아 두세요.\n(묶음 수업은 기본설정 → 묶음 수업에서 지웁니다.)`, { ok: `${n}시간 지우기`, danger: true }))) return;
    const ti = pushTrash(label, Object.keys(changes));
    try {
      for (const [pid, e] of Object.entries(changes)) { await store.saveSlots(A.sid, pid, e); A.slots[pid] = { ...(A.slots[pid] || {}), e }; }
      A.idx = T.buildIndex(s, A.slots);
      T.toast(`${label}: ${n}시간을 지웠습니다.`, "info", { label: "되돌리기", fn: () => restoreTrash(ti) });
      render();
    } catch (err) { T.toast(err.message || "지우지 못했습니다.", "error"); }
  }
  /* 지우기 전에 이 기기에 자동 보관 (최근 5번) → 관리에서 복원 */
  const trashKey = () => `tt-trash-${A.sid}`;
  const readTrash = () => { try { return JSON.parse(localStorage.getItem(trashKey()) || "[]"); } catch (e) { return []; } };
  function pushTrash(label, pids) {
    const list = readTrash();
    const slots = {};
    pids.forEach((pid) => (slots[pid] = T.clone((A.slots[pid] && A.slots[pid].e) || {})));
    list.unshift({ at: new Date().toISOString(), label, slots });
    try { localStorage.setItem(trashKey(), JSON.stringify(list.slice(0, 5))); } catch (e) {}
    return 0;
  }
  async function restoreTrash(i) {
    const t = readTrash()[i];
    if (!t) { T.toast("복원할 자료가 없습니다.", "error"); return; }
    const n = Object.values(t.slots).reduce((a, e) => a + Object.keys(e).length, 0);
    if (!(await T.confirm(`'${t.label}' 이전 상태로 ${n}시간을 되살릴까요?\n지운 뒤에 새로 넣은 칸은 그대로 두고, 같은 칸이면 예전 것으로 돌아갑니다.`, { ok: "되살리기" }))) return;
    try {
      for (const [pid, e] of Object.entries(t.slots)) {
        if (!T.person(sc(), pid)) continue;
        const merged = { ...((A.slots[pid] && A.slots[pid].e) || {}), ...e };
        await store.saveSlots(A.sid, pid, merged);
        A.slots[pid] = { ...(A.slots[pid] || {}), e: merged };
      }
      A.idx = T.buildIndex(sc(), A.slots);
      const list = readTrash(); list.splice(i, 1); try { localStorage.setItem(trashKey(), JSON.stringify(list)); } catch (e) {}
      T.toast(`${n}시간을 되살렸습니다.`); render();
    } catch (err) { T.toast(err.message || "되살리지 못했습니다.", "error"); }
  }
  const CLEAR = {
    cls: (cls) => bulkClear(`${T.className(cls)} 시간표 지우기`, (pid, q) => q.cls === cls),
    grade: (g) => bulkClear(`${g}학년 시간표 지우기`, (pid, q) => T.gradeOf(q.cls) === g),
    subject: () => bulkClear("교과전담·강사 시간표 모두 지우기", (pid) => { const p = T.person(sc(), pid); return !!p && p.role !== "homeroom"; }),
    person: (id) => bulkClear(`${T.personName(sc(), id)} 선생님 시간표 지우기`, (pid) => pid === id),
  };

  /* 시정표: 쉬는 시간들(점심·중간놀이 …)을 넣어 시각 계산
     교시 사이 간격 = 그 자리에 점심·중간놀이가 있으면 그 분들의 합, 없으면 쉬는 시간 */
  function genTimes(x) {
    const g = T.schedGenOf(draft());
    let t = T.toMin(g.start);
    if (t == null) return false;
    const L = Number(g.lesson) || 40, Bk = Math.max(0, Number(g.brk) || 0), Lu = Math.max(0, Number(g.lunch) || 0);
    const times = []; let lunch = null;
    const brks = (x.breaks || []);
    for (let p = 1; p <= x.periods; p++) {
      times.push({ s: T.hm(t), e: T.hm(t + L) });
      t += L;
      if (p === x.periods) break;
      const here = [];
      if (x.lunchAfter === p && Lu) here.push({ lunch: true, min: Lu });
      brks.filter((b) => Number(b.after) === p).forEach((b) => here.push({ b, min: Math.max(0, Number(b.min) || 0) }));
      if (!here.length) { t += Bk; continue; }
      here.forEach((h) => { const span = { s: T.hm(t), e: T.hm(t + h.min) }; if (h.lunch) lunch = span; else Object.assign(h.b, span); t += h.min; });
    }
    x.times = times; x.lunch = lunch || {}; delete x.gen;
    return { first: times[0].s, last: times[times.length - 1].e, lunch };
  }
  function moveBreak(i, b, at) {
    const d = draft(), x = d.schedules[i]; if (!x) return;
    at = Math.max(1, Math.min(x.periods - 1, at));
    if (b === "lunch") x.lunchAfter = at; else { const br = (x.breaks || []).find((y) => y.id === b); if (!br) return; br.after = at; }
    const r = genTimes(x);

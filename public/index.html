window.TT_CONFIG={SERVER:!0,API_BASE:"",DEFAULT_SCHOOL:"",SITE_NAME:"함께 짜는 시간표",ALLOW_NEW_SCHOOL:!0},function(){const e=window.TT=window.TT||{};e.VERSION="1.28.0",e.RELEASED="2026-11-05",e.CHANGES=[["1.28.0","2026-11-05",["'임시시간표(보결)'을 따로 탭으로: 날짜 → 빠지는 선생님 → 수업 → 교사 명단에서 보결 배정","교사 명단 거르기: '이 시간에 수업이 없는 교사만'·'담임 중 보결 가능(우리 반이 교과전담 수업 중)'·'교과전담·강사만', 그 반 담임은 ★추천","담임·교과전담 선생님도 '🔗 학부모용 링크'(보기 전용 링크·QR)를 만들 수 있음"]],["1.27.0","2026-11-05",["체험 학교를 실제처럼: 18학급 시간표 468칸을 모두 채움, 교과전담은 영어(3~6)·체육(3~6)·음악(5·6) 4명이 18~24시간씩(한 분은 영어+음악), 이름은 만들 때마다 새로","과목마다 학년별 주당 시수(1·2학년 23 · 3·4학년 26 · 5·6학년 29)가 미리 들어 있음"]],["1.26.0","2026-11-05",["📅 날짜별 변경(결보강): 빠지는 선생님을 고르면 그날 수업과 빈 시간 선생님만 보강 후보로, 자습·수업 없음도. 이날 안내 PDF","선생님 하루 제한: '하루 ○시간까지'·'연속 ○시간까지' — 자동 배치가 지키고, 점검에 '하루 부담 초과'","최근 바뀐 시간표 기록(누가·언제·몇 칸, 관리자가 대신 넣은 것 표시)","보관함: 지금 시간표와 비교(달라진 칸 노랗게)","학생·학부모용 보기 전용 공개 링크와 QR","담임 알림: 지난번 들어온 뒤 우리 반 교담·강사 시간이 바뀌면 알려 줌","휴대폰: 머리 메뉴(☰)로 정리, 조회 단추 2줄, 선생님 찾기 칸, 작은 단추 키움","PC 조회: 고르기 왼쪽 · 시간표 오른쪽","과목 색 고르기 하나로, 시수 0은 '시수 정하기'로, '대신 입력 중' 띠, 빈 시간표 안내","인터넷이 끊기면 알려 주고 다시 연결되면 저절로 저장, 앱 크기 줄임"]],["1.25.1","2026-11-04",["출력: 교시 칸 시각이 잘리지 않게 (칸을 넓히고, 좁으면 ~ 앞에서 줄바꿈)","출력: '출력 날짜·시각 표시' 체크칸 — 종이 아래쪽에 출력한 날짜·시각"]],["1.25.0","2026-11-04",["한 선생님이 여러 과목: 기본설정 → 선생님에서 과목을 여러 개 고르기(첫 과목이 대표), 주간 입력에 '내 과목' 단추","교과전담 배정에서 선생님을 고르면 그 과목이 선생님 과목에 자동으로 더해짐","휴대폰: 장소 카드의 '여러 학급 동시 사용' 체크칸 고침, 선생님 카드의 '코드 새로'·'수업 불가 시간' 단추 이름을 알기 쉽게"]],["1.24.5","2026-11-04",["출력: 칸 크기에 맞춰 과목·학급 글자를 크게 (한 장에 1개면 약 2배), 교실·선생님 이름도 크게"]],["1.24.4","2026-11-04",["출력 미리보기: 휴대폰에서 '🔍 크게 보기'로 글자가 읽히는 크기로 (옆으로 밀어 보기)","출력: 한 장에 1개일 때 글자 크게, 교시 칸을 넓혀 시각(09:00~09:40)이 줄바뀜 없이"]],["1.24.3","2026-11-04",["바로 인쇄: 칸 색·음영이 빠지던 문제 고침 (브라우저가 배경색을 빼고 인쇄하지 않도록)"]],["1.24.2","2026-11-04",["출력: 용지에 1:1(정사각형) 추가 — PDF·JPG·인쇄 모두","출력: '교시 시각 표시' 끄고 켜기"]],["1.24.1","2026-11-04",["출력: 학년 이름(예: 1학년)을 누르면 그 학년 학급을 한꺼번에 고르기/풀기, 교사·강사별은 직위 이름으로 한꺼번에","학급 고르기 줄: 학급이 많아도 학년 이름 옆에 이어서 줄바꿈"]],["1.24.0","2026-11-04",["휴대폰: 시정표 화면 넘침 고침, 단추 묶음이 세로로 찌그러지지 않게,

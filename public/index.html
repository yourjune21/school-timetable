window.TT_CONFIG={SERVER:!0,API_BASE:"",DEFAULT_SCHOOL:"",SITE_NAME:"함께 짜는 시간표",ALLOW_NEW_SCHOOL:!0},function(){const e=window.TT=window.TT||{};e.VERSION="1.50.3",e.RELEASED="2026-11-06",e.CHANGES=[["1.50.3","2026-11-06",["특별실 요일별 표: 특별실 이름이 길면 옆 칸 글자와 겹치던 문제 — 이름은 줄바꿈, '(3층)' 같은 위치는 아랫줄 작은 글씨로","전체 화면 글자 겹침 점검(4가지 화면 폭 × 오늘·시간표·입력·대강·특별실·출력·기본설정 전 메뉴): 휴대폰 선생님 카드의 '하루 몇 시간까지' 칸 넘침도 고침"]],["1.50.2","2026-11-06",["기본설정 메뉴를 작업 순서대로: 학교 → 사람 → 수업 → 관리 (처음 설정 안내도 같은 순서: 기본 정보·학급·시정표·장소 → 선생님 → 과목·교과전담 현황)"]],["1.50.1","2026-11-06",["시정표 시각 칸: 휴대폰에서 '오전 9:0'처럼 잘리던 기본 시각 입력을 24시간 글자 칸(09:00)으로 — 930·0930·9:30 어느 쪽으로 넣어도 09:30, 1~6시는 오후로(130 → 13:30), 잘못 넣으면 되돌림 · 옆 '40분'도 바로 다시 계산"]],["1.50.0","2026-11-06",["특별실 탭에 요일별 조회: [오늘] [월]~[금] 단추 — 고르면 그 요일의 모든 특별실(연동·예약)을 1~6교시 × 특별실 표로, 오늘을 누르면 오늘 요일이 바로(주말엔 다음 수업일) · 특별실 이름을 누르면 그 특별실 시간표로","오늘 화면의 '오늘 특별실' 표는 뺌 (특별실 탭 요일별 조회로 옮김)"]],["1.49.0","2026-11-06",["오늘: 교담 시수에 협력수업(🤝 함께 들어가기)도 — 목표·넣은 시간에 함께 들어간 시간을 더함, 같은 과목 반에 협력해도 기준 시수에 묻히지 않음 ('협력 n 포함' 표시)","오늘 특별실을 표로: 1~6교시 × 특별실(연동·예약 모두) — 반·과목(예약은 내용) 표시, 내 수업·우리 반 칸 강조, 휴대폰은 표 안에서 가로 스크롤"]],["1.48.0","2026-11-05",["조회: '빈 줄 감추기' 스위치 — 수업이 하나도 없는 줄(학년마다 시각이 다른 4교시 줄 등)을 감춤, 기기에 기억","특별실마다 '동시에 여러 반'(겹치기 가능) 체크 — 따로 쓰는 특별실도 같은 칸에 두 반 이상 넣을 수 있음(＋ 반 더)"]],["1.47.2","2026-11-05",["교과전담 현황에 협력수업(🤝 함께 들어가기)도: 교과전담·강사가 담임 수업에 함께 들어간 시간이 그 학년·반에 잡힘 (🤝 협력 N) — 협력만 한 과목은 담임 화면에서 여전히 담임 과목"]],["1.47.1","2026-11-05",["전체 시간표(한눈에 보기) 출력: '출력 날짜·시각 표시'를 켜면 맨 아래 줄과 표가 겹치던 것 해결 — 학급이 많은 학교도 표가 종이 안에 맞게","교과전담 현황에 묶음 수업(1학년 통합·합반 등)도: 묶음의 교과전담·강사가 그 반들을 맡은 것으로 잡히고 시수에도 들어감 (📦 표시)"]],["1.47.0","2026-11-05",["야간 모드 전체 점검: 과목 표 시수 숫자, 파란 글자(묶음 인원·링크 등), 주황·초록·빨강 상태 글자, 빨간 단추, 점심 이름이 어두운 배경에서 잘 보이게","과목 설정에서 '기본 장소' 뺌 — 수업 장소는 선생님 기본 교실·입력할 때 고르는 장소로 정함","입력 화면 도구 줄이 메뉴 막대에 가려지지 않게","특별실 탭(연동 특별실): 수업이 든 칸을 누르면 장소 바꾸기 · 교사 바꾸기(관리자)"]],["1.46.0","2026-11-05",["과목을 학년군 없이 한 목록으로: 과목 × 학년 표에 주당 시수를 바로 입력(빈칸 = 그 학년은 안 함), 맨 아래 줄에 학년마다 합계/한 주 수업 칸 · ⠿로 순서 바꾸기 · 오른쪽에 누가 맡는지(교담) 표시","시정표: 학년군마다 색 띠가 있는 카드로 나눠 보이고 접기·펼치기(머리에 쓰는 학년·교시 수·점심 위치·시각 요약) · 모두 펼치기/접기"]],["1.45.0","2026-11-05",["교담 매칭을 선생님 카드로: 기본설정 → 선생님에서 과목마다 '맡는 반'(학년 전체 또는 반)을 고름 — 시간표에 넣으면 그 반이 저절로 더해짐","'교과전담 배정' → '교과전담 현황'(보기만): 학년·과목·선생님마다 반별로 넣은 시간/기준 시수, 덜 넣은 반은 주황색 · ✨ 교담 시간표 자동 배치는 맡는 반대로","과목은 학년·기준 시수·장소만 — 교담 때문에 과목을 학년마다 나눌 필요 없음 (예전 배정은 '맡는 반'으로 그대로 옮김)"]],["1.44.1","2026-11-05",["기본설정 → 선생님 카드 정리: 칸이 밀려 직위·담임 학급 고르기가 겹치고 왼쪽이 비던 것 해결 — 담임은 한 줄(이름·직위·학급·코드), 교과전담·강사는 두 줄 · 태블릿 폭도 맞춤"]],["1.44.0","2026-11-05",["학급 시간표에서 교담 정하기(관리자): 교담 과목을 넣으면 교과전담 배정의 그 선생님 시간표로 바로 들어감 — 도구 줄의 '→ ○○ 선생님 시간표로 (배정)'을 누르면 배정 무시","👤 교사 바꾸기: 장소 바꾸기처럼 선생님을 고르고 칸을 누르면 그 수업이 그 선생님 시간표로 옮겨짐 (칸 정보 창에서도) — 겹침·점심·수업 불가 시간 확인, 되돌리기 한 번에"]],["1.43.0","2026-11-05",["교담 배정을 '교과전담 배정' 한 곳으로: 과목 화면은 '교담 · 김영어 3·4학년 주2 ›'처럼 보이기만 하고, 누르면 그 학년 배정으로 바로 감 (배정 없는 과목은 '＋ 교담 배정')","선생님 담당 과목은 교과전담 배정에서 저절로 채움(🔒 배정에서 옴) — 배정 없는 과목만 직접 더함","교과전담 배정 화면에서 바로 '＋ 교과전담·강사 추가'"]],["1.42.1","2026-11-05",["기본설정 → 선생님·강사 표에서 '기본 교실' 칸을 뺌 (과목 기본 장소와 헷갈리지 않게) — 수업 장소는 과목 기본 장소·입력할 때 고르는 장소로 정함"]],["1.42.0","2026-11-05",["순서 끌기: 기본설정 → 선생님(교과전담·강사 등 직위별, 담임은 학급 순) · 따로 쓰는 특별실 — 정한 순서가 출력·보결·조회·입력 목록에도 그대로","출력에서 고르기: 학년(선생님은 직위)마다 접힌 채로 시작 — 머리의 ☑를 누르면 그 학년 모든 학급 고르기/풀기, 일부만 고르면 '–' 표시, 찾기 하면 맞는 묶음이 펼쳐짐","기본설정 → 교과전담 배정: 학년마다 접기(접으면 한 줄 요약, 다른 메뉴 다녀와도 유지) · 찾기 칸은 글자 칠 때마다 바로 거름"]],["1.41.0","2026-11-05",["화면 깨짐 정리: 입력 화면 '지우기'의 긴 버튼이 칸 밖으로 넘치던 것 → 칸 안에서 두 줄로","휴대폰: 기본설정 → 과목의 학년군 줄이 화면 밖으로 넘치던 것 정리 · 출력 '용도로 바로 맞추기' 글자 줄바꿈 정리"]],["1.40.0","2026-11-05",["엑셀 붙여넣기: 요일(월~금) 줄·교시(1~6) 칸 없이 과목 칸만 복사해도 됨 — 첫 칸 요일·첫 줄 교시를 골라 일부(예: 화요일 3교시부터)만 붙일 수도 있음","한 요일(세로 한 줄)만 복사해도 붙여넣기 · 빈 줄은 빈 교시로 두어 교시가 밀리지 않음"]],["1.39.0","2026-11-05",["📋 엑셀에서 붙여넣기: 엑셀·한글·구글 시트의 시간표 표를 복사해 붙이면 미리보기 뒤 한 번에 넣음 — 입력 화면에서 바로 Ctrl+V도 됨","학급 입력은 칸의 과목 이름(창체·스체 같은 줄임말, 목록에 없으면 직접 입력 과목), 주간 입력은 칸의 학급(5-1 · 5학년 1반 · 5-1 영어)을 읽음","교과전담 과목·묶음 칸은 그대로 두고, 겹치는 칸은 건너뛰거나(기본) 겹쳐서 넣기 · 빈 칸 지우기 · 한 번에 되돌리기"]],["1.38.0","2026-11-05",["이미 수업이 있는 칸·특별실이 차 있는 시간: 🗑 지우고 넣기 · 🤝 함께 들어가기 · ⚠ 겹쳐서 넣기 · 🏫 교실 재배치하기 · 취소를 한 창에서","교실 재배치하기: 그 시간에 비어 있는 교실만 고를 수 있게 보여 주고, 고른 교실로 넣음"]],["1.37.0","2026-11-05",["이미 다른 선생님 수업이 있는 칸에 넣으면 고르기 창: 🗑 지우고 넣기 · 🤝 함께 들어가기 · ⚠ 겹쳐서 넣기 · 취소","지우고 넣기는 관리자, 또는 교과전담·강사가 담임 칸을 지울 때만 (담임은 교과전담 칸을 못 지움) — 변경 기록에 남음"]],["1.36.0","2026-11-05",["첫 화면 '오늘': 역할마다 할 일(진행률·남은 반·겹침·시수 부족), 오늘 내 수업(보결 반영), 오늘 특별실","메뉴 묶음: 오늘 · 시간표(조회·입력) · 운영(보결·특별실) · 출력 · 기본설정 — 휴대폰은 아래 탭바","입력 도구 줄: 지금 쥔 도구(넣기·장소·지우개·함께)를 한 줄로, ✕ 도구 놓기 · 표시 뜻(🔒 ⚠ 🏫 🤝 ✎ 📌)","칸 정보 창: 도구 없이 칸을 누르면 과목·선생님·장소·겹침과 장소 바꾸기·지우기·함께 들어가기","지우거나 여러 칸이 바뀌면 [↶ 되돌리기] 알림","🔍 어디서나 찾기(Ctrl+K): 학급·선생님·특별실","🔔 알림함: 내 보결·겹침·우리 반 교담 변경","기본설정 메뉴 옆 요약(18학급 · 10건 ✓ …)","출력 용도 바로 맞추기: 교실 게시용 · 가정통신문용 · 교무실 한눈에 · 카톡 공유용(1:1)"]],["1.35.0","2026-11-05",["장소 붓: 학급·주간 입력에서 '🏫 장소 바꾸기'로 특별실을 고르고 넣어 둔 칸을 누르면 그 칸만 장소가 바뀜(과목 그대로, 다시 누르면 학급 교실) — 그 시간에 차 있으면 빨갛게 미리 표시","특별실 탭(연동): 학급을 고르면 칸마다 그 반 수업이 보이고, ＋ 칸을 누르면 그 수업이 이 특별실로, ✓ 칸을 누르면 학급 교실로"]],["1.34.0","2026-11-05",["'기본설정 → 장소'와 '특별실'을 '특별실' 탭 하나로: 모든 특별실·장소를 한곳에서 관리(관리자), 장소마다 '학급 시간표와 연동' 켜고 끄기","연동 ON: 수업 넣을 때 장소로 고르고 겹침 점검, 특별실 탭에서 그 장소의 수업이 그대로 보임 · OFF: 학급 시간표와 상관없는 예약표 (껐다 켜도 넣어 둔 수업·예약은 그대로 돌아옴)"]],["1.33.1","2026-11-05",["특별실 시간표: 넣은 칸에 그 학급의 학급 시간표 수업(예: 국어)을 작게 표시, 학급을 고르면 빈 칸마다 그 반 수업이 미리 보임, 넣는 창에도 표시 (연결은 하지 않음)"]],["1.33.0","2026-11-05",["기본설정 → 선생님: 직위별(담임교사·교과전담·스포츠강사 …)로 묶어 접었다 폈다","겹치는 시간도 넣을 수 있게: 한 번 묻고 '겹쳐서 넣기' → 칸이 빨갛게 '겹침', 입력 화면 위·조회·점검에 경고 (묶음 수업·점심시간은 지금처럼 막음)"]],["1.32.0","2026-11-05",["특별실 시간표 끌어 놓기: 학급을 표의 칸으로 끌어 놓기, 넣은 칸을 끌어 옮기기(다른 칸과 바꾸기), 학급을 고른 뒤 칸을 누르면 바로 들어감, 지우개 — 학년마다 시각이 다른 줄에는 맞는 학년만"]],["1.31.0","2026-11-05",["특별실 시간표: 교시마다 시각 표시, 학년마다 시각이 다른 교시(예: 4교시 5·6학년 / 1~4학년)는 줄을 나눠 따로 넣기 — 그 줄에 맞는 학년 반만 고르게, PDF에도","학급 시간표 입력: '점심시간 표시' 켜고 끄기 스위치 (이 기기에 기억)"]],["1.30.0","2026-11-05",["새 탭 '특별실': 학급 시간표와 따로 쓰는 특별실 예약표(컴퓨터실·도서실 등) — 관리자가 특별실을 만들고, 들어온 선생님 누구나 빈 칸에 우리 반을 넣음(내가 넣은 칸만 고침), 같은 교시 다른 요일에 한꺼번에, PDF로 저장, 실시간으로 함께 보임"]],["1.29.2","2026-11-05",["기본설정 → 선생님: PC에서도 한 사람을 카드 한 장으로 — 이름·직위·기본 교실이 잘리지 않음, 담임은 한 줄로 짧게"]],[
